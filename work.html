<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewing student work</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body class="workpage">

<div class="homebar">
  <div class="title" id="barTitle">Computing Teacher Console</div>
  <div class="subtabs worktabs">
    <button class="on" id="tabSeats">Seating plan</button>
    <button id="tabWork">View work</button>
  </div>
  <span class="grow"></span>
  <button class="btn-ghost" id="closeBtn">Close</button>
</div>

<!-- ================= seating plan ================= -->
<div id="seatPane" class="workwrap">
  <div class="toolrow">
    <button class="btn-primary" id="saveSeats">Save seating plan</button>
    <button class="btn-ghost" id="clearSeats">Clear the plan</button>
    <span class="sizer"><b>Zoom</b>
      <button class="btn-ghost iconbtn" id="lessSize" title="Zoom out">&minus;</button>
      <button class="btn-ghost iconbtn" id="addSize" title="Zoom in">+</button>
    </span>
    <span class="sizer"><b>Width</b>
      <button class="btn-ghost iconbtn" id="lessW" title="Narrower">&minus;</button>
      <button class="btn-ghost iconbtn" id="addW" title="Wider">+</button>
    </span>
    <span class="sizer"><b>Height</b>
      <button class="btn-ghost iconbtn" id="lessH" title="Shorter">&minus;</button>
      <button class="btn-ghost iconbtn" id="addH" title="Taller">+</button>
    </span>
    <span class="hint" id="seatMsg"></span>
  </div>
  <p class="hint">Drag a student onto the plan. Click one to open their work.</p>
  <div class="seatwrap">
    <div class="seatpool" id="seatPool"></div>
    <div class="seatboard" id="seatBoard">
      <div class="seatfront" id="seatFront">
        <span>Front</span>
        <span class="menuwrap">
          <button class="btn-ghost iconbtn frontdots" id="frontDots" title="Move the front">&#8942;</button>
          <span class="menu" id="frontMenu" hidden></span>
        </span>
      </div>
      <div class="seatgrid" id="seatGrid"></div>
    </div>
  </div>
</div>

<!-- ================= viewing work ================= -->
<div id="workPane" class="workwrap" hidden>
  <div class="worksplit">
    <div class="workmain">
      <div class="workbar">
    <button class="btn-ghost iconbtn" id="prevStu" title="Previous student">&larr;</button>
    <select id="stuPick"></select>
    <button class="btn-ghost iconbtn" id="nextStu" title="Next student">&rarr;</button>
    <button class="btn-ghost" id="viewMode">All on one page</button>
    <button class="btn-ghost" id="openPdf">PDF</button>
  </div>
      <div class="workframe"><iframe id="workFrame" title="Their work"></iframe></div>
      <div class="tasknav" id="taskNav"></div>
    </div>
    <aside class="workside">
      <h3>Feedback</h3>
      <p class="hint" id="fbWho"></p>
      <div class="bfield"><label>Comment</label><textarea id="fbComment" rows="5"></textarea></div>
      <div class="bfield" id="fbStrengthWrap" hidden>
        <label>Strength</label><textarea id="fbStrength" rows="3"></textarea>
        <div class="bank" id="bankStrength"></div>
      </div>
      <div class="bfield" id="fbTargetWrap" hidden>
        <label>Target</label><textarea id="fbTarget" rows="3"></textarea>
        <div class="bank" id="bankTarget"></div>
      </div>
      <div class="toolrow">
        <button class="btn-ghost" id="addStrength">+ Strength</button>
        <button class="btn-ghost" id="addTarget">+ Target</button>
      </div>
      <div class="bfield" id="markWrap" hidden>
        <label id="markLabel">Mark</label>
        <span class="markrow2" id="scoreRow">
          <input id="fbScore" type="number" min="0"> <span id="outOfLabel">out of 20</span>
        </span>
        <select id="fbGrade" class="bigselect" hidden></select>
        <p class="bhelp" id="gradeHelp"></p>
      </div>
      <button class="btn-primary wide" id="saveFb">Save feedback</button>
      <p class="hint" id="fbMsg"></p>
    </aside>
  </div>
</div>

<div class="modal-back" id="mBack" hidden><div class="modal" id="mBox"></div></div>

<script src="menus.js"></script>
<script src="settings.js"></script>
<script>
const $ = (id) => document.getElementById(id);
function on(id, ev, fn){
  const e = document.getElementById(id);
  if (!e){ console.warn("Nothing on the page with id:", id); return; }
  e.addEventListener(ev, fn);
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function openModal(build){
  const box = $("mBox");
  box.innerHTML = "";
  build(box);
  if (!box.querySelector(".modal-x")){
    const x = el("button","btn-ghost iconbtn modal-x","\u2715");
    x.addEventListener("click", closeModal);
    box.insertBefore(x, box.firstChild);
  }
  $("mBack").hidden = false;
}
function closeModal(){ $("mBack").hidden = true; }

const API = (window.HUB && window.HUB.API) || "";
const KEY = () => localStorage.getItem("hub_tkey") || "";
const H = () => ({ "x-teacher-key": KEY() });
const HJ = () => ({ "Content-Type":"application/json", "x-teacher-key": KEY() });

const qs = new URLSearchParams(location.search);
const lessonId = qs.get("lesson") || "";
const cls = qs.get("group") || "";

let lessonJson = null;
let roster = [];        // everyone in the class, alphabetical
let rows = [];          // what they have saved
let idx = 0;
let allPages = false;
let plan = { size: 96, w: 1, h: 1, seats: {}, front: "bottom" };   // size is the zoom; w and h shape each place
const SPAN = 20;                                      // how far the board goes in each direction
let lastStep = 0;                                     // the page being looked at

/* ---------------- getting everything ---------------- */
async function boot(){
  if (!API || !KEY()){
    $("seatMsg").textContent = "Open this from the teacher console so it knows your key.";
    return;
  }
  $("seatMsg").textContent = "Loading\u2026";
  try{
    const [lesson, students, work, seating] = await Promise.all([
      fetchLesson(), fetchRoster(), fetchWork(), fetchSeating()
    ]);
    lessonJson = lesson;
    roster = students.sort((a, b) => (a.display_name || "").localeCompare(b.display_name || ""));
    rows = work;
    try{
      const rr = await fetch(API + "/api/teacher/results?lesson=" + encodeURIComponent(lessonId) +
                             "&group=" + encodeURIComponent(cls), { headers: H(), cache:"no-store" });
      const rd = await rr.json();
      (rd.rows || []).forEach(r => {
        const st = (students || []).find(x => x.display_name === r.display_name);
        if (st) marks[st.username] = { score: r.score, outOf: r.out_of, grade: r.target || "" };
      });
    }catch(e){}
    if (seating && seating.seats) plan = Object.assign(plan, seating);
    $("barTitle").textContent = "Computing Teacher Console \u2022 Viewing Student Work for " +
      (lessonJson && lessonJson.title ? lessonJson.title : lessonId);
    document.title = "Student work \u2022 " + (lessonJson && lessonJson.title ? lessonJson.title : lessonId);
    paintSeats();
    paintPicker();
    $("seatMsg").textContent = "";
  }catch(e){ $("seatMsg").textContent = e.message; }
}
async function fetchLesson(){
  try{
    const r = await fetch("lessons/" + encodeURIComponent(lessonId) + ".json", { cache:"no-store" });
    if (r.ok) return await r.json();
  }catch(e){}
  const r2 = await fetch(API + "/api/catalog?lesson=" + encodeURIComponent(lessonId), { headers: H(), cache:"no-store" });
  const d = await r2.json();
  if (!r2.ok) throw new Error(d.error || "Could not open that lesson.");
  return d.lesson;
}
async function fetchRoster(){
  const r = await fetch(API + "/api/teacher/students?group=" + encodeURIComponent(cls), { headers: H(), cache:"no-store" });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Could not load the class.");
  return d.students || [];
}
async function fetchWork(){
  const r = await fetch(API + "/api/teacher/work?lesson=" + encodeURIComponent(lessonId) +
                        "&group=" + encodeURIComponent(cls), { headers: H(), cache:"no-store" });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Could not load their work.");
  return d.rows || [];
}
async function fetchSeating(){
  try{
    const r = await fetch(API + "/api/teacher/seating?group=" + encodeURIComponent(cls), { headers: H(), cache:"no-store" });
    const d = await r.json();
    return d && d.layout ? d.layout : null;
  }catch(e){ return null; }
}

/* ---------------- which half of the page is showing ---------------- */
function tab(which){
  const seats = which === "seats";
  $("seatPane").hidden = !seats;
  $("workPane").hidden = seats;
  $("tabSeats").classList.toggle("on", seats);
  $("tabWork").classList.toggle("on", !seats);
  if (!seats && !$("workFrame").src) showStudent(idx);
}
on("tabSeats", "click", () => tab("seats"));
on("tabWork", "click", () => tab("work"));
on("closeBtn", "click", () => { window.close(); setTimeout(() => { location.href = "admin.html"; }, 150); });

/* ---------------- the seating plan ---------------- */
function seatCard(st){
  const card = el("div","seat");
  card.draggable = true;
  card.dataset.user = st.username;
  card.appendChild(el("b","", st.display_name));
  card.appendChild(el("span","", st.username));
  card.addEventListener("dragstart", (e) => {
    if (e.dataTransfer){ e.dataTransfer.setData("text/plain", st.username); e.dataTransfer.effectAllowed = "move"; }
    card.classList.add("dragging");
  });
  card.addEventListener("dragend", () => card.classList.remove("dragging"));
  card.addEventListener("click", () => {
    const at = roster.findIndex(x => x.username === st.username);
    if (at >= 0){ idx = at; tab("work"); showStudent(at); }
  });
  return card;
}
function seatAt(c, r){
  return Object.keys(plan.seats).find(u => plan.seats[u] && plan.seats[u].c === c && plan.seats[u].r === r);
}
function paintSeats(){
  const pool = $("seatPool"), grid = $("seatGrid");
  pool.innerHTML = ""; grid.innerHTML = "";
  /* One big board of squares. The size setting decides how many fit on the
     screen — about ten across at the default. */
  grid.style.gridTemplateColumns = "repeat(" + SPAN + ", " + Math.round(plan.size * (plan.w || 1)) + "px)";
  grid.style.gridAutoRows = Math.round(plan.size * (plan.h || 1)) + "px";
  for (let r = 0; r < SPAN; r++){
    for (let c = 0; c < SPAN; c++){
      const cell = el("div","seatcell");
      cell.dataset.c = c; cell.dataset.r = r;
      cell.addEventListener("dragover", (e) => { e.preventDefault(); cell.classList.add("over"); });
      cell.addEventListener("dragleave", () => cell.classList.remove("over"));
      cell.addEventListener("drop", (e) => {
        e.preventDefault(); cell.classList.remove("over");
        const who = e.dataTransfer ? e.dataTransfer.getData("text/plain") : "";
        if (!who) return;
        const taken = seatAt(c, r);
        if (taken && taken !== who){
          /* two students swap places rather than one landing on the other */
          if (plan.seats[who]) plan.seats[taken] = plan.seats[who];
          else delete plan.seats[taken];
        }
        plan.seats[who] = { c: c, r: r };
        paintSeats();
      });
      const who = seatAt(c, r);
      const st = who ? roster.find(x => x.username === who) : null;
      if (st) cell.appendChild(seatCard(st));
      grid.appendChild(cell);
    }
  }
  paintFront();
  const spare = roster.filter(st => !plan.seats[st.username]);
  if (!spare.length) pool.appendChild(el("p","hint","Everyone has a seat"));
  else spare.forEach(st => pool.appendChild(seatCard(st)));
}
/* ---- where the front of the room is ---- */
const SIDES = [["top","Move to top"],["right","Move to right"],["bottom","Move to bottom"],["left","Move to left"]];
function paintFront(){
  const board = $("seatBoard"), front = $("seatFront");
  board.dataset.front = plan.front || "bottom";
  const menu = $("frontMenu");
  menu.innerHTML = "";
  SIDES.filter(p => p[0] !== (plan.front || "bottom")).forEach(p => {
    const b = el("button","", p[1]);
    b.addEventListener("click", (e) => { e.stopPropagation(); menu.hidden = true; plan.front = p[0]; paintSeats(); });
    menu.appendChild(b);
  });
}
on("frontDots", "click", (e) => {
  e.stopPropagation();
  const m = $("frontMenu");
  if (!m.hidden){ m.hidden = true; return; }
  const items = SIDES.filter(p => p[0] !== (plan.front || "bottom"))
                     .map(p => [p[1], () => { plan.front = p[0]; paintSeats(); }]);
  if (window.openMenu) window.openMenu($("frontDots"), m, "Move the front", items);
  else m.hidden = false;
});
document.addEventListener("pointerdown", (e) => {
  const m = $("frontMenu"), b = $("frontDots");
  if (!m || m.hidden) return;
  if (e.target === b || (b.contains && b.contains(e.target))) return;
  if (m.contains && m.contains(e.target)) return;
  m.hidden = true;
});
$("seatPool").addEventListener("dragover", (e) => { e.preventDefault(); $("seatPool").classList.add("over"); });
$("seatPool").addEventListener("dragleave", () => $("seatPool").classList.remove("over"));
$("seatPool").addEventListener("drop", (e) => {
  e.preventDefault(); $("seatPool").classList.remove("over");
  const who = e.dataTransfer ? e.dataTransfer.getData("text/plain") : "";
  if (who){ delete plan.seats[who]; paintSeats(); }
});
on("addSize", "click", () => { plan.size = Math.min(180, plan.size + 12); paintSeats(); });
on("lessSize", "click", () => { plan.size = Math.max(56, plan.size - 12); paintSeats(); });
on("addW", "click", () => { plan.w = Math.min(3, (plan.w || 1) + 0.25); paintSeats(); });
on("lessW", "click", () => { plan.w = Math.max(0.6, (plan.w || 1) - 0.25); paintSeats(); });
on("addH", "click", () => { plan.h = Math.min(3, (plan.h || 1) + 0.25); paintSeats(); });
on("lessH", "click", () => { plan.h = Math.max(0.6, (plan.h || 1) - 0.25); paintSeats(); });
on("clearSeats", "click", () => {
  openModal(box => {
    box.appendChild(el("h2","","Clear the seating plan?"));
    box.appendChild(el("p","modal-text","Everyone goes back to the waiting column. Nothing else is affected."));
    const yes = el("button","btn-primary modal-cta","Clear the plan");
    yes.style.background = "var(--red)";
    yes.addEventListener("click", () => { plan.seats = {}; paintSeats(); closeModal(); });
    const no = el("button","btn-ghost modal-stay","Keep it");
    no.addEventListener("click", closeModal);
    box.appendChild(yes); box.appendChild(no);
  });
});
on("saveSeats", "click", async () => {
  $("seatMsg").textContent = "Saving\u2026";
  try{
    const r = await fetch(API + "/api/teacher/seating", { method:"POST", headers: HJ(),
      body: JSON.stringify({ group: cls, layout: plan }) });
    if (!r.ok) throw new Error((await r.json()).error || "Could not save it.");
    $("seatMsg").textContent = "Saved.";
  }catch(e){ $("seatMsg").textContent = e.message; }
});

/* ---------------- one student's work ---------------- */
function paintPicker(){
  const sel = $("stuPick");
  sel.innerHTML = "";
  roster.forEach((st, i) => {
    const o = document.createElement("option");
    o.value = String(i);
    const row = rows.find(r => r.username === st.username);
    o.textContent = st.display_name + (row ? "" : "  \u00b7 nothing saved");
    sel.appendChild(o);
  });
  sel.value = String(idx);
}
window.addEventListener("message", (e) => {
  if (e && e.data && typeof e.data.hubWorkStep === "number") lastStep = e.data.hubWorkStep;
});
function showStudent(i, step){
  if (i < 0 || i >= roster.length) return;
  /* stay on the same page when moving to the next student */
  if (step === undefined) step = lastStep;
  idx = i;
  paintPicker();
  const st = roster[i];
  const row = rows.find(r => r.username === st.username);
  /* the lesson page reads this to know whose work to put on the screen */
  localStorage.setItem("hub_inspect", JSON.stringify({
    lesson: lessonId, idx: 0,
    list: [{ name: st.display_name, username: st.username,
             data: row ? row.data : {}, feedback: row ? (row.feedback || "") : "" }]
  }));
  $("workFrame").src = "lesson.html?id=" + encodeURIComponent(lessonId) +
    "&view=1&embed=1" + (allPages ? "&all=1" : "") +
    (step !== undefined && !allPages ? "&step=" + step : "") + "&t=" + Date.now();
  $("fbWho").textContent = st.display_name + (row ? "" : " \u2014 nothing saved yet");
  /* a practical assessment is marked by hand, so the boxes appear */
  paintMarking(st.username);
  loadFeedback(row);
  paintTaskNav();
}
on("prevStu", "click", () => showStudent(idx - 1));
on("nextStu", "click", () => showStudent(idx + 1));
on("stuPick", "change", () => showStudent(parseInt($("stuPick").value, 10) || 0));
on("viewMode", "click", () => {
  allPages = !allPages;
  $("viewMode").textContent = allPages ? "One page at a time" : "All on one page";
  showStudent(idx);
});
on("openPdf", "click", () => {
  showStudent(idx);
  window.open("lesson.html?id=" + encodeURIComponent(lessonId) + "&view=1&pdf=1", "_blank");
});
function paintTaskNav(){
  const nav = $("taskNav");
  nav.innerHTML = "";
  if (allPages) return;
  const blocks = (lessonJson && lessonJson.blocks) || [];
  blocks.forEach((b, i) => {
    const btn = el("button","tasknav-btn", String(i + 1));
    btn.title = b.title || b.type;
    btn.addEventListener("click", () => { lastStep = i; showStudent(idx, i); });
    nav.appendChild(btn);
  });
}

/* ---------------- feedback ---------------- */
function showing(which){ return !$("fb" + which + "Wrap").hidden; }
function paintFbButtons(){
  $("addStrength").textContent = showing("Strength") ? "Delete strength" : "+ Strength";
  $("addTarget").textContent = showing("Target") ? "Delete target" : "+ Target";
}
function loadFeedback(row){
  let f = {};
  if (row && row.feedback){
    try{ f = JSON.parse(row.feedback); }catch(e){ f = { comment: row.feedback }; }
  }
  $("fbComment").value = f.comment || "";
  $("fbStrength").value = f.strength || "";
  $("fbTarget").value = f.target || "";
  $("fbStrengthWrap").hidden = !f.strength;
  $("fbTargetWrap").hidden = !f.target;
  paintFbButtons();
  paintBank("Strength"); paintBank("Target");
  $("fbMsg").textContent = "";
}
/* Hiding one keeps whatever was typed, so it comes back if they change
   their mind. Only what is on screen is saved. */
function toggleFb(which){
  const wrap = $("fb" + which + "Wrap");
  wrap.hidden = !wrap.hidden;
  paintFbButtons();
  if (!wrap.hidden){ paintBank(which); $("fb" + which).focus(); }
}
/* The sentences written in the builder, offered as a starting point. Picking
   one fills the box, which the teacher can then reword. */
function bankFor(which){
  const topics = (lessonJson && lessonJson.topics) || {};
  const out = [];
  Object.keys(topics).forEach(k => {
    const t = topics[k] || {};
    const line = which === "Strength" ? t.strength : t.target;
    if (line) out.push({ topic: t.label || k, line: line });
  });
  if (which === "Target" && lessonJson && lessonJson.perfectTarget)
    out.push({ topic: "Full marks", line: lessonJson.perfectTarget });
  if (which === "Strength" && lessonJson && lessonJson.zeroStrength)
    out.push({ topic: "Made a start", line: lessonJson.zeroStrength });
  return out;
}
function paintBank(which){
  const holder = $("bank" + which);
  if (!holder) return;
  holder.innerHTML = "";
  const items = bankFor(which);
  if (!items.length) return;
  holder.appendChild(el("p","bankhead", "From your bank"));
  items.forEach(it => {
    const b = el("button","bankpick");
    b.appendChild(el("b","", it.topic));
    b.appendChild(el("span","", it.line));
    b.addEventListener("click", () => {
      const box = $("fb" + which);
      box.value = box.value.trim() ? (box.value.trim() + " " + it.line) : it.line;
      box.focus();
    });
    holder.appendChild(b);
  });
}
on("addStrength", "click", () => toggleFb("Strength"));
on("addTarget", "click", () => toggleFb("Target"));
on("saveFb", "click", () => {
  const hasS = showing("Strength"), hasT = showing("Target");
  if (hasS && !hasT) return askMissing("target", "strength");
  if (hasT && !hasS) return askMissing("strength", "target");
  saveFeedback();
});
function askMissing(missing, given){
  openModal(box => {
    box.appendChild(el("h2","", "Add a " + missing + " as well?"));
    box.appendChild(el("p","modal-text",
      "You have written a " + given + " but no " + missing + ". Students get the most from having both."));
    const add = el("button","btn-primary modal-cta","Add a " + missing);
    add.addEventListener("click", () => {
      closeModal();
      toggleFb(missing === "target" ? "Target" : "Strength");
    });
    const anyway = el("button","btn-ghost modal-stay","Save feedback without " + missing);
    anyway.addEventListener("click", () => { closeModal(); saveFeedback(); });
    box.appendChild(add); box.appendChild(anyway);
  });
}
let marks = {};
function markFor(user){ return marks[user] || null; }
/* A practical is marked either out of a total or with a grade, whichever the
   lesson was built with. */
function usesRubric(){ return !!(lessonJson && lessonJson.practical && lessonJson.marking === "rubric"); }
function paintMarking(user){
  const practical = !!(lessonJson && lessonJson.practical);
  $("markWrap").hidden = !practical;
  if (!practical) return;
  const mk = markFor(user);
  const rubric = usesRubric();
  $("scoreRow").hidden = rubric;
  $("fbGrade").hidden = !rubric;
  $("markLabel").textContent = rubric ? "Grade" : "Mark";
  if (rubric){
    const sel = $("fbGrade");
    sel.innerHTML = "";
    const none = document.createElement("option");
    none.value = ""; none.textContent = "Not graded yet";
    sel.appendChild(none);
    (lessonJson.rubric || []).forEach(g => {
      const o = document.createElement("option");
      o.value = g.name; o.textContent = g.name;
      sel.appendChild(o);
    });
    sel.value = mk && mk.grade ? mk.grade : "";
    showGradeHelp();
  } else {
    const total = lessonJson.outOf || 20;
    $("outOfLabel").textContent = "out of " + total;
    $("fbScore").max = String(total);
    $("fbScore").value = mk && typeof mk.score === "number" ? mk.score : "";
    $("gradeHelp").textContent = "";
  }
}
function showGradeHelp(){
  const pick = $("fbGrade").value;
  const g = ((lessonJson && lessonJson.rubric) || []).find(x => x.name === pick);
  $("gradeHelp").textContent = g && g.description ? g.description : "";
}
on("fbGrade", "change", showGradeHelp);
async function saveFeedback(){
  const st = roster[idx];
  if (!st) return;
  $("fbMsg").textContent = "Saving\u2026";
  try{
    const r = await fetch(API + "/api/teacher/feedback", { method:"POST", headers: HJ(),
      body: JSON.stringify({ username: st.username, lesson: lessonId,
                             strength: showing("Strength") ? $("fbStrength").value : "",
                             target: showing("Target") ? $("fbTarget").value : "",
                             text: $("fbComment").value }) });
    if (!r.ok) throw new Error((await r.json()).error || "Could not save it.");
    /* the mark or grade goes with the feedback */
    if (lessonJson && lessonJson.practical){
      const rubric = usesRubric();
      const grade = rubric ? $("fbGrade").value : "";
      const total = lessonJson.outOf || 20;
      const score = rubric ? 0 : (parseInt($("fbScore").value, 10) || 0);
      const worth = rubric ? 1 : total;
      if (rubric ? grade : $("fbScore").value !== ""){
        const mr = await fetch(API + "/api/teacher/set-mark", { method:"POST", headers: HJ(),
          body: JSON.stringify({ username: st.username, lesson: lessonId, overrides: {},
                                 score: score, outOf: worth, grade: grade }) });
        if (!mr.ok) throw new Error((await mr.json()).error || "Could not save the mark.");
        marks[st.username] = { score: score, outOf: worth, grade: grade };
      }
    }
    let row = rows.find(x => x.username === st.username);
    if (!row){ row = { username: st.username, display_name: st.display_name, data: {} }; rows.push(row); }
    row.feedback = JSON.stringify({
      strength: showing("Strength") ? $("fbStrength").value : "",
      target: showing("Target") ? $("fbTarget").value : "",
      comment: $("fbComment").value });
    $("fbMsg").textContent = "Saved.";
  }catch(e){ $("fbMsg").textContent = e.message; }
}

if (window.initSettings) initSettings(null);
boot();
</script>
</body>
</html>
