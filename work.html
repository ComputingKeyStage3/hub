<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewing student work</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="worklink.js"></script>
<script src="teacher.js"></script>
<script src="settings.js"></script>
<!-- for the one thing it names: the lesson id a practice sandbox is kept
     under, which has to be the same word here as in the sandbox itself -->
<script src="practice.js"></script>
</head>
<body class="workpage">

<div class="homebar">
  <div class="title" id="barTitle">Computing Teacher Console</div>
  <span class="grow"></span>
  <div class="subtabs worktabs">
    <button class="on" id="tabWork">View work</button>
    <button id="tabProgress">Progress</button>
  </div>
</div>

<div id="loadPane" class="workwrap loadpane">
  <div class="loading">
    <div class="load-dots"><span></span><span></span><span></span></div>
    <p class="loadmsg">Loading the class’s work…</p>
  </div>
</div>

<!-- ================= progress ================= -->
<div id="progressPane" class="workwrap" hidden>
  <div class="toolrow" id="progressFilters"></div>
  <p class="hint" id="progressMsg"></p>
  <div class="progresswrap">
    <table class="progresstable" id="progressTable"></table>
  </div>
</div>

<!-- ================= viewing work ================= -->
<div id="workPane" class="workwrap" hidden>
  <div class="worksplit">
    <div class="workmain">
      <div class="workbar">
    <button class="btn-ghost iconbtn" id="prevStu" title="Previous student">&larr;</button>
    <select id="stuPick"></select>
    <button class="btn-ghost iconbtn" id="nextStu" title="Next student">&rarr;</button>
    <button class="btn-ghost" id="viewMode">All on one page</button>
    <button class="btn-ghost" id="openPdf">PDF</button>
    <button class="btn-ghost" id="refreshWork" title="Fetch what has been saved since this page was opened">Refresh</button>
    <span class="hint" id="workFresh"></span>
  </div>
      <div class="workframe"><iframe id="workFrame" title="Their work"></iframe></div>
    </div>
    <aside class="workside">
      <h3>Feedback</h3>
      <p class="hint" id="fbWho"></p>
      <!-- Practice only: a sandbox is several programs and feedback belongs
           to one of them, so the boxes below say which. It follows whatever
           is open in the frame, and opens one when it is changed here. -->
      <div class="bfield" id="progWrap" hidden>
        <label for="progPick">Program</label>
        <select id="progPick" class="bigselect"></select>
      </div>
      <div class="bfield" id="markWrap" hidden>
        <label id="markLabel">Mark</label>
        <span class="markrow2" id="scoreRow">
          <input id="fbScore" type="number" min="0"> <span id="outOfLabel">out of 20</span>
        </span>
        <select id="fbGrade" class="bigselect" hidden></select>
        <p class="bhelp" id="gradeHelp"></p>
      </div>
      <div class="bfield" id="fbStrengthWrap">
        <label>Strength</label><textarea id="fbStrength" rows="3"></textarea>
        <div class="bank" id="bankStrength"></div>
      </div>
      <div class="bfield" id="fbTargetWrap">
        <label>Target</label><textarea id="fbTarget" rows="3"></textarea>
        <div class="bank" id="bankTarget"></div>
      </div>
      <div class="bfield"><label>General comment</label><textarea id="fbComment" rows="2"></textarea></div>
      <button class="btn-primary wide" id="saveFb">Save feedback</button>
      <p class="hint" id="fbMsg"></p>
    </aside>
  </div>
</div>

<div class="modal-back" id="mBack" hidden><div class="modal" id="mBox"></div></div>

<script src="menus.js"></script>
<script src="settings.js"></script>
<script src="shortmatch.js"></script>
<script>
/* Puts everything except the cross and the closing buttons into a part that
   scrolls on its own, so a long pop-up can be read on a small screen without
   its buttons sliding off the bottom. */
function scrollBody(box){
  if (!box || box.querySelector(".modal-scroll")) return;
  const kids = Array.from(box.children);
  const middle = kids.filter(n =>
    !n.classList.contains("modal-x") &&
    !n.classList.contains("modal-cta") &&
    !n.classList.contains("modal-stay"));
  if (middle.length < 2) return;
  const scroller = document.createElement("div");
  scroller.className = "modal-scroll";
  box.insertBefore(scroller, middle[0]);
  middle.forEach(n => scroller.appendChild(n));
}

const $ = (id) => document.getElementById(id);
function on(id, ev, fn){
  const e = document.getElementById(id);
  if (!e){ console.warn("Nothing on the page with id:", id); return; }
  e.addEventListener(ev, fn);
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function openModal(build){
  const box = $("mBox");
  box.innerHTML = "";
  build(box);
  if (!box.querySelector(".modal-x")){
    const x = el("button","btn-ghost iconbtn modal-x","\u2715");
    x.addEventListener("click", closeModal);
    box.insertBefore(x, box.firstChild);
  }
  scrollBody(box);
  $("mBack").hidden = false;
}
function closeModal(){ $("mBack").hidden = true; }

const API = (window.HUB && window.HUB.API) || "";
/* The session, or the key where there is no second factor to make one.
   teacher.js decides which; this page only has to ask. */
const H = () => window.teacherAuth.headers();
const HJ = () => window.teacherAuth.json();

const qs = new URLSearchParams(location.search);
/* ---- practice, rather than a lesson ----
   ?practice=1&group=8A[&student=jbloggs] shows a class's sandbox programs
   instead of a lesson's work. It is the same page throughout: the same
   student picker, the same feedback boxes down the right. What changes is
   where the work comes from (one reserved row per student rather than a
   lesson's), what is drawn in the frame (the sandbox rather than the lesson
   page) and that feedback is written against one program rather than the
   whole of it.

   Nothing in practice is marked, here or anywhere else, so the mark and the
   grade never appear, and neither does the Progress tab: a score on work
   nobody set would be the one thing the Practice tab was built not to be. */
const PRACTICE = qs.get("practice") === "1";
const SLOT = (window.practice && window.practice.sandbox && window.practice.sandbox.SLOT)
             || "__practice_sandbox";
/* A link handed in by a student carries the lesson on "id"; the console
   opens this page with "lesson" and a class alongside it. */
const lessonId = PRACTICE ? SLOT : (qs.get("lesson") || qs.get("id") || "");
const cls = qs.get("group") || "";
const OFFLINE = !!(window.HUB && window.HUB.OFFLINE);
let handedIn = null;          // the work that arrived on the address
let markedLink = "";          // what to hand back once it has been marked

let lessonJson = null;
let roster = [];        // everyone in the class, alphabetical
let rows = [];          // what they have saved
let idx = 0;
let allPages = false;
let lastStep = 0;                                     // the page being looked at

/* ---------------- getting everything ---------------- */

/* The dots belong to the wait, so anything that ends the wait without the work
   arriving takes them away with it. Three dots bouncing over "Sign in to see
   this class’s work." says the page is still on its way when it is not. */
function workStopped(why){
  $("loadPane").querySelector(".load-dots").hidden = true;
  $("loadPane").querySelector(".loadmsg").textContent = why;
}
function workWaiting(){
  $("loadPane").querySelector(".load-dots").hidden = false;
  $("loadPane").querySelector(".loadmsg").textContent = "Loading the class’s work…";
}

async function boot(){
  if (OFFLINE){ return bootFromLink(); }
  workWaiting();            // boot runs again after the sign-in asked for below
  if (!API){
    workStopped("This copy of the site has no server address in config.js.");
    return;
  }
  /* Opened straight from a bookmark rather than out of the console, so there
     is no session in this tab yet. Asking is better than sending them away. */
  if (!window.teacherAuth.have()){
    workStopped("Sign in to see this class’s work.");
    askToSignIn(boot);
    return;
  }
  try{
    /* There is no lesson behind a sandbox, so there is none to fetch: asking
       the catalogue for a lesson called __practice_sandbox would fail and
       take the whole screen down with it. */
    const [lesson, students, work] = await Promise.all([
      PRACTICE ? Promise.resolve(null) : fetchLesson(), fetchRoster(), fetchWork()
    ]);
    lessonJson = lesson;
    roster = students.sort((a, b) => (a.display_name || "").localeCompare(b.display_name || ""));
    rows = work;
    if (!PRACTICE) await loadMarks();
    if (PRACTICE){
      $("barTitle").textContent = "Computing Teacher Console \u2022 Practice programs \u2022 " + cls;
      document.title = "Practice programs \u00b7 " + cls;
      practiceBar();
    } else {
      $("barTitle").textContent = "Computing Teacher Console \u2022 Viewing Student Work for " +
        (lessonJson && lessonJson.title ? lessonJson.title : lessonId);
      document.title = "Student work \u00b7 " + (lessonJson && lessonJson.title ? lessonJson.title : lessonId);
    }
    if (!PRACTICE) paintProgress();
    /* Opened on one student, from a class list or the username search: start
       on them rather than on whoever is first alphabetically. */
    const asked = (qs.get("student") || "").toLowerCase();
    if (asked){
      const at = roster.findIndex(x => String(x.username || "").toLowerCase() === asked);
      if (at >= 0) idx = at;
    }
    paintPicker();
    $("loadPane").hidden = true;
    tab("work");            // looking at work is the usual reason to be here
  }catch(e){
    workStopped(e.message);
  }
}

/* The few pieces of the bar that only make sense against a lesson. A PDF is
   built out of a lesson's tasks, and "All on one page" is about a lesson's
   pages; a sandbox has neither. Practice is not marked, so there is nothing
   for the Progress tab to show either. */
function practiceBar(){
  ["viewMode","openPdf"].forEach(id => { const e = $(id); if (e) e.hidden = true; });
  const tabW = $("tabWork");
  if (tabW) tabW.textContent = "Programs";
  const tabP = $("tabProgress");
  if (tabP) tabP.hidden = true;
}
/* ---------------- one student, arriving on a link (no server) ----------------
   The whole hand-in is in the address, so there is no class to page through.
   Everything else on this page works as it does online: the same viewer, the
   same feedback boxes down the right. */
async function bootFromLink(){
  const shut = workStopped;
  if (!window.workLink || !window.workLink.supported)
    return shut("This browser cannot read work links. Ask for the work as a PDF instead.");
  handedIn = await window.workLink.readHash();
  if (!handedIn)
    return shut("Open a student's work link to mark it. There is nothing to show on its own.");
  if (handedIn.kind === "broken")
    return shut("The work could not be read out of this link. It was probably cut short on its way here. Ask for it again.");

  /* The student has this link too: it is the one they copied. Opening it
     again should show them their work, not the marking screen, so the first
     thing it asks is which of the two is holding it. */
  if (!(await whoIsThis(handedIn.n || "the student"))){
    return openStudentView();
  }

  try{ lessonJson = await fetchLesson(); }
  catch(e){ return shut(e.message); }

  /* One student, made to look like a class of one so the rest of the page
     does not have to know the difference. */
  const name = handedIn.n || "A student";
  roster = [{ username: "link", display_name: name }];
  rows = [{ username: "link", display_name: name, data: handedIn.d || {},
            feedback: handedIn.fb ? JSON.stringify(handedIn.fb) : "" }];
  if (handedIn.mk) marks.link = { score: handedIn.mk.score, outOf: handedIn.mk.outOf, grade: handedIn.mk.grade || "" };

  /* No class, so nobody to page to and no marks to compare. */
  document.querySelector(".worktabs").hidden = true;
  ["prevStu","nextStu","stuPick","refreshWork","workFresh"].forEach(id => { const e = $(id); if (e) e.remove(); });

  $("barTitle").textContent = "Marking " + name + " • " +
    (lessonJson && lessonJson.title ? lessonJson.title : lessonId);
  document.title = "Marking " + name;
  $("loadPane").hidden = true;
  tab("work");
  showStudent(0);
}

async function fetchLesson(){
  /* Offline the lessons folder is the only place a lesson can come from.
     With a server it is the database, and only the database: a leftover file
     of the same name must not stand in for what a teacher has published. */
  if (OFFLINE){
    const r = await fetch("lessons/" + encodeURIComponent(lessonId) + ".json", { cache:"no-store" });
    if (!r.ok) throw new Error("There is no lessons/" + lessonId + ".json.");
    return await r.json();
  }
  const reply = await fetch(API + "/api/catalog?lesson=" + encodeURIComponent(lessonId), { headers: H(), cache:"no-store" });
  const d = await reply.json();
  if (!reply.ok) throw new Error(d.error || "Could not open that lesson.");
  return d.lesson;
}
async function fetchRoster(){
  const r = await fetch(API + "/api/teacher/students?group=" + encodeURIComponent(cls), { headers: H(), cache:"no-store" });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Could not load the class.");
  return d.students || [];
}
async function fetchWork(){
  const r = await fetch(API + "/api/teacher/work?lesson=" + encodeURIComponent(lessonId) +
                        "&group=" + encodeURIComponent(cls), { headers: H(), cache:"no-store" });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Could not load their work.");
  return d.rows || [];
}
/* What has been marked so far. Pulled out of boot so Refresh can ask for it
   again: a colleague marking the same class in the next room is exactly the
   sort of thing a teacher presses Refresh to see. */
async function loadMarks(){
  try{
    const r = await fetch(API + "/api/teacher/results?lesson=" + encodeURIComponent(lessonId) +
                          "&group=" + encodeURIComponent(cls), { headers: H(), cache:"no-store" });
    const d = await r.json();
    (d.rows || []).forEach(row => {
      const st = roster.find(x => x.display_name === row.display_name);
      if (st) marks[st.username] = { score: row.score, outOf: row.out_of, grade: row.grade || "",
                                     strength: row.strength || "", target: row.target || "" };
    });
  }catch(e){}
}

/* The sign-in pop-up, when this tab has no session of its own. It stays open
   until the server accepts something, so a mistyped key is just a mistype. */
function askToSignIn(then){
  openModal(box => window.teacherAuth.form(box, {
    close: closeModal, then: then,
    why: "Sign in to see this class’s work." }));
}

/* Fetch what has been saved since the page was opened. Students carry on
   working while their work is being looked at, so what is on the screen goes
   stale within a lesson; without this the only way to see the rest was to
   reload and lose your place. */
async function refreshWork(){
  const btn = $("refreshWork");
  if (!btn || btn.disabled) return;
  const who = (roster[idx] || {}).username || "";
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = "Checking…";
  $("workFresh").textContent = "";
  try{
    /* The lesson comes back as well: the frame is given this copy rather
       than fetching its own, so this is the one press that picks up a lesson
       a colleague has edited since this screen was opened. It is also the
       one thing here that can fail without spoiling the press, because the
       work is what Refresh is for and the copy already in hand still draws
       the page. */
    const [students, work, lesson] = await Promise.all([fetchRoster(), fetchWork(),
      PRACTICE ? Promise.resolve(null) : fetchLesson().catch(() => null)]);
    roster = students.sort((a, b) => (a.display_name || "").localeCompare(b.display_name || ""));
    rows = work;
    if (lesson) lessonJson = lesson;
    if (!PRACTICE) await loadMarks();
    /* Back to the same student, by name rather than by position: somebody
       added to the class since would otherwise shift everyone along. */
    const back = roster.findIndex(x => x.username === who);
    paintPicker();
    if (!PRACTICE) paintProgress();
    showStudent(back < 0 ? 0 : back);
    const now = new Date();
    $("workFresh").textContent = "Up to date as of " +
      String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
  }catch(e){
    $("workFresh").textContent = e.message === "Failed to fetch" ? "Could not reach the server." : e.message;
  }finally{ btn.disabled = false; btn.textContent = label; }
}
on("refreshWork", "click", refreshWork);

/* ---------------- which half of the page is showing ---------------- */
function tab(which){
  if (!$("loadPane").hidden) return;      // nothing to show yet
  const progress = which === "progress";
  $("progressPane").hidden = !progress;
  $("workPane").hidden = progress;
  $("tabProgress").classList.toggle("on", progress);
  $("tabWork").classList.toggle("on", !progress);
  if (!progress && !framedYet) showStudent(idx);
}
on("tabProgress", "click", () => tab("progress"));
on("tabWork", "click", () => tab("work"));

/* ---------------- the progress markbook ----------------
   A student's saved work already holds everything a quantifiable task needs
   to be marked: rQuiz's solved array, a checklist's checks and manual ticks,
   the answer to an mc/order/blanks/short block. This walks the lesson the
   same way buildPdf does (a page or a group is not itself a task, so it is
   opened rather than counted) and marks each leaf the same way the lesson
   page, the assessment mark and the admin markbook already do, so a total
   here is never a second opinion on a score shown somewhere else. */
const TASK_LABEL = { quiz:"Quiz", mc:"Multiple choice", order:"Put in order",
                     blanks:"Fill the gaps", short:"Short answer",
                     ide:"Coding task", web:"Coding task" };
function plainText(html){ return String(html || "").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim(); }
function normAns(x){ return String(x || "").toLowerCase().trim().replace(/\s+/g," ").replace(/[.,!?;:'"]+$/g,""); }

function taskInfo(b){
  const label = TASK_LABEL[b.type];
  if (!label) return null;
  if (b.type === "quiz" && !(b.questions || []).length) return null;
  if ((b.type === "ide" || b.type === "web") && !(Array.isArray(b.checks) && b.checks.length)) return null;
  if (b.type === "blanks" && !/\[\[.*?\]\]/.test(String(b.text || ""))) return null;
  return { id: b.id, type: b.type, label: label,
           title: plainText(b.prompt || b.title) || label, block: b };
}
/* Pages, groups and extensions are not tasks themselves, they hold tasks;
   an assessment has no pages at all, so its blocks are already the leaves. */
function quantifiableTasks(){
  const out = [];
  const walk = (blocks) => (blocks || []).forEach(b => {
    if (b.type === "page" || b.type === "extension" || b.type === "group"){ walk(b.blocks); return; }
    const t = taskInfo(b);
    if (t) out.push(t);
  });
  walk((lessonJson && lessonJson.blocks) || []);
  return out;
}
/* { got, max } for one task. Marked the same way as markQuestion() in the
   console and computeAssessment() in the lesson page, so a total here never
   disagrees with a mark shown anywhere else. */
function scoreTask(b, v){
  if (b.type === "quiz"){
    const n = (b.questions || []).length;
    const got = (v && Array.isArray(v.solved)) ? v.solved.filter(Boolean).length : 0;
    return { got: got, max: n };
  }
  if (b.type === "mc") return { got: (v !== null && v !== undefined && v === b.answer) ? 1 : 0, max: 1 };
  if (b.type === "order"){
    const ok = Array.isArray(v) && Array.isArray(b.items) && v.length === b.items.length &&
               v.every((x, i) => x === i);
    return { got: ok ? 1 : 0, max: 1 };
  }
  if (b.type === "blanks"){
    const accepted = [];
    String(b.text || "").replace(/\[\[(.*?)\]\]/g, (_, g) => { accepted.push(g.split("|")); return ""; });
    let got = 0;
    accepted.forEach((set, i) => {
      const given = (v && v[i]) ? String(v[i]) : "";
      if (set.map(normAns).includes(normAns(given))) got++;
    });
    return { got: got, max: accepted.length };
  }
  if (b.type === "short")
    return { got: (window.shortAnswer && window.shortAnswer.mark(b, v).ok) ? 1 : 0, max: 1 };
  /* a checklist: every line counts once, whether a run ticked it or a
     teacher did, the same as the checklist's own "done of counted" score */
  const flags = (v && Array.isArray(v.checks)) ? v.checks : [];
  const manual = (v && v.manual && typeof v.manual === "object") ? v.manual : {};
  let got = 0;
  b.checks.forEach((c, i) => { if (c && c.manual ? manual[i] === true : !!flags[i]) got++; });
  return { got: got, max: b.checks.length };
}
function attempted(data, id){
  if (!data) return false;
  const v = data[id];
  if (v === null || v === undefined || v === "") return false;
  if (Array.isArray(v)) return v.some(x => x !== null && x !== undefined && x !== "");
  if (typeof v === "object") return Object.keys(v).length > 0;
  if (typeof v === "boolean") return v;
  return true;
}

/* Task types hidden by the filter pills. A type not yet seen is shown, so a
   fresh lesson opens with every column on. */
let progressHidden = new Set();
function paintProgress(){
  const filters = $("progressFilters"), table = $("progressTable"), msg = $("progressMsg");
  if (!filters || !table) return;
  const tasks = quantifiableTasks();
  filters.innerHTML = ""; table.innerHTML = "";
  if (!tasks.length){
    msg.textContent = "Nothing in this lesson can be scored automatically yet.";
    return;
  }
  msg.textContent = "";
  const labels = [...new Set(tasks.map(t => t.label))];
  labels.forEach(label => {
    const pill = el("button","progress-pill" + (progressHidden.has(label) ? "" : " on"), label);
    pill.addEventListener("click", () => {
      if (progressHidden.has(label)) progressHidden.delete(label); else progressHidden.add(label);
      paintProgress();
    });
    filters.appendChild(pill);
  });
  const shown = tasks.filter(t => !progressHidden.has(t.label));

  const head = el("tr");
  head.appendChild(el("th","pcol-name","Student"));
  shown.forEach(t => { const th = el("th","", t.label); th.title = t.title; head.appendChild(th); });
  head.appendChild(el("th","pcol-total","Total"));
  table.appendChild(head);

  roster.forEach(st => {
    const row = rows.find(r => r.username === st.username) || null;
    const data = row ? row.data : null;
    const tr = el("tr");
    const name = el("td","pcol-name");
    name.appendChild(el("b","", st.display_name));
    name.appendChild(el("span","", st.username));
    name.addEventListener("click", () => {
      const at = roster.findIndex(x => x.username === st.username);
      if (at >= 0){ idx = at; tab("work"); showStudent(at); }
    });
    tr.appendChild(name);
    let gotSum = 0, maxSum = 0;
    shown.forEach(t => {
      const sc = scoreTask(t.block, data ? data[t.id] : undefined);
      gotSum += sc.got; maxSum += sc.max;
      const td = el("td","progresscell");
      if (!attempted(data, t.id)) td.appendChild(el("span","none","\u2013"));
      else{
        const cls = sc.max === 0 ? "none" : sc.got === sc.max ? "yes" : sc.got > 0 ? "part" : "no";
        td.appendChild(el("span", cls, sc.got + "/" + sc.max));
      }
      tr.appendChild(td);
    });
    const total = el("td","pcol-total");
    total.appendChild(el("b","", gotSum + "/" + maxSum));
    tr.appendChild(total);
    table.appendChild(tr);
  });
}

/* ---------------- one student's work ---------------- */

/* Putting a new address on the frame only reloads it if the address has
   changed, so every student used to carry a timestamp on the end of theirs.
   That also meant the browser could never reuse the copy of lesson.html it
   already had: a third of a megabyte down the wire between one child and the
   next. Navigating the frame's own window reloads it whether the address has
   changed or not, so the timestamp can go and the cache can do its job. */
let framedYet = false;
function frameGo(url){
  const frame = $("workFrame");
  framedYet = true;
  try{
    if (frame.contentWindow) return frame.contentWindow.location.replace(url);
  }catch(e){}
  frame.src = url;
}
function paintPicker(){
  const sel = $("stuPick");
  if (!sel) return;             // a single hand-in has nobody to page between
  sel.innerHTML = "";
  roster.forEach((st, i) => {
    const o = document.createElement("option");
    o.value = String(i);
    const row = rows.find(r => r.username === st.username);
    const has = PRACTICE ? programsOf(row).length : !!row;

function showStudent(i, step){
  if (i < 0 || i >= roster.length) return;
  if (PRACTICE) return showPrograms(i);
  /* stay on the same page when moving to the next student */
  if (step === undefined) step = lastStep;
  idx = i;
  paintPicker();
  const st = roster[i];
  const row = rows.find(r => r.username === st.username);
  /* The lesson page reads this to know whose work to put on the screen, and
     the lesson itself goes with it. The frame is loaded again for every
     student, and it used to ask the API for the same lesson every time: one
     round trip to the server, in front of the work, thirty times for a class
     of thirty. This page already fetched it when it opened. Refresh is what
     fetches it again, so a lesson edited next door is one press away. */
  const box = {
    /* Offline the frame reads the lesson out of the lessons folder and could
       not use this copy anyway, and that browser's storage is where a
       student's own work lives. */
    lesson: lessonId, idx: 0, json: OFFLINE ? undefined : lessonJson,
    list: [{ name: st.display_name, username: st.username,
             data: row ? row.data : {}, feedback: row ? (row.feedback || "") : "" }]
  };
  try{ localStorage.setItem("hub_inspect", JSON.stringify(box)); }
  catch(e){
    /* A long lesson and a page of work together can be more than this
       browser will keep. The work is the part that cannot be asked for
       again from inside the frame, so the lesson is what goes. */
    delete box.json;
    localStorage.setItem("hub_inspect", JSON.stringify(box));
  }
  /* The progress bar in the frame counts the summary as one past the last
     page, the same as the teacher console does, and posts that number out
     when it opens. Asking for it again by number would clamp to the last
     page, so it is asked for by name. */
  const pages = ((lessonJson && lessonJson.blocks) || []).length;
  const onSummary = !allPages && step !== undefined && step >= pages;
  frameGo("lesson.html?id=" + encodeURIComponent(lessonId) +
    "&view=1&embed=1" + (allPages ? "&all=1" : "") +
    (onSummary ? "&summary=1" : "") +
    (step !== undefined && !allPages && !onSummary ? "&step=" + step : ""));
  $("fbWho").textContent = st.display_name + (row ? "" : ", nothing saved yet");
  /* a practical assessment is marked by hand, so the boxes appear */

/* The sentences written in the builder, offered as a starting point. Picking
   one fills the box, which the teacher can then reword. */
function bankFor(which){
  const topics = (lessonJson && lessonJson.topics) || {};
  const out = [];
  Object.keys(topics).forEach(k => {
    const t = topics[k] || {};
    const line = which === "Strength" ? t.strength : t.target;
    if (line) out.push({ topic: t.label || k, line: line });
  });
  if (which === "Target" && lessonJson && lessonJson.perfectTarget)
    out.push({ topic: "Full marks", line: lessonJson.perfectTarget });
  if (which === "Strength" && lessonJson && lessonJson.zeroStrength)
    out.push({ topic: "Made a start", line: lessonJson.zeroStrength });
  return out;
}
function paintBank(which){
  const holder = $("bank" + which);
  if (!holder) return;
  holder.innerHTML = "";
  if (!bankFor(which).length) return;
  const open2 = el("button","btn-ghost bmini2","From your bank\u2026");
  open2.addEventListener("click", () => bankPopup(which));
  holder.appendChild(open2);
}

/* Joins chosen sentences into one that reads properly, rather than a run of
   full stops. A full sentence keeps its own punctuation; a fragment is
   joined on with "and". */
function joinSentences(lines){
  const tidy = lines.map(t => String(t).trim()).filter(Boolean);
  if (!tidy.length) return "";
  if (tidy.length === 1) return tidy[0];
  const ended = (t) => /[.!?]$/.test(t);
  let out = "";
  tidy.forEach((line, i) => {
    if (!out){ out = line; return; }
    if (ended(out)){
      /* a new sentence: capital letter, and keep them apart */
      out += " " + line.charAt(0).toUpperCase() + line.slice(1);
    } else {
      /* still mid-sentence: join with a comma, and "and" before the last */
      const joiner = (i === tidy.length - 1) ? " and " : ", ";
      out += joiner + line.charAt(0).toLowerCase() + line.slice(1);
    }
  });
  if (!ended(out)) out += ".";
  return out;
}

/* The bank, with a search box and tick boxes so several can be combined. */
function bankPopup(which){
  const items = bankFor(which);
  const chosen = new Set();
  openModal(box => {
    box.classList.add("narrow");
    box.appendChild(el("h2","", which === "Strength" ? "Strengths you have written"
                                                     : "Targets you have written"));
    box.appendChild(el("p","modal-text",
      "Tick as many as you like. They are joined into one sentence, which you can then reword."));

    const find = el("input","searchbox bankfind");
    find.placeholder = "Search";
    box.appendChild(find);

    const list = el("div","banklist");
    box.appendChild(list);

    const preview = el("p","bankpreview","");
    box.appendChild(preview);

    function refresh(){
      const text = joinSentences(items.filter(it => chosen.has(it.line)).map(it => it.line));
      preview.textContent = text;
      preview.hidden = !text;
      add.disabled = !text;
    }
    function paint(){
      const term = (find.value || "").trim().toLowerCase();
      list.innerHTML = "";
      const shown = items.filter(it =>
        !term || it.line.toLowerCase().includes(term) || it.topic.toLowerCase().includes(term));
      if (!shown.length) list.appendChild(el("p","hint","Nothing matches that."));
      shown.forEach(it => {
        const row = el("label","opt bankrow");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = chosen.has(it.line);
        cb.addEventListener("change", () => {
          if (cb.checked) chosen.add(it.line); else chosen.delete(it.line);
          refresh();
        });
        row.appendChild(cb);
        const words = el("span","bankwords");
        words.appendChild(el("b","", it.topic));
        words.appendChild(el("span","", it.line));
        row.appendChild(words);
        list.appendChild(row);
      });
    }
    find.addEventListener("input", paint);

    const add = el("button","btn-primary modal-cta","Add to the box");
    add.disabled = true;
    add.addEventListener("click", () => {
      const target = $("fb" + which);
      const text = joinSentences(items.filter(it => chosen.has(it.line)).map(it => it.line));
      target.value = target.value.trim() ? joinSentences([target.value, text]) : text;
      closeModal();
      target.focus();
    });
    box.appendChild(add);
    paint(); refresh();
  });
}
/* There is nothing to save feedback against until a program is open, and it
   is asked here rather than only where the boxes are set up: paintFb runs
   after that as well as before it, and a plain `disabled = false` in the
   line below was quietly turning the button back on over a student with no
   programs at all. */
function fbLocked(){ return PRACTICE && !openProg; }

/* The Save button says where it is up to itself, the way a student's does,
   rather than leaving a line of text underneath to be read. It stays saying
   Saved until part of the feedback is changed. */
function paintFb(state){
  const btn = $("saveFb");
  if (!btn) return;
  if (state === "saving"){ btn.textContent = "Saving…"; btn.disabled = true; btn.dataset.saved = "no"; }
  else if (state === "saved"){ btn.textContent = "✓ Saved"; btn.disabled = fbLocked(); btn.dataset.saved = "yes"; }
  else { btn.textContent = "Save feedback"; btn.disabled = fbLocked(); btn.dataset.saved = "no"; }
}
["fbStrength","fbTarget","fbComment","fbScore","fbGrade"].forEach(id => {
  const e = $(id);
  if (!e) return;
  const undo = () => { if ($("saveFb").dataset.saved === "yes") paintFb("idle"); };
  e.addEventListener("input", undo);
  e.addEventListener("change", undo);
});

on("saveFb", "click", () => {

     writing one line about a program somebody made in their own time should

  /* Both boxes are on screen, so a missing one is a choice rather than an
     oversight. Only say something when exactly one has been filled in. */

let marks = {};

/* ---------------- who opened this link ----------------
   Resolves true for a teacher and false for the student it belongs to. The
   code is a staff-room word rather than a password: it keeps a class out of
   the marking screen, and it sits in this file where anyone could read it, so
   it is never the only thing protecting anything. */
const TEACHER_CODE = "memory4";

function whoIsThis(name){
  return new Promise(resolve => {
    const back = el("div","modal-back whogate no-print");
    const box = el("div","modal narrow");
    box.appendChild(el("h2","","Who are you?"));

    const mine = el("button","btn-primary modal-cta", name);
    mine.addEventListener("click", () => { back.remove(); resolve(false); });
    box.appendChild(mine);

    const asTeacher = el("button","btn-ghost modal-stay","Teacher");
    box.appendChild(asTeacher);

    /* The code box only appears once Teacher is pressed, so a student is not
       invited to have a go at it. */
    const codeWrap = el("div","field whocode");
    codeWrap.hidden = true;
    codeWrap.appendChild(el("label","","Teacher code"));
    const code = el("input");
    code.type = "password"; code.autocomplete = "off";
    codeWrap.appendChild(code);
    const err = el("p","err","");
    const go = el("button","btn-primary wide","Open the marking view");

    const check = () => {
      if (code.value.trim().toLowerCase() === TEACHER_CODE){ back.remove(); resolve(true); return; }
      err.textContent = "That code is not right.";
      code.select();
    };
    go.addEventListener("click", check);
    code.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
    code.addEventListener("input", () => { err.textContent = ""; });
    codeWrap.appendChild(err);
    codeWrap.appendChild(go);
    box.appendChild(codeWrap);

    asTeacher.addEventListener("click", () => {
      codeWrap.hidden = false;
      asTeacher.hidden = true;
      setTimeout(() => code.focus(), 30);
    });

    back.appendChild(box);
    document.body.appendChild(back);
    setTimeout(() => mine.focus(), 30);
  });
}

/* ---------------- handing marked work back (no server) ----------------
   There is nowhere to save it to, so the marking goes into a new link and
   the student opens that. It carries their work as well as the marking, so
   what comes back is the whole thing rather than a note about it. */
async function handBack(){
  const st = roster[idx];
  const row = rows.find(x => x.username === st.username) || {};
  const fb = {
    strength: showing("Strength") ? $("fbStrength").value : "",
    target: showing("Target") ? $("fbTarget").value : "",
    comment: $("fbComment").value
  };
  const box = { n: st.display_name, l: lessonId, d: row.data || {}, fb: fb };

  if (lessonJson && lessonJson.practical){
    const rubric = usesRubric();
    const grade = rubric ? $("fbGrade").value : "";
    const total = lessonJson.outOf || 20;
    if (rubric ? grade : $("fbScore").value !== ""){
      box.mk = { score: rubric ? 0 : (parseInt($("fbScore").value, 10) || 0),
                 outOf: rubric ? 1 : total, grade: grade };
      marks[st.username] = box.mk;
    }
  }
  if (markOverrides) box.ov = markOverrides;
  if (Object.keys(manualTicks).length) box.mt = manualTicks;
  row.feedback = JSON.stringify(fb);

  paintFb("saving");
  $("fbMsg").textContent = "";
  try{
    const blob = await window.workLink.pack(box);
    const url = new URL("lesson.html", location.href);
    url.search = "?id=" + encodeURIComponent(lessonId);
    url.hash = "f=" + blob;

      paintFb("idle");

}

function showMarkedLink(){

  openModal(box => {

      roster[idx].display_name + " opens this to see their marked work."));

    field.value = markedLink;

    const note = el("p","handin");
    if (copied){ note.dataset.state = "done"; note.textContent = "Copied \u2713"; }
    box.appendChild(note);
    const copy = el("button","btn-primary modal-cta", copied ? "Copy it again" : "Copy the link");
    copy.addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(markedLink);
        note.dataset.state = "done"; note.textContent = "Copied \u2713";
        copy.textContent = "Copy it again";
      }catch(e){
        field.focus(); field.select();
        note.dataset.state = ""; note.textContent = "Press Ctrl and C to copy it.";
      }
    });
    box.appendChild(copy);
    const done = el("button","btn-ghost modal-stay","Done");
    done.addEventListener("click", closeModal);
    box.appendChild(done);
    setTimeout(() => { field.focus(); field.select(); }, 30);
  });
}

/* Marks the teacher changed question by question, sent up from the viewer. */
let markOverrides = null;
/* and the checklist lines they ticked off by hand */
let manualTicks = {};
window.addEventListener("message", (e) => {
  if (!e || !e.data) return;
  if (e.data.hubMarks) markOverrides = e.data.hubMarks;
  /* Checklist lines only a teacher can judge, ticked in the viewer. Kept by
     task so several coding tasks in one lesson do not overwrite each other. */
  if (e.data.hubManual){
    const m = e.data.hubManual;
    if (m.id){ manualTicks[m.id] = m.flags || {}; }
  }
  /* An assessment marks itself and writes its own strength and target. They
     arrive here so a teacher opens the boxes already holding them, ready to
     be edited rather than written from nothing. Anything already typed, or
     already saved against this student, is left alone. */
  if (e.data.hubST){
    const st = e.data.hubST;
    if (st.strength && !$("fbStrength").value.trim()) $("fbStrength").value = st.strength;
    if (st.target && !$("fbTarget").value.trim()) $("fbTarget").value = st.target;
  }
});

if (window.initSettings) initSettings(null);
boot();
</script>
</body>
