<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prince Henry's Computing KS3</title>
<link rel="stylesheet" href="style.css">
<script>try{var _p=JSON.parse(localStorage.getItem("hub_prefs")||"{}");if(_p.bg)document.documentElement.dataset.bg=_p.bg;if(_p.font)document.documentElement.dataset.font=_p.font;}catch(e){}</script>
<script src="config.js"></script>
</head>
<body>

<div class="homebar">
  <div class="title">Prince Henry's Computing KS3</div>
  <button class="btn-ghost settings-btn" id="setBtn">&#9881;&#65038; Settings</button>
  <div class="auth" id="auth"></div>
</div>

<div class="page">

  <div class="masthead">
    <p class="eyebrow">Computing</p>
    <h1 id="headline">Sign in</h1>
  </div>

  <section class="station" id="loginCard">
    <div class="grid3">
      <div><label for="u">Username</label><input type="text" id="u" autocomplete="username"></div>
      <div><label for="p">Password</label><input type="password" id="p" autocomplete="current-password"></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn-primary" id="loginBtn">Sign in</button>
      <span class="err" id="loginErr" role="alert"></span>
    </div>
  </section>

  <div class="tabs">
    <button class="on" id="tabLessons">Lessons</button>
    <button id="tabResults">My results</button>
  </div>
  <div id="view-lessons">
    <div id="lessonList"><p class="hint">Loading…</p></div>
  </div>
  <div id="view-results" hidden>
    <div id="resultList"><p class="hint">Sign in to see your results.</p></div>
  </div>

</div>

<div class="modal-back no-print" id="setModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle" style="margin-top:0">Settings</h2>
    <div class="set-group">
      <span class="set-label">Background colour</span>
      <div class="swatches" id="swatches">
        <button class="swatch" data-bg="" style="background:#FAF5EC" title="Paper"></button>
        <button class="swatch" data-bg="white" style="background:#FFFFFF" title="White"></button>
        <button class="swatch" data-bg="blue" style="background:#EAF1F7" title="Soft blue"></button>
        <button class="swatch" data-bg="green" style="background:#ECF3EA" title="Soft green"></button>
        <button class="swatch" data-bg="peach" style="background:#FAEFE5" title="Peach"></button>
        <button class="swatch" data-bg="yellow" style="background:#FAF3D8" title="Soft yellow"></button>
        <button class="swatch" data-bg="dark" style="background:#23262E" title="Dark"></button>
      </div>
    </div>
    <div class="set-group">
      <span class="set-label">Font</span>
      <div class="font-opts" id="fontOpts">
        <button class="font-opt" data-font="" style="font-family:'Nunito'">Nunito — the standard font</button>
        <button class="font-opt" data-font="atkinson" style="font-family:'Atkinson Hyperlegible'">Atkinson Hyperlegible — extra-clear letters</button>
        <button class="font-opt" data-font="lexend" style="font-family:'Lexend'">Lexend — wide, easy-reading spacing</button>
        <button class="font-opt" data-font="comic" style="font-family:'Comic Neue'">Comic Neue — rounded and friendly</button>
      </div>
    </div>
    <button class="btn-primary modal-cta" id="setDone">Done</button>
  </div>
</div>

<script>
const API = (window.HUB && window.HUB.API) || "";
const ready = API && API.indexOf("PASTE_") !== 0;
const $ = (id) => document.getElementById(id);

function renderAuth(){
  const name = localStorage.getItem("hub_name");
  if (name && localStorage.getItem("hub_token")){
    $("auth").innerHTML = '<span class="who"><b></b></span> <button class="btn-ghost" id="outBtn">Sign out</button>';
    $("auth").querySelector("b").textContent = name;
    $("outBtn").addEventListener("click", () => {
      ["hub_token","hub_name","hub_group"].forEach(k => localStorage.removeItem(k));
      renderAuth();
    });
    $("loginCard").hidden = true;
    $("headline").textContent = "Pick a lesson, " + name.split(" ")[0];
  } else {
    $("auth").innerHTML = "";
    $("loginCard").hidden = false;
    $("headline").textContent = "Sign in";
  }
}
renderAuth();

$("loginBtn").addEventListener("click", async () => {
  $("loginErr").textContent = "";
  if (!ready){ $("loginErr").textContent = "Site not connected to its server yet (config.js)."; return; }
  try{
    const r = await fetch(API + "/api/login", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ username: $("u").value, password: $("p").value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Sign-in failed.");
    localStorage.setItem("hub_token", d.token);
    localStorage.setItem("hub_name", d.name);
    localStorage.setItem("hub_group", d.group || "");
    renderAuth();
  }catch(e){ $("loginErr").textContent = e.message; }
});
$("p").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });

/* housekeeping: clear stored work for retired or stale lessons */
const MAX_AGE_DAYS = 60;
function pruneStorage(validIds){
  const keep = new Set(validIds.map(id => "hub_work_" + id));
  const cutoff = Date.now() - MAX_AGE_DAYS * 86400000;
  const doomed = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (!k || k.indexOf("hub_work_") !== 0) continue;
    if (!keep.has(k)){ doomed.push(k); continue; }
    try{
      const d = JSON.parse(localStorage.getItem(k));
      if (d.__saved && new Date(d.__saved).getTime() < cutoff) doomed.push(k);
    }catch(e){ doomed.push(k); }
  }
  doomed.forEach(k => localStorage.removeItem(k));
}

let lessonTitles = {};
fetch("lessons/index.json").then(r => r.json()).then(data => {
  const units = data.units || [{ name: "", lessons: data }];
  const flat = units.flatMap(u => u.lessons);
  flat.forEach(l => { lessonTitles[l.id] = l.title; });
  try{ pruneStorage(flat.map(l => l.id)); }catch(e){}
  const box = $("lessonList"); box.innerHTML = "";
  units.forEach(u => {
    if (u.name){ const h = document.createElement("p"); h.className = "unit-head"; h.textContent = u.name; box.appendChild(h); }
    const wrap = document.createElement("div"); wrap.className = "lessons";
    u.lessons.forEach((l, i) => {
      const a = document.createElement("a");
      a.className = "lessonCard"; a.href = "lesson.html?id=" + encodeURIComponent(l.id);
      let done = false;
      try{ const w = JSON.parse(localStorage.getItem("hub_work_" + l.id) || "null"); done = !!(w && w.__done); }catch(e){}
      a.innerHTML = '<span class="num">' + String(i+1).padStart(2,"0") + '</span>' +
                    '<span class="body"><b></b><span></span></span>' +
                    (done ? '<span class="badge badge-done">\u2713 Complete</span>' : '') +
                    (l.assessment ? '<span class="badge">Assessment</span>' : '') +
                    '<span class="go">&rarr;</span>';
      a.querySelector("b").textContent = l.title;
      a.querySelector(".body span").textContent = l.description || "";
      wrap.appendChild(a);
    });
    box.appendChild(wrap);
  });
}).catch(() => { $("lessonList").innerHTML = '<p class="hint">Could not load the lesson list.</p>'; });

/* ---- settings: background + font, saved for every page ---- */
function prefs(){ try{ return JSON.parse(localStorage.getItem("hub_prefs") || "{}"); }catch(e){ return {}; } }
function paintPrefs(){
  const p = prefs();
  document.querySelectorAll("#swatches .swatch").forEach(b => b.classList.toggle("on", (p.bg || "") === b.dataset.bg));
  document.querySelectorAll("#fontOpts .font-opt").forEach(b => b.classList.toggle("on", (p.font || "") === b.dataset.font));
}
function setPref(k, v){
  const p = prefs(); p[k] = v;
  localStorage.setItem("hub_prefs", JSON.stringify(p));
  if (k === "bg"){ if (v) document.documentElement.dataset.bg = v; else delete document.documentElement.dataset.bg; }
  if (k === "font"){ if (v) document.documentElement.dataset.font = v; else delete document.documentElement.dataset.font; }
  paintPrefs();
}
$("setBtn").addEventListener("click", () => { paintPrefs(); $("setModal").hidden = false; });
$("setDone").addEventListener("click", () => { $("setModal").hidden = true; });
$("setModal").addEventListener("click", (e) => { if (e.target === $("setModal")) $("setModal").hidden = true; });
document.querySelectorAll("#swatches .swatch").forEach(b => b.addEventListener("click", () => setPref("bg", b.dataset.bg)));
document.querySelectorAll("#fontOpts .font-opt").forEach(b => b.addEventListener("click", () => setPref("font", b.dataset.font)));

/* ---- My results tab ---- */
$("tabLessons").addEventListener("click", () => switchTab("lessons"));
$("tabResults").addEventListener("click", () => switchTab("results"));
let resultsLoaded = false;
function switchTab(which){
  $("tabLessons").classList.toggle("on", which === "lessons");
  $("tabResults").classList.toggle("on", which === "results");
  $("view-lessons").hidden = which !== "lessons";
  $("view-results").hidden = which !== "results";
  if (which === "results" && !resultsLoaded) loadResults();
}
async function loadResults(){
  const token = localStorage.getItem("hub_token");
  const box = $("resultList");
  if (!token){ box.innerHTML = '<p class="hint">Sign in to see your results.</p>'; return; }
  if (!ready){ box.innerHTML = '<p class="hint">Site not connected to its server yet.</p>'; return; }
  box.innerHTML = '<p class="hint">Loading…</p>';
  try{
    const r = await fetch(API + "/api/results", { headers: { Authorization: "Bearer " + token } });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Could not load results.");
    resultsLoaded = true;
    box.innerHTML = "";
    if (!d.results.length){ box.innerHTML = '<p class="hint">No assessment results yet.</p>'; return; }
    d.results.forEach(res => {
      const card = document.createElement("a"); card.className = "result-card";
      card.href = "lesson.html?id=" + encodeURIComponent(res.lesson_id);
      const pct = Math.round(100 * res.score / Math.max(1, res.out_of));
      card.innerHTML = '<span class="sc"></span><span class="body"><b></b><span></span></span><span class="st"></span>';
      card.querySelector(".sc").textContent = res.score + " / " + res.out_of;
      card.querySelector("b").textContent = lessonTitles[res.lesson_id] || res.lesson_id;
      card.querySelector(".body span").textContent = pct + "% · " + new Date(res.updated_at + "Z").toLocaleDateString("en-GB");
      const st = card.querySelector(".st");
      if (res.strength || res.target){
        st.innerHTML = (res.strength ? "<b>Strength:</b> " : "") + (res.strength || "") +
                       (res.target ? "<br><i>Target:</i> " + res.target : "");
      }
      box.appendChild(card);
    });
  }catch(e){ box.innerHTML = '<p class="hint">' + e.message + '</p>'; }
}
</script>
</body>
</html>
