<svg xmlns="http://www.w3.org/2000/svg" width="640" height="422" viewBox="0 0 640 422" role="img" aria-label="Six kinds of picture, each with an empty box beside it"><title>Six kinds of picture, each with an empty box beside it</title><rect width="640" height="422" rx="8" fill="#f1f5f9"/><text x="24" y="41.0" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" dominant-baseline="central">A photo from a digital camera</text><text x="24" y="109.0" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" dominant-baseline="central">A company logo</text><text x="24" y="177.0" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" dominant-baseline="central">A scanned picture</text><text x="24" y="245.0" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" dominant-baseline="central">Plans for a new building</text><text x="24" y="313.0" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" dominant-baseline="central">A magazine cover</text><text x="24" y="381.0" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" dominant-baseline="central">A cartoon</text></svg>