<svg xmlns="http://www.w3.org/2000/svg" width="640" height="354" viewBox="0 0 640 354" role="img" aria-label="Five jobs in Blender, each with an empty box beside it for its key"><title>Five jobs in Blender, each with an empty box beside it for its key</title><rect width="640" height="354" rx="8" fill="#f1f5f9"/><text x="24" y="41.0" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start" dominant-baseline="central">Add a keyframe</text><text x="24" y="109.0" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start" dominant-baseline="central">Rename a shape</text><text x="24" y="177.0" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start" dominant-baseline="central">Add a loop cut</text><text x="24" y="245.0" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start" dominant-baseline="central">Extrude</text><text x="24" y="313.0" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a" text-anchor="start" dominant-baseline="central">Proportional editing on or off</text></svg>