<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher console — Prince Henry's Computing KS3</title>
<link rel="stylesheet" href="style.css">
<script>try{var _p=JSON.parse(localStorage.getItem("hub_prefs")||"{}");if(_p.bg)document.documentElement.dataset.bg=_p.bg;if(_p.font)document.documentElement.dataset.font=_p.font;}catch(e){}</script>
<script src="config.js"></script>
<script src="settings.js"></script>
</head>
<body>

<div class="homebar" id="topbar" hidden>
  <div class="title">Prince Henry's Computing KS3 — Teacher console</div>
  <span class="online-pill off" id="pill"><span class="odot"></span><span id="pillTxt">Offline</span></span>
  <button class="btn-ghost iconbtn" id="setBtn" title="Settings">&#9881;&#65038;</button>
</div>

<div class="page">

  <!-- ============ key ============ -->
  <div class="keywrap" id="keyView">
    <section class="station">
      <h2 style="margin:0 0 6px">Teacher console</h2>
      <p class="hint" style="margin:0 0 16px">Enter the teacher key to load your classes.</p>
      <div class="field"><input type="password" id="keyIn" placeholder="Teacher key" autocomplete="off"></div>
      <button class="btn-primary" id="keyGo" style="margin-top:12px; width:100%">Load classes</button>
      <p class="hint" id="keyMsg" style="margin:12px 0 0"></p>
    </section>
  </div>

  <!-- ============ classes grid ============ -->
  <div id="classesView" hidden>
    <h2 style="margin:22px 0 4px">Your classes</h2>
    <p class="hint" style="margin:0">Choose a class to manage its students and lessons.</p>
    <div class="classgrid" id="classGrid"></div>
  </div>

  <!-- ============ one class ============ -->
  <div id="classView" hidden>
    <button class="crumb" id="backClasses">&larr; All classes</button>
    <div class="classhead">
      <h2 id="clsName"></h2>
      <button class="btn-ghost iconbtn" id="renameBtn" title="Rename class">&#9998;</button>
    </div>
    <div class="bigcards">
      <button class="classtile" id="openStudents"><b>&#128101; Students</b><span id="stuCount"></span></button>
      <button class="classtile" id="openLessons"><b>&#128214; Lessons &amp; release</b><span>Unlock tasks, watch progress, view work</span></button>
    </div>
  </div>

  <!-- ============ students ============ -->
  <div id="studentsView" hidden>
    <button class="crumb" id="backClass1">&larr; <span class="bk"></span></button>
    <h2 style="margin:14px 0 6px">Students</h2>
    <div class="toolrow">
      <button class="btn-primary" id="addOneBtn">+ Add student</button>
      <button class="btn-ghost" id="addManyBtn">Add many at once</button>
    </div>
    <table class="stutable" id="stuTable"></table>
    <p class="hint" id="stuMsg" style="margin-top:12px"></p>
  </div>

  <!-- ============ lessons + release ============ -->
  <div id="lessonsView" hidden>
    <button class="crumb" id="backClass2">&larr; <span class="bk"></span></button>
    <h2 style="margin:14px 0 6px">Lessons</h2>
    <div class="lesson-picker">
      <select id="lessonSel"></select>
      <button class="btn-primary" id="loadLessonBtn">Load</button>
    </div>
    <div id="lessonDetail" hidden>
      <div class="toolrow">
        <button class="btn-primary" id="progressBtn">View Student Progress</button>
        <button class="btn-ghost" id="openAll">Open all</button>
        <button class="btn-ghost" id="lockAll">Lock all</button>
      </div>
      <p class="hint" id="relMsg" style="margin:0 0 12px"></p>
      <div id="taskList"></div>
    </div>
  </div>

</div>

<!-- one modal, many jobs -->
<div class="modal-back no-print" id="tmodal" hidden>
  <div class="modal" id="tmodalBox" role="dialog" aria-modal="true"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const API = (window.HUB && window.HUB.API) || "";
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function stripTags(x){ return String(x || "").replace(/<[^>]*>/g, ""); }
function esc(s){ return String(s); }

let KEY = "", groups = [], cls = "", students = [], lessons = [], lessonId = "", lessonJson = null;
let locks = new Set();
let workCache = { key: "", rows: [], t: 0 };
let relTimer = null, beatTimer = null;

const H = () => ({ "x-teacher-key": KEY });
const HJ = () => ({ "x-teacher-key": KEY, "Content-Type": "application/json" });

/* ---------- online pill ---------- */
function setOnline(on){
  $("pill").classList.toggle("off", !on);
  $("pillTxt").textContent = on ? "Online" : "Offline";
}
async function heartbeat(){
  try{
    const r = await fetch(API + "/api/teacher/groups", { headers: H(), cache: "no-store" });
    setOnline(r.ok);
  }catch(e){ setOnline(false); }
}

/* ---------- view switching ---------- */
const VIEWS = ["keyView","classesView","classView","studentsView","lessonsView"];
function show(view){
  VIEWS.forEach(v => { $(v).hidden = v !== view; });
  clearInterval(relTimer);
  if (view === "lessonsView"){ relTimer = setInterval(refreshRelease, 8000); }
}

/* ---------- modal ---------- */
function openModal(build){
  const box = $("tmodalBox");
  box.innerHTML = "";
  build(box);
  $("tmodal").hidden = false;
}
function closeModal(){ $("tmodal").hidden = true; }
$("tmodal").addEventListener("click", (e) => { if (e.target === $("tmodal")) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
function modalTitle(box, text){ const h = el("h2","",text); h.style.marginTop = "0"; box.appendChild(h); }
function fieldRow(box, label, type, value){
  const w = el("div","field");
  w.appendChild(el("label","",label));
  const i = el("input"); i.type = type || "text"; i.value = value || ""; i.autocomplete = "off";
  w.appendChild(i); box.appendChild(w);
  return i;
}

/* ---------- key ---------- */
async function tryKey(){
  KEY = $("keyIn").value.trim();
  if (!KEY){ $("keyMsg").textContent = "Type the teacher key first."; return; }
  $("keyMsg").textContent = "Checking\u2026";
  try{
    const r = await fetch(API + "/api/teacher/groups", { headers: H(), cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "That key was not accepted.");
    localStorage.setItem("hub_tkey", KEY);
    groups = d.groups || [];
    setOnline(true);
    $("topbar").hidden = false;
    clearInterval(beatTimer); beatTimer = setInterval(heartbeat, 25000);
    paintClasses();
    show("classesView");
  }catch(e){
    setOnline(false);
    $("keyMsg").textContent = e.message === "Failed to fetch" ? "Could not reach the server." : e.message;
  }
}
$("keyGo").addEventListener("click", tryKey);
$("keyIn").addEventListener("keydown", (e) => { if (e.key === "Enter") tryKey(); });

/* ---------- classes grid ---------- */
function paintClasses(){
  const g = $("classGrid"); g.innerHTML = "";
  if (!groups.length){ g.appendChild(el("p","hint","No students yet \u2014 open a class after adding some, or add them from any class page.")); }
  groups.forEach(gr => {
    const t = el("button","classtile");
    t.appendChild(el("b","", gr.name));
    t.appendChild(el("span","", gr.students + " student" + (gr.students === 1 ? "" : "s")));
    t.addEventListener("click", () => openClass(gr.name));
    g.appendChild(t);
  });
  const add = el("button","classtile");
  add.appendChild(el("b","","+ New class"));
  add.appendChild(el("span","","A class appears when its first student is added"));
  add.addEventListener("click", () => {
    openModal(box => {
      modalTitle(box, "New class");
      const i = fieldRow(box, "Class name (e.g. 8B)", "text", "");
      const go = el("button","btn-primary modal-cta","Open class");
      go.addEventListener("click", () => { const v = i.value.trim(); if (v){ closeModal(); openClass(v); } });
      box.appendChild(go);
    });
  });
  g.appendChild(add);
}
async function refreshGroups(){
  try{
    const r = await fetch(API + "/api/teacher/groups", { headers: H(), cache: "no-store" });
    const d = await r.json();
    if (r.ok) { groups = d.groups || []; paintClasses(); }
  }catch(e){}
}

/* ---------- one class ---------- */
function openClass(name){
  cls = name;
  $("clsName").textContent = cls;
  document.querySelectorAll(".bk").forEach(b => b.textContent = cls);
  const gr = groups.find(g => g.name === cls);
  $("stuCount").textContent = gr ? (gr.students + " on the roll \u2014 add, edit or remove") : "Add the first students";
  show("classView");
}
$("backClasses").addEventListener("click", () => { refreshGroups(); show("classesView"); });
$("backClass1").addEventListener("click", () => openClass(cls));
$("backClass2").addEventListener("click", () => openClass(cls));

$("renameBtn").addEventListener("click", () => {
  openModal(box => {
    modalTitle(box, "Rename class");
    const i = fieldRow(box, "Class name", "text", cls);
    const msg = el("p","hint",""); 
    const go = el("button","btn-primary modal-cta","Rename");
    go.addEventListener("click", async () => {
      const to = i.value.trim();
      if (!to || to === cls){ closeModal(); return; }
      msg.textContent = "Renaming\u2026";
      try{
        const r = await fetch(API + "/api/teacher/rename-group", { method:"POST", headers: HJ(), body: JSON.stringify({ from: cls, to }) });
        if (!r.ok) throw new Error((await r.json()).error || "Rename failed.");
        cls = to; await refreshGroups(); openClass(cls); closeModal();
      }catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(msg);
  });
});

/* ---------- students ---------- */
$("openStudents").addEventListener("click", async () => { show("studentsView"); await loadStudents(); });
async function loadStudents(){
  $("stuMsg").textContent = "Loading\u2026";
  try{
    const r = await fetch(API + "/api/teacher/students?group=" + encodeURIComponent(cls), { headers: H(), cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Could not load students.");
    students = d.students || [];
    paintStudents();
    $("stuMsg").textContent = students.length ? "" : "No students in " + cls + " yet \u2014 add the first above.";
  }catch(e){ $("stuMsg").textContent = e.message; }
}
function paintStudents(){
  const t = $("stuTable"); t.innerHTML = "";
  students.forEach(st => {
    const tr = el("tr");
    const td1 = el("td","", st.display_name); td1.style.fontWeight = "700";
    const td2 = el("td","", st.username); td2.style.color = "var(--muted)";
    const td3 = el("td");
    const ed = el("button","btn-ghost iconbtn","\u270E"); ed.title = "Edit " + st.display_name;
    const dl = el("button","btn-ghost iconbtn","\u{1F5D1}"); dl.title = "Delete " + st.display_name; dl.style.marginLeft = "6px";
    ed.addEventListener("click", () => editStudent(st));
    dl.addEventListener("click", () => confirmDelete(st));
    td3.appendChild(ed); td3.appendChild(dl);
    tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
    t.appendChild(tr);
  });
}
function pwField(box, label){
  const w = el("div","field");
  w.appendChild(el("label","",label));
  const row = el("div","pwrow");
  const i = el("input"); i.type = "password"; i.autocomplete = "new-password";
  const eye = el("button","btn-ghost iconbtn","\u{1F441}"); eye.type = "button"; eye.title = "Show/hide";
  eye.addEventListener("click", () => { i.type = i.type === "password" ? "text" : "password"; });
  row.appendChild(i); row.appendChild(eye); w.appendChild(row); box.appendChild(w);
  return i;
}
function editStudent(st){
  openModal(box => {
    modalTitle(box, "Edit student");
    const d = fieldRow(box, "Display name", "text", st.display_name);
    const u = fieldRow(box, "Username", "text", st.username);
    const p = pwField(box, "Set a new password");
    box.appendChild(el("p","subnote","Existing passwords are stored scrambled and can't be shown \u2014 type a new one here to reset it, and use the eye to check your typing."));
    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta","Save changes");
    go.addEventListener("click", async () => {
      msg.textContent = "Saving\u2026";
      const payload = { username: st.username };
      if (d.value.trim() && d.value.trim() !== st.display_name) payload.display = d.value.trim();
      if (u.value.trim() && u.value.trim() !== st.username) payload.newUsername = u.value.trim();
      if (p.value) payload.newPassword = p.value;
      try{
        const r = await fetch(API + "/api/teacher/update-student", { method:"POST", headers: HJ(), body: JSON.stringify(payload) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "Could not save.");
        closeModal(); loadStudents();
      }catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(msg);
  });
}
function confirmDelete(st){
  openModal(box => {
    modalTitle(box, "Delete " + st.display_name + "?");
    box.appendChild(el("p","modal-text","This removes their login AND all their saved work and results. It cannot be undone."));
    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta","Yes, delete"); go.style.background = "var(--red)";
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    go.addEventListener("click", async () => {
      msg.textContent = "Deleting\u2026";
      try{
        const r = await fetch(API + "/api/teacher/delete-student", { method:"POST", headers: HJ(), body: JSON.stringify({ username: st.username }) });
        if (!r.ok) throw new Error((await r.json()).error || "Could not delete.");
        closeModal(); loadStudents(); refreshGroups();
      }catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(no); box.appendChild(msg);
  });
}
$("addOneBtn").addEventListener("click", () => {
  openModal(box => {
    modalTitle(box, "Add a student to " + cls);
    const d = fieldRow(box, "Display name", "text", "");
    const u = fieldRow(box, "Username", "text", "");
    const p = pwField(box, "Password");
    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta","Add student");
    go.addEventListener("click", async () => {
      if (!u.value.trim() || p.value.length < 4){ msg.textContent = "Username and a password of at least 4 characters are needed."; return; }
      msg.textContent = "Adding\u2026";
      try{
        const r = await fetch(API + "/api/teacher/students", { method:"POST", headers: HJ(),
          body: JSON.stringify({ students: [{ group: cls, username: u.value.trim(), password: p.value, displayName: d.value.trim() || u.value.trim() }] }) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "Could not add.");
        closeModal(); loadStudents(); refreshGroups();
      }catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(msg);
  });
});
$("addManyBtn").addEventListener("click", () => {
  openModal(box => {
    modalTitle(box, "Add many to " + cls);
    box.appendChild(el("p","modal-text","One student per line: username, password, display name. Re-adding an existing username resets their password."));
    const ta = el("textarea"); ta.rows = 8; ta.placeholder = "jsmith, otter42, Jamie Smith"; ta.style.width = "100%";
    box.appendChild(ta);
    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta","Add students");
    go.addEventListener("click", async () => {
      const rows = ta.value.split("\n").map(l => l.split(",").map(x => x.trim())).filter(p2 => p2[0]);
      const list = rows.map(p2 => ({ group: cls, username: p2[0], password: p2[1] || "", displayName: p2[2] || p2[0] }));
      if (!list.length){ msg.textContent = "Nothing to add yet."; return; }
      msg.textContent = "Adding\u2026";
      try{
        const r = await fetch(API + "/api/teacher/students", { method:"POST", headers: HJ(), body: JSON.stringify({ students: list }) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "Could not add.");
        msg.textContent = "Added " + j.added + (j.skipped ? " \u00b7 skipped " + j.skipped + " (missing name or password under 4 characters)" : "");
        loadStudents(); refreshGroups();
      }catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(msg);
  });
});

/* ---------- lessons + release ---------- */
$("openLessons").addEventListener("click", async () => {
  show("lessonsView");
  $("lessonDetail").hidden = true;
  lessonId = "";
  if (!lessons.length) await loadLessonIndex();
});
async function loadLessonIndex(){
  const d = await (await fetch("lessons/index.json", { cache: "no-store" })).json();
  lessons = d.units ? d.units.flatMap(u => u.lessons) : d;
  $("lessonSel").innerHTML = "";
  const ph = el("option","","Choose lesson"); ph.value = ""; ph.disabled = true; ph.selected = true;
  $("lessonSel").appendChild(ph);
  lessons.forEach(l => {
    const o = el("option","", l.title + (l.assessment ? " (assessment)" : ""));
    o.value = l.id; $("lessonSel").appendChild(o);
  });
}
$("lessonSel").addEventListener("change", () => { $("lessonDetail").hidden = true; lessonId = ""; });
$("loadLessonBtn").addEventListener("click", loadLesson);
async function loadLesson(){
  const chosen = $("lessonSel").value;
  if (!chosen) return;
  lessonId = chosen;
  workCache = { key: "", rows: [], t: 0 };
  lessonJson = await (await fetch("lessons/" + lessonId + ".json", { cache: "no-store" })).json();
  $("lessonDetail").hidden = false;
  await refreshRelease();
}
async function refreshRelease(){
  if (!lessonId) return;
  try{
    const r = await fetch(API + "/api/release?lesson=" + encodeURIComponent(lessonId) + "&group=" + encodeURIComponent(cls) + "&t=" + Date.now(), { cache: "no-store" });
    const d = await r.json();
    if (Array.isArray(d.locks)) locks = new Set(d.locks);
    else if (d.managed && typeof d.released === "number"){
      locks = new Set();
      for (let i = d.released; i < (lessonJson ? lessonJson.blocks.length : 0); i++) locks.add(i);
    } else locks = new Set();
    setOnline(true);
  }catch(e){ setOnline(false); }
  paintTasks();
}
async function postLocks(next){
  $("relMsg").textContent = "Updating\u2026";
  try{
    const r = await fetch(API + "/api/release", { method:"POST", headers: HJ(),
      body: JSON.stringify({ lesson: lessonId, group: cls, locks: [...next].sort((a,b)=>a-b) }) });
    if (!r.ok) throw new Error((await r.json()).error || "Could not update.");
    locks = next;
    $("relMsg").textContent = "";
  }catch(e){ $("relMsg").textContent = e.message; }
  paintTasks();
}
$("openAll").addEventListener("click", () => postLocks(new Set()));
$("lockAll").addEventListener("click", () => postLocks(new Set(lessonJson.blocks.map((_, i) => i))));
function stepTitle(b, i){ return stripTags(b.title || b.prompt || b.task || "") || b.type; }
function paintTasks(){
  const list = $("taskList"); list.innerHTML = "";
  if (!lessonJson) return;
  $("relMsg").textContent = locks.size === 0
    ? "Every task is open for " + cls + "."
    : locks.size === lessonJson.blocks.length
      ? "Every task is locked for " + cls + "."
      : locks.size + " task" + (locks.size === 1 ? "" : "s") + " locked for " + cls + ".";
  lessonJson.blocks.forEach((b, i) => {
    const open = !locks.has(i);
    const row = el("div","taskrow" + (open ? "" : " locked"));
    row.appendChild(el("span","tn", (i+1) + "."));
    const t = el("span","", stepTitle(b, i)); t.style.flex = "1"; row.appendChild(t);
    row.appendChild(el("span","statechip " + (open ? "open" : "shut"), open ? "Open" : "Locked"));
    const btns = el("span","taskbtns");
    const lock = el("button","btn-ghost iconbtn", open ? "\u{1F513}" : "\u{1F512}");
    lock.title = open ? "Lock this task" : "Unlock this task";
    lock.addEventListener("click", () => {
      const next = new Set(locks);
      if (open) next.add(i); else next.delete(i);
      postLocks(next);
    });
    const eye = el("button","btn-ghost iconbtn","\u{1F441}");
    eye.title = "Preview as a student";
    eye.addEventListener("click", () => window.open("lesson.html?id=" + encodeURIComponent(lessonId) + "&preview=" + i, "_blank"));
    const who = el("button","btn-ghost iconbtn","\u{1F465}");
    who.title = "Who has done this task?";
    who.addEventListener("click", () => whoDone(i, b));
    btns.appendChild(lock); btns.appendChild(eye); btns.appendChild(who);
    row.appendChild(btns);
    list.appendChild(row);
  });
}

/* ---------- progress + who's done (from the same work snapshots) ---------- */
async function getWorkRows(){
  const key = lessonId + "\u0000" + cls;
  if (workCache.key === key && Date.now() - workCache.t < 15000) return workCache.rows;
  const r = await fetch(API + "/api/teacher/work?lesson=" + encodeURIComponent(lessonId) + "&group=" + encodeURIComponent(cls), { headers: H(), cache: "no-store" });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Could not load work.");
  workCache = { key, rows: d.rows || [], t: Date.now() };
  return workCache.rows;
}
async function getRoster(){
  if (students.length && workCache.rosterFor === cls) return students;
  const r = await fetch(API + "/api/teacher/students?group=" + encodeURIComponent(cls), { headers: H(), cache: "no-store" });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Could not load students.");
  students = d.students || []; workCache.rosterFor = cls;
  return students;
}
function nonEmpty(v){
  if (v === null || v === undefined || v === "") return false;
  if (Array.isArray(v)) return v.some(x => x);
  if (typeof v === "object") return Object.keys(v).length > 0;
  return true;
}
function inspect(row, stepIdx){
  localStorage.setItem("hub_inspect", JSON.stringify({ lesson: lessonId, name: row.display_name, data: row.data }));
  window.open("lesson.html?id=" + encodeURIComponent(lessonId) + "&view=1" + (stepIdx !== undefined ? "&step=" + stepIdx : ""), "_blank");
}
$("progressBtn").addEventListener("click", async () => {
  openModal(async (box) => {
    modalTitle(box, "Progress \u2014 " + cls);
    const holder = el("div"); box.appendChild(holder);
    holder.appendChild(el("p","hint","Loading\u2026"));
    try{
      const [roster, rows] = [await getRoster(), await getWorkRows()];
      holder.innerHTML = "";
      const total = lessonJson.blocks.length;
      roster.forEach(st => {
        const row = rows.find(w => w.username === st.username);
        const line = el("div","who-row");
        line.appendChild(el("span","nm", st.display_name));
        let status, cl = "no";
        if (!row){ status = "Not started"; }
        else if (row.data.__done){ status = "Completed \u2713"; cl = "yes"; }
        else {
          const n = Math.min((row.data.__step || 0), total - 1);
          status = "Task " + (n + 1) + " of " + total + ": " + stepTitle(lessonJson.blocks[n], n).slice(0, 34);
        }
        line.appendChild(el("span","st " + cl, status));
        const v = el("button","btn-ghost iconbtn","\u{1F441}"); v.title = "View their work";
        if (row) v.addEventListener("click", () => inspect(row)); else v.disabled = true;
        line.appendChild(v);
        holder.appendChild(line);
      });
      if (!roster.length) holder.appendChild(el("p","hint","No students in this class yet."));
    }catch(e){ holder.innerHTML = ""; holder.appendChild(el("p","hint", e.message)); }
    const done = el("button","btn-ghost modal-stay","Close"); done.addEventListener("click", closeModal);
    box.appendChild(done);
  });
});
async function whoDone(i, b){
  openModal(async (box) => {
    modalTitle(box, "Task " + (i+1) + " \u2014 who's done it?");
    box.appendChild(el("p","modal-text", stepTitle(b, i)));
    const holder = el("div"); box.appendChild(holder);
    holder.appendChild(el("p","hint","Loading\u2026"));
    try{
      const [roster, rows] = [await getRoster(), await getWorkRows()];
      holder.innerHTML = "";
      roster.forEach(st => {
        const row = rows.find(w => w.username === st.username);
        const d = row && row.data;
        const done = !!(d && (d.__done || (d.__step || 0) > i || nonEmpty(d[b.id])));
        const line = el("div","who-row");
        line.appendChild(el("span","nm", st.display_name));
        line.appendChild(el("span","st " + (done ? "yes" : "no"), done ? "Done \u2713" : "Not yet"));
        const v = el("button","btn-ghost iconbtn","\u{1F441}"); v.title = "View at this task";
        if (row) v.addEventListener("click", () => inspect(row, i)); else v.disabled = true;
        line.appendChild(v);
        holder.appendChild(line);
      });
    }catch(e){ holder.innerHTML = ""; holder.appendChild(el("p","hint", e.message)); }
    const done2 = el("button","btn-ghost modal-stay","Close"); done2.addEventListener("click", closeModal);
    box.appendChild(done2);
  });
}

/* ---------- boot ---------- */
if (window.initSettings) initSettings($("setBtn"));
const savedKey = localStorage.getItem("hub_tkey");
if (savedKey){ $("keyIn").value = savedKey; tryKey(); }
</script>
