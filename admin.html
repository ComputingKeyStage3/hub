<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher console — Prince Henry's Computing KS3</title>
<link rel="stylesheet" href="style.css">
<script>try{var _p=JSON.parse(localStorage.getItem("hub_prefs")||"{}");if(_p.bg)document.documentElement.dataset.bg=_p.bg;if(_p.font)document.documentElement.dataset.font=_p.font;}catch(e){}</script>
<script src="config.js"></script>
<script src="settings.js"></script>
</head>
<body>

<div class="homebar" id="topbar" hidden>
  <div class="title">Prince Henry's Computing KS3 — Teacher console</div>
  <span class="online-pill off" id="pill"><span class="odot"></span><span id="pillTxt">Offline</span></span>
  <button class="btn-ghost iconbtn" id="setBtn" title="Settings">&#9881;&#65038;</button>
</div>

<div class="page">

  <!-- ============ key ============ -->
  <div class="keywrap" id="keyView">
    <section class="station">
      <h2 style="margin:0 0 6px">Teacher console</h2>
      <p class="hint" style="margin:0 0 16px">Enter the teacher key to load your classes.</p>
      <div class="field"><input type="password" id="keyIn" placeholder="Teacher key" autocomplete="off"></div>
      <button class="btn-primary" id="keyGo" style="margin-top:12px; width:100%">Load classes</button>
      <p class="hint" id="keyMsg" style="margin:12px 0 0"></p>
    </section>
  </div>

  <!-- ============ classes grid ============ -->
  <div id="classesView" hidden>
    <h2 style="margin:22px 0 4px">Your classes</h2>
    <p class="hint" style="margin:0">Choose a class to manage its students and lessons.</p>
    <div class="classgrid" id="classGrid"></div>
  </div>

  <!-- ============ one class ============ -->
  <div id="classView" hidden>
    <button class="crumb" id="backClasses">&larr; All classes</button>
    <div class="classhead">
      <h2 id="clsName"></h2>
      <button class="btn-ghost iconbtn" id="renameBtn" title="Rename class">&#9998;</button>
    </div>
    <div class="bigcards">
      <button class="classtile" id="openStudents"><b>&#128101; Students</b><span id="stuCount"></span></button>
      <button class="classtile" id="openLessons"><b>&#128218; Units &amp; lessons</b><span>Publish, lock, watch progress, view work</span></button>
    </div>
  </div>

  <!-- ============ students ============ -->
  <div id="studentsView" hidden>
    <button class="crumb" id="backClass1">&larr; <span class="bk"></span></button>
    <h2 style="margin:14px 0 6px">Students</h2>
    <div class="toolrow">
      <button class="btn-primary" id="addOneBtn">+ Add student</button>
      <button class="btn-ghost" id="addManyBtn">Add many at once</button>
    </div>
    <div id="resetBox"></div>
    <table class="stutable" id="stuTable"></table>
    <p class="hint" id="stuMsg" style="margin-top:12px"></p>
  </div>

  <!-- ============ lessons + release ============ -->
  <div id="unitsView" hidden>
    <button class="crumb" id="backClass2">&larr; <span class="bk"></span></button>
    <h2 style="margin:14px 0 4px">Units</h2>
    <p class="hint" style="margin:0">Lessons live inside units. Choose one to publish and pace its lessons.</p>
    <div class="classgrid" id="unitGrid"></div>
  </div>

  <div id="lessonsView" hidden>
    <button class="crumb" id="backUnits">&larr; Units</button>
    <div class="classhead">
      <h2 id="unitName"></h2>
      <button class="btn-ghost iconbtn" id="renameUnitBtn" title="Rename unit">&#9998;</button>
      <button class="btn-ghost iconbtn" id="deleteUnitBtn" title="Delete unit">&#128465;</button>
    </div>
    <div class="toolrow">
      <button class="btn-ghost" id="addLessonBtn">+ Add a lesson to this unit</button>
    </div>
    <div class="lessongrid" id="lessonGrid"></div>
  </div>

</div>

<!-- one modal, many jobs -->
<div class="modal-back no-print" id="tmodal" hidden>
  <div class="modal" id="tmodalBox" role="dialog" aria-modal="true"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const API = (window.HUB && window.HUB.API) || "";
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function stripTags(x){ return String(x || "").replace(/<[^>]*>/g, ""); }
function esc(s){ return String(s); }

let KEY = "", groups = [], cls = "", students = [], lessons = [], lessonId = "", lessonJson = null;
let workCache = { key: "", rows: [], t: 0 };
let relTimer = null, beatTimer = null;

const H = () => ({ "x-teacher-key": KEY });
const HJ = () => ({ "x-teacher-key": KEY, "Content-Type": "application/json" });

/* ---------- online pill ---------- */
function setOnline(on){
  $("pill").classList.toggle("off", !on);
  $("pillTxt").textContent = on ? "Online" : "Offline";
}
async function heartbeat(){
  try{
    const r = await fetch(API + "/api/teacher/groups", { headers: H(), cache: "no-store" });
    setOnline(r.ok);
  }catch(e){ setOnline(false); }
}

/* ---------- view switching ---------- */
const VIEWS = ["keyView","classesView","classView","studentsView","unitsView","lessonsView"];
function show(view){
  VIEWS.forEach(v => { $(v).hidden = v !== view; });
  clearInterval(relTimer);
}

/* ---------- modal ---------- */
function openModal(build){
  const box = $("tmodalBox");
  box.innerHTML = "";
  build(box);
  $("tmodal").hidden = false;
}
function closeModal(){ $("tmodal").hidden = true; }
$("tmodal").addEventListener("click", (e) => { if (e.target === $("tmodal")) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
function modalTitle(box, text){ const h = el("h2","",text); h.style.marginTop = "0"; box.appendChild(h); }
function fieldRow(box, label, type, value){
  const w = el("div","field");
  w.appendChild(el("label","",label));
  const i = el("input"); i.type = type || "text"; i.value = value || ""; i.autocomplete = "off";
  w.appendChild(i); box.appendChild(w);
  return i;
}

/* ---------- key ---------- */
async function tryKey(){
  KEY = $("keyIn").value.trim();
  if (!KEY){ $("keyMsg").textContent = "Type the teacher key first."; return; }
  $("keyMsg").textContent = "Checking\u2026";
  try{
    const r = await fetch(API + "/api/teacher/groups", { headers: H(), cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "That key was not accepted.");
    localStorage.setItem("hub_tkey", KEY);
    groups = d.groups || [];
    setOnline(true);
    $("topbar").hidden = false;
    clearInterval(beatTimer); beatTimer = setInterval(heartbeat, 25000);
    paintClasses();
    show("classesView");
  }catch(e){
    setOnline(false);
    $("keyMsg").textContent = e.message === "Failed to fetch" ? "Could not reach the server." : e.message;
  }
}
$("keyGo").addEventListener("click", tryKey);
$("keyIn").addEventListener("keydown", (e) => { if (e.key === "Enter") tryKey(); });

/* ---------- classes grid ---------- */
function paintClasses(){
  const g = $("classGrid"); g.innerHTML = "";
  if (!groups.length){ g.appendChild(el("p","hint","No students yet \u2014 open a class after adding some, or add them from any class page.")); }
  groups.forEach(gr => {
    const t = el("button","classtile");
    t.appendChild(el("b","", gr.name));
    t.appendChild(el("span","", gr.students + " student" + (gr.students === 1 ? "" : "s")));
    t.addEventListener("click", () => openClass(gr.name));
    g.appendChild(t);
  });
  const add = el("button","classtile");
  add.appendChild(el("b","","+ New class"));
  add.appendChild(el("span","","A class appears when its first student is added"));
  add.addEventListener("click", () => {
    openModal(box => {
      modalTitle(box, "New class");
      const i = fieldRow(box, "Class name (e.g. 8B)", "text", "");
      const go = el("button","btn-primary modal-cta","Open class");
      go.addEventListener("click", () => { const v = i.value.trim(); if (v){ closeModal(); openClass(v); } });
      box.appendChild(go);
    });
  });
  g.appendChild(add);
}
async function refreshGroups(){
  try{
    const r = await fetch(API + "/api/teacher/groups", { headers: H(), cache: "no-store" });
    const d = await r.json();
    if (r.ok) { groups = d.groups || []; paintClasses(); }
  }catch(e){}
}

/* ---------- one class ---------- */
async function openClass(name){
  cls = name;
  try{ await loadClassLocks(); }catch(e){}
  $("clsName").textContent = cls;
  document.querySelectorAll(".bk").forEach(b => b.textContent = cls);
  const gr = groups.find(g => g.name === cls);
  $("stuCount").textContent = gr ? (gr.students + " on the roll \u2014 add, edit or remove") : "Add the first students";
  show("classView");
}
$("backClasses").addEventListener("click", () => { refreshGroups(); show("classesView"); });
$("backClass1").addEventListener("click", () => openClass(cls));
$("backClass2").addEventListener("click", () => openClass(cls));

$("renameBtn").addEventListener("click", () => {
  openModal(box => {
    modalTitle(box, "Rename class");
    const i = fieldRow(box, "Class name", "text", cls);
    const msg = el("p","hint",""); 
    const go = el("button","btn-primary modal-cta","Rename");
    go.addEventListener("click", async () => {
      const to = i.value.trim();
      if (!to || to === cls){ closeModal(); return; }
      msg.textContent = "Renaming\u2026";
      try{
        const r = await fetch(API + "/api/teacher/rename-group", { method:"POST", headers: HJ(), body: JSON.stringify({ from: cls, to }) });
        if (!r.ok) throw new Error((await r.json()).error || "Rename failed.");
        cls = to; await refreshGroups(); openClass(cls); closeModal();
      }catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(msg);
  });
});

/* ---------- students ---------- */
$("openStudents").addEventListener("click", async () => { show("studentsView"); await loadStudents(); });
async function loadResets(){
  const box = $("resetBox"); box.innerHTML = "";
  try{
    const r = await fetch(API + "/api/teacher/resets", { headers: H(), cache: "no-store" });
    const d = await r.json();
    if (!r.ok) return;
    const mine = (d.requests || []).filter(x => (x.group_name || "").toLowerCase() === cls.toLowerCase());
    if (!mine.length) return;
    const card = el("div","station"); card.style.marginBottom = "18px";
    card.appendChild(el("b","","Password help requested"));
    card.appendChild(el("p","hint","Approving lets them sign in with an empty password box and choose a new one."));
    mine.forEach(x => {
      const line = el("div","who-row");
      line.appendChild(el("span","nm", x.display_name + " (" + x.username + ")"));
      const yes = el("button","btn-primary","Approve");
      const no = el("button","btn-ghost","Deny"); no.style.marginLeft = "8px";
      yes.addEventListener("click", async () => { await resetAction("approve-reset", x.username); });
      no.addEventListener("click", async () => { await resetAction("deny-reset", x.username); });
      line.appendChild(yes); line.appendChild(no);
      card.appendChild(line);
    });
    box.appendChild(card);
  }catch(e){}
}
async function resetAction(action, username){
  try{
    await fetch(API + "/api/teacher/" + action, { method:"POST", headers: HJ(), body: JSON.stringify({ username }) });
  }catch(e){}
  loadResets(); loadStudents();
}

async function loadStudents(){
  loadResets();
  $("stuMsg").textContent = "Loading\u2026";
  try{
    const r = await fetch(API + "/api/teacher/students?group=" + encodeURIComponent(cls), { headers: H(), cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Could not load students.");
    students = d.students || [];
    paintStudents();
    $("stuMsg").textContent = students.length ? "" : "No students in " + cls + " yet \u2014 add the first above.";
  }catch(e){ $("stuMsg").textContent = e.message; }
}
function paintStudents(){
  const t = $("stuTable"); t.innerHTML = "";
  students.forEach(st => {
    const tr = el("tr");
    const td1 = el("td","", st.display_name); td1.style.fontWeight = "700";
    const td2 = el("td"); td2.style.color = "var(--muted)";
    td2.appendChild(el("span","", st.username));
    if (!st.pw_set) td2.appendChild(el("span","statechip shut","No password yet"));
    if (st.reset_req) td2.appendChild(el("span","statechip open","Reset asked"));
    const td3 = el("td");
    const ed = el("button","btn-ghost iconbtn","\u270E"); ed.title = "Edit " + st.display_name;
    const dl = el("button","btn-ghost iconbtn","\u{1F5D1}"); dl.title = "Delete " + st.display_name; dl.style.marginLeft = "6px";
    ed.addEventListener("click", () => editStudent(st));
    dl.addEventListener("click", () => confirmDelete(st));
    td3.appendChild(ed); td3.appendChild(dl);
    tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
    t.appendChild(tr);
  });
}
function pwField(box, label){
  const w = el("div","field");
  w.appendChild(el("label","",label));
  const row = el("div","pwrow");
  const i = el("input"); i.type = "password"; i.autocomplete = "new-password";
  const eye = el("button","btn-ghost iconbtn","\u{1F441}"); eye.type = "button"; eye.title = "Show/hide";
  eye.addEventListener("click", () => { i.type = i.type === "password" ? "text" : "password"; });
  row.appendChild(i); row.appendChild(eye); w.appendChild(row); box.appendChild(w);
  return i;
}
function editStudent(st){
  openModal(box => {
    modalTitle(box, "Edit student");
    const d = fieldRow(box, "Display name", "text", st.display_name);
    const u = fieldRow(box, "Username", "text", st.username);
    const p = pwField(box, "Set a new password");
    box.appendChild(el("p","subnote","Existing passwords are stored scrambled and can't be shown \u2014 type a new one here to reset it, and use the eye to check your typing."));
    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta","Save changes");
    go.addEventListener("click", async () => {
      msg.textContent = "Saving\u2026";
      const payload = { username: st.username };
      if (d.value.trim() && d.value.trim() !== st.display_name) payload.display = d.value.trim();
      if (u.value.trim() && u.value.trim() !== st.username) payload.newUsername = u.value.trim();
      if (p.value) payload.newPassword = p.value;
      try{
        const r = await fetch(API + "/api/teacher/update-student", { method:"POST", headers: HJ(), body: JSON.stringify(payload) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "Could not save.");
        closeModal(); loadStudents();
      }catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(msg);
  });
}
function confirmDelete(st){
  openModal(box => {
    modalTitle(box, "Delete " + st.display_name + "?");
    box.appendChild(el("p","modal-text","This removes their login AND all their saved work and results. It cannot be undone."));
    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta","Yes, delete"); go.style.background = "var(--red)";
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    go.addEventListener("click", async () => {
      msg.textContent = "Deleting\u2026";
      try{
        const r = await fetch(API + "/api/teacher/delete-student", { method:"POST", headers: HJ(), body: JSON.stringify({ username: st.username }) });
        if (!r.ok) throw new Error((await r.json()).error || "Could not delete.");
        closeModal(); loadStudents(); refreshGroups();
      }catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(no); box.appendChild(msg);
  });
}
$("addOneBtn").addEventListener("click", () => {
  openModal(box => {
    modalTitle(box, "Add a student to " + cls);
    const d = fieldRow(box, "Display name", "text", "");
    const u = fieldRow(box, "Username", "text", "");
    const p = pwField(box, "Password (leave empty \u2014 recommended)");
    box.appendChild(el("p","subnote","Leave the password empty and the student picks their own the first time they sign in. Only set one here if you need to."));
    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta","Add student");
    go.addEventListener("click", async () => {
      if (!u.value.trim()){ msg.textContent = "A username is needed."; return; }
      if (p.value && p.value.length < 4){ msg.textContent = "A password set here must be at least 4 characters."; return; }
      msg.textContent = "Adding\u2026";
      try{
        const r = await fetch(API + "/api/teacher/students", { method:"POST", headers: HJ(),
          body: JSON.stringify({ students: [{ group: cls, username: u.value.trim(), password: p.value, displayName: d.value.trim() || u.value.trim() }] }) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "Could not add.");
        closeModal(); loadStudents(); refreshGroups();
      }catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(msg);
  });
});
$("addManyBtn").addEventListener("click", () => {
  openModal(box => {
    modalTitle(box, "Add many to " + cls);
    box.appendChild(el("p","modal-text","One student per line: username, display name \u2014 they choose their own password at first sign-in. (You can still use username, password, display name if you want to set one.)"));
    const ta = el("textarea"); ta.rows = 8; ta.placeholder = "jsmith, Jamie Smith\nlkhan, Layla Khan"; ta.style.width = "100%";
    box.appendChild(ta);
    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta","Add students");
    go.addEventListener("click", async () => {
      const rows = ta.value.split("\n").map(l => l.split(",").map(x => x.trim())).filter(p2 => p2[0]);
      /* Two columns = username + display name (no password, they pick their own).
         Three columns = username, password, display name. */
      const list = rows.map(p2 => p2.length >= 3
        ? { group: cls, username: p2[0], password: p2[1] || "", displayName: p2[2] || p2[0] }
        : { group: cls, username: p2[0], password: "", displayName: p2[1] || p2[0] });
      if (!list.length){ msg.textContent = "Nothing to add yet."; return; }
      msg.textContent = "Adding\u2026";
      try{
        const r = await fetch(API + "/api/teacher/students", { method:"POST", headers: HJ(), body: JSON.stringify({ students: list }) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "Could not add.");
        msg.textContent = "Added " + j.added + (j.skipped ? " \u00b7 skipped " + j.skipped + " (missing username, or a password under 4 characters)" : "");
        loadStudents(); refreshGroups();
      }catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(msg);
  });
});

/* ---------- catalogue: units + which lessons are published ---------- */
let cat = { units: [], lessons: [] };     // from the database
let fileLessons = [];                     // from lessons/index.json
let unit = "";                            // the unit being managed

async function loadCatalogue(){
  if (!fileLessons.length){
    const d = await (await fetch("lessons/index.json", { cache: "no-store" })).json();
    fileLessons = d.units ? d.units.flatMap(u => u.lessons) : d;
  }
  const r = await fetch(API + "/api/catalog", { headers: H(), cache: "no-store" });
  cat = await r.json();
}
const catOf = (id) => (cat.lessons || []).find(l => l.lesson_id === id) || { unit: "", published: 0, position: 0 };
const titleOf = (id) => { const l = fileLessons.find(x => x.id === id); return l ? l.title : id; };
async function catPost(payload){
  const r = await fetch(API + "/api/catalog", { method: "POST", headers: HJ(), body: JSON.stringify(payload) });
  if (!r.ok) throw new Error((await r.json()).error || "Could not save.");
  await loadCatalogue();
}

$("openLessons").addEventListener("click", async () => {
  show("unitsView");
  $("unitGrid").innerHTML = '<p class="hint">Loading…</p>';
  try{ await loadCatalogue(); paintUnits(); }
  catch(e){ $("unitGrid").innerHTML = '<p class="hint">' + e.message + '</p>'; }
});
$("backUnits").addEventListener("click", () => { show("unitsView"); paintUnits(); });

function paintUnits(){
  const g = $("unitGrid"); g.innerHTML = "";
  const names = (cat.units || []).map(u => u.name);
  const unfiled = (cat.lessons || []).filter(l => !l.unit).length;
  names.forEach(n => {
    const inUnit = (cat.lessons || []).filter(l => l.unit === n);
    const live = inUnit.filter(l => l.published).length;
    const t = el("button","classtile");
    t.appendChild(el("b","", n));
    t.appendChild(el("span","", inUnit.length + " lesson" + (inUnit.length === 1 ? "" : "s") +
      (live ? " \u00b7 " + live + " published" : " \u00b7 none published")));
    t.addEventListener("click", () => openUnit(n));
    g.appendChild(t);
  });
  if (unfiled){
    const t = el("button","classtile");
    t.appendChild(el("b","","Not in a unit"));
    t.appendChild(el("span","", unfiled + " lesson" + (unfiled === 1 ? "" : "s")));
    t.addEventListener("click", () => openUnit(""));
    g.appendChild(t);
  }
  const add = el("button","classtile");
  add.appendChild(el("b","","+ New unit"));
  add.appendChild(el("span","","Group a term's lessons together"));
  add.addEventListener("click", () => {
    openModal(box => {
      modalTitle(box, "New unit");
      const i = fieldRow(box, "Unit name (e.g. Unit 1 \u2014 Cybersecurity)", "text", "");
      const msg = el("p","hint","");
      const go = el("button","btn-primary modal-cta","Create unit");
      go.addEventListener("click", async () => {
        const v = i.value.trim(); if (!v) return;
        msg.textContent = "Creating\u2026";
        try{ await catPost({ op:"add-unit", name: v, position: (cat.units || []).length + 1 });
             closeModal(); paintUnits(); }
        catch(e){ msg.textContent = e.message; }
      });
      box.appendChild(go); box.appendChild(msg);
    });
  });
  g.appendChild(add);
}

function openUnit(name){
  unit = name;
  $("unitName").textContent = name || "Not in a unit";
  $("renameUnitBtn").hidden = !name;
  $("deleteUnitBtn").hidden = !name;
  show("lessonsView");
  paintLessonGrid();
}
$("renameUnitBtn").addEventListener("click", () => {
  openModal(box => {
    modalTitle(box, "Rename unit");
    const i = fieldRow(box, "Unit name", "text", unit);
    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta","Rename");
    go.addEventListener("click", async () => {
      const to = i.value.trim(); if (!to || to === unit){ closeModal(); return; }
      msg.textContent = "Renaming\u2026";
      try{ await catPost({ op:"rename-unit", from: unit, to }); closeModal(); openUnit(to); }
      catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(msg);
  });
});
$("deleteUnitBtn").addEventListener("click", () => {
  openModal(box => {
    modalTitle(box, "Delete " + unit + "?");
    box.appendChild(el("p","modal-text","The lessons are kept \u2014 they just stop belonging to a unit. Nothing students have done is affected."));
    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta","Delete unit"); go.style.background = "var(--red)";
    const no = el("button","btn-ghost modal-stay","Cancel"); no.addEventListener("click", closeModal);
    go.addEventListener("click", async () => {
      msg.textContent = "Deleting\u2026";
      try{ await catPost({ op:"delete-unit", name: unit }); closeModal(); show("unitsView"); paintUnits(); }
      catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go); box.appendChild(no); box.appendChild(msg);
  });
});
$("addLessonBtn").addEventListener("click", () => {
  const spare = fileLessons.filter(l => (catOf(l.id).unit || "") !== unit);
  openModal(box => {
    modalTitle(box, "Add a lesson to " + (unit || "no unit"));
    if (!spare.length){ box.appendChild(el("p","modal-text","Every lesson is already in this unit.")); }
    const msg = el("p","hint","");
    spare.forEach(l => {
      const row = el("button","ov-row");
      row.appendChild(el("span","t", l.title));
      const where = catOf(l.id).unit;
      row.appendChild(el("span","p", where ? "currently in " + where : "not in a unit"));
      row.appendChild(el("span","edit","Add \u2192"));
      row.addEventListener("click", async () => {
        msg.textContent = "Adding\u2026";
        try{ await catPost({ op:"set-lesson", id: l.id, unit }); closeModal(); paintLessonGrid(); }
        catch(e){ msg.textContent = e.message; }
      });
      box.appendChild(row);
    });
    const done = el("button","btn-ghost modal-stay","Close"); done.addEventListener("click", closeModal);
    box.appendChild(done); box.appendChild(msg);
  });
});

function paintLessonGrid(){
  const g = $("lessonGrid"); g.innerHTML = "";
  const mine = (cat.lessons || []).filter(l => (l.unit || "") === unit && fileLessons.some(f => f.id === l.lesson_id));
  if (!mine.length){ g.appendChild(el("p","hint","No lessons in this unit yet \u2014 add one above.")); return; }
  mine.sort((a, b) => (a.position || 0) - (b.position || 0));
  mine.forEach(l => {
    const card = el("div","lessonpill");
    const head = el("div","lp-head");
    head.appendChild(el("b","", titleOf(l.lesson_id)));
    head.appendChild(el("span","statechip " + (l.published ? "open" : "shut"), l.published ? "Published" : "Draft"));
    card.appendChild(head);
    if (lessonLocks[l.lesson_id]) card.appendChild(el("p","lp-note","\u{1F512} Locked for " + cls));
    const acts = el("div","lp-acts");
    const pub = el("button", l.published ? "btn-ghost" : "btn-primary", l.published ? "Unpublish" : "Publish");
    pub.addEventListener("click", async () => {
      pub.textContent = "\u2026";
      try{ await catPost({ op:"set-lesson", id: l.lesson_id, published: !l.published }); paintLessonGrid(); }
      catch(e){ alert(e.message); paintLessonGrid(); }
    });
    const workBtn = el("button","btn-ghost","View Student Work");
    workBtn.addEventListener("click", () => pickStudentWork(l.lesson_id));
    const man = el("button","btn-ghost","Manage");
    man.addEventListener("click", () => manageLesson(l.lesson_id));
    acts.appendChild(pub); acts.appendChild(workBtn); acts.appendChild(man);
    card.appendChild(acts);
    g.appendChild(card);
  });
}

/* ---------- managing one lesson (big pop-up) ---------- */
let lessonLocks = {};        // lesson_id -> whole-lesson lock for this class
let locks = new Set();       // task locks for the lesson being managed
let usingDefaults = false;

function defaultLocks(){
  const out = new Set();
  if (!lessonJson || lessonJson.assessment) return out;
  const b = lessonJson.blocks || [];
  let firstDo = -1;
  for (let i = 0; i < b.length; i++){ if (b[i].type !== "text"){ firstDo = i; break; } }
  if (firstDo === -1) return out;
  for (let i = firstDo + 1; i < b.length; i++) out.add(i);
  return out;
}
async function loadClassLocks(){
  try{
    const r = await fetch(API + "/api/release?all=1&group=" + encodeURIComponent(cls) + "&t=" + Date.now(), { headers: H(), cache: "no-store" });
    const d = await r.json();
    lessonLocks = {};
    (d.rows || []).forEach(row => { lessonLocks[row.lesson] = !!row.lessonLocked; });
    setOnline(true);
  }catch(e){ setOnline(false); }
}
async function manageLesson(id){
  lessonId = id;
  workCache = { key: "", rows: [], t: 0 };
  lessonJson = await (await fetch("lessons/" + id + ".json", { cache: "no-store" })).json();
  await refreshRelease();
  openManage();
}
function openManage(){
  openModal(box => {
    box.classList.add("wide");
    modalTitle(box, titleOf(lessonId));
    const bar = el("div","toolrow");
    const lockBtn = el("button", lessonLocks[lessonId] ? "btn-primary" : "btn-ghost",
      lessonLocks[lessonId] ? "\u{1F513} Unlock whole lesson" : "\u{1F512} Lock whole lesson");
    lockBtn.addEventListener("click", async () => {
      lockBtn.textContent = "\u2026";
      try{
        const r = await fetch(API + "/api/release", { method:"POST", headers: HJ(),
          body: JSON.stringify({ lesson: lessonId, group: cls, lessonLocked: !lessonLocks[lessonId] }) });
        if (!r.ok) throw new Error((await r.json()).error || "Could not update.");
        lessonLocks[lessonId] = !lessonLocks[lessonId];
        closeModal(); paintLessonGrid(); openManage();
      }catch(e){ alert(e.message); }
    });
    const workBtn = el("button","btn-ghost","View Student Work");
    workBtn.addEventListener("click", () => pickStudentWork(lessonId));
    const prog = el("button","btn-primary","View Student Progress");
    prog.addEventListener("click", showProgress);
    bar.appendChild(prog); bar.appendChild(workBtn); bar.appendChild(lockBtn);
    box.appendChild(bar);
    const tools = el("div","toolrow");
    const oa = el("button","btn-ghost","Open all tasks"); oa.addEventListener("click", () => postLocks(new Set()));
    const la = el("button","btn-ghost","Lock all tasks"); la.addEventListener("click", () => postLocks(new Set(lessonJson.blocks.map((_, i) => i))));
    tools.appendChild(oa); tools.appendChild(la);
    box.appendChild(tools);
    box.appendChild(el("p","hint","")).id = "relMsg";
    const list = el("div"); list.id = "taskList"; box.appendChild(list);
    const done = el("button","btn-ghost modal-stay","Close"); done.addEventListener("click", closeModal);
    box.appendChild(done);
    paintTasks();
  });
}
async function refreshRelease(){
  if (!lessonId) return;
  try{
    const r = await fetch(API + "/api/release?lesson=" + encodeURIComponent(lessonId) + "&group=" + encodeURIComponent(cls) + "&t=" + Date.now(), { cache: "no-store" });
    const d = await r.json();
    if (d.managed === false){ locks = defaultLocks(); usingDefaults = true; }
    else if (Array.isArray(d.locks)){ locks = new Set(d.locks); usingDefaults = false; }
    else if (typeof d.released === "number"){
      locks = new Set();
      for (let i = d.released; i < (lessonJson ? lessonJson.blocks.length : 0); i++) locks.add(i);
      usingDefaults = false;
    } else { locks = new Set(); usingDefaults = false; }
    lessonLocks[lessonId] = !!d.lessonLocked;
    setOnline(true);
  }catch(e){ setOnline(false); }
  paintTasks();
}
async function postLocks(next){
  const msg = $("relMsg"); if (msg) msg.textContent = "Updating\u2026";
  try{
    const r = await fetch(API + "/api/release", { method:"POST", headers: HJ(),
      body: JSON.stringify({ lesson: lessonId, group: cls, locks: [...next].sort((a,b)=>a-b) }) });
    if (!r.ok) throw new Error((await r.json()).error || "Could not update.");
    locks = next; usingDefaults = false;
    if (msg) msg.textContent = "";
  }catch(e){ if (msg) msg.textContent = e.message; }
  paintTasks();
}
function stepTitle(b, i){
  const named = stripTags(b.title || b.prompt || b.task || "");
  if (named) return named;
  if (b.type === "text"){
    const m = /<h2[^>]*>([\s\S]*?)<\/h2>/i.exec(b.html || "");
    return "Reading: " + (m ? stripTags(m[1]) : "information page");
  }
  const friendly = { embed:"Watch the video", link:"Open a website", image:"Upload a screenshot",
                     python:"Python code", quiz:"Quiz", question:"Written answer", password:"Password checker",
                     caesar:"Caesar cipher", mc:"Multiple choice", order:"Put in order",
                     blanks:"Fill in the blanks", short:"Short answer" };
  return friendly[b.type] || b.type;
}
function paintTasks(){
  const list = $("taskList"); if (!list || !lessonJson) return;
  list.innerHTML = "";
  const msg = $("relMsg");
  if (msg){
    const base = locks.size === 0 ? "Every task is open for " + cls + "."
      : locks.size === lessonJson.blocks.length ? "Every task is locked for " + cls + "."
      : locks.size + " task" + (locks.size === 1 ? "" : "s") + " locked for " + cls + ".";
    msg.textContent = usingDefaults ? base + " (starting pattern \u2014 unlock as you teach)" : base;
  }
  lessonJson.blocks.forEach((b, i) => {
    const open = !locks.has(i);
    const row = el("div","taskrow" + (open ? "" : " shut"));
    row.appendChild(el("span","tn", (i+1) + "."));
    const t = el("span","", stepTitle(b, i)); t.style.flex = "1"; row.appendChild(t);
    row.appendChild(el("span","statechip " + (open ? "open" : "shut"), open ? "Open" : "Locked"));
    const btns = el("span","taskbtns");
    const lock = el("button","btn-ghost iconbtn", open ? "\u{1F513}" : "\u{1F512}");
    lock.title = open ? "Lock this task" : "Unlock this task";
    lock.addEventListener("click", () => {
      const next = new Set(locks);
      if (open) next.add(i); else next.delete(i);
      postLocks(next);
    });
    const eye = el("button","btn-ghost iconbtn","\u{1F441}");
    eye.title = "Preview as a student";
    eye.addEventListener("click", () => window.open("lesson.html?id=" + encodeURIComponent(lessonId) + "&preview=" + i, "_blank"));
    const who = el("button","btn-ghost iconbtn","\u{1F465}");
    who.title = "Who has done this task?";
    who.addEventListener("click", () => whoDone(i, b));
    btns.appendChild(lock); btns.appendChild(eye); btns.appendChild(who);
    row.appendChild(btns);
    list.appendChild(row);
  });
}

/* ---------- student work: view on screen or print to PDF ---------- */
async function getWorkRows(){
  const key = lessonId + "\u0000" + cls;
  if (workCache.key === key && Date.now() - workCache.t < 15000) return workCache.rows;
  const r = await fetch(API + "/api/teacher/work?lesson=" + encodeURIComponent(lessonId) + "&group=" + encodeURIComponent(cls), { headers: H(), cache: "no-store" });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Could not load work.");
  workCache = { key, rows: d.rows || [], t: Date.now() };
  return workCache.rows;
}
async function getRoster(){
  if (students.length && workCache.rosterFor === cls) return students;
  const r = await fetch(API + "/api/teacher/students?group=" + encodeURIComponent(cls), { headers: H(), cache: "no-store" });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Could not load students.");
  students = d.students || []; workCache.rosterFor = cls;
  return students;
}
function nonEmpty(v){
  if (v === null || v === undefined || v === "") return false;
  if (Array.isArray(v)) return v.some(x => x);
  if (typeof v === "object") return Object.keys(v).length > 0;
  return true;
}
/* Hands the whole class to the viewer so the teacher can flick between them. */
function handOff(rows, idx){
  localStorage.setItem("hub_inspect", JSON.stringify({
    lesson: lessonId, idx: idx,
    list: rows.map(r => ({ name: r.display_name, username: r.username, data: r.data }))
  }));
}
function inspect(rows, idx, stepIdx){
  handOff(rows, idx);
  window.open("lesson.html?id=" + encodeURIComponent(lessonId) + "&view=1" + (stepIdx !== undefined ? "&step=" + stepIdx : ""), "_blank");
}
function printWork(rows, idx){
  handOff(rows, idx);
  window.open("lesson.html?id=" + encodeURIComponent(lessonId) + "&view=1&print=1", "_blank");
}
async function pickStudentWork(id){
  if (id && id !== lessonId){
    lessonId = id; workCache = { key: "", rows: [], t: 0 };
    lessonJson = await (await fetch("lessons/" + id + ".json", { cache: "no-store" })).json();
  }
  openModal(async (box) => {
    modalTitle(box, "Student work \u2014 " + titleOf(lessonId));
    const holder = el("div"); box.appendChild(holder);
    holder.appendChild(el("p","hint","Loading\u2026"));
    try{
      const rows = await getWorkRows();
      holder.innerHTML = "";
      if (!rows.length){ holder.appendChild(el("p","hint","Nobody in " + cls + " has saved any work for this lesson yet.")); }
      rows.forEach((r, i) => {
        const line = el("div","who-row");
        line.appendChild(el("span","nm", r.display_name));
        line.appendChild(el("span","st " + (r.data && r.data.__done ? "yes" : "no"),
          r.data && r.data.__done ? "Completed \u2713" : "In progress"));
        const v = el("button","btn-ghost iconbtn","\u{1F441}"); v.title = "View their work";
        v.addEventListener("click", () => inspect(rows, i));
        const p = el("button","btn-ghost iconbtn","\u{1F4C4}"); p.title = "Printable copy (save as PDF)";
        p.addEventListener("click", () => printWork(rows, i));
        line.appendChild(v); line.appendChild(p);
        holder.appendChild(line);
      });
    }catch(e){ holder.innerHTML = ""; holder.appendChild(el("p","hint", e.message)); }
    const done = el("button","btn-ghost modal-stay","Close"); done.addEventListener("click", closeModal);
    box.appendChild(done);
  });
}
function showProgress(){
  openModal(async (box) => {
    modalTitle(box, "Progress \u2014 " + cls);
    const holder = el("div"); box.appendChild(holder);
    holder.appendChild(el("p","hint","Loading\u2026"));
    try{
      const roster = await getRoster(), rows = await getWorkRows();
      holder.innerHTML = "";
      const total = lessonJson.blocks.length;
      roster.forEach(st => {
        const idx = rows.findIndex(w => w.username === st.username);
        const row = rows[idx];
        const line = el("div","who-row");
        line.appendChild(el("span","nm", st.display_name));
        let status, cl = "no";
        if (!row){ status = "Not started"; }
        else if (row.data.__done){ status = "Completed \u2713"; cl = "yes"; }
        else {
          const n = Math.min((row.data.__step || 0), total - 1);
          status = "Task " + (n + 1) + " of " + total + ": " + stepTitle(lessonJson.blocks[n], n).slice(0, 34);
        }
        line.appendChild(el("span","st " + cl, status));
        const v = el("button","btn-ghost iconbtn","\u{1F441}"); v.title = "View their work";
        const p = el("button","btn-ghost iconbtn","\u{1F4C4}"); p.title = "Printable copy (save as PDF)";
        if (row){ v.addEventListener("click", () => inspect(rows, idx)); p.addEventListener("click", () => printWork(rows, idx)); }
        else { v.disabled = true; p.disabled = true; }
        line.appendChild(v); line.appendChild(p);
        holder.appendChild(line);
      });
      if (!roster.length) holder.appendChild(el("p","hint","No students in this class yet."));
    }catch(e){ holder.innerHTML = ""; holder.appendChild(el("p","hint", e.message)); }
    const done = el("button","btn-ghost modal-stay","Close"); done.addEventListener("click", closeModal);
    box.appendChild(done);
  });
}
async function whoDone(i, b){
  openModal(async (box) => {
    modalTitle(box, "Task " + (i+1) + " \u2014 who's done it?");
    box.appendChild(el("p","modal-text", stepTitle(b, i)));
    const holder = el("div"); box.appendChild(holder);
    holder.appendChild(el("p","hint","Loading\u2026"));
    try{
      const roster = await getRoster(), rows = await getWorkRows();
      holder.innerHTML = "";
      roster.forEach(st => {
        const idx = rows.findIndex(w => w.username === st.username);
        const row = rows[idx];
        const d = row && row.data;
        const done = !!(d && (d.__done || (d.__step || 0) > i || nonEmpty(d[b.id])));
        const line = el("div","who-row");
        line.appendChild(el("span","nm", st.display_name));
        line.appendChild(el("span","st " + (done ? "yes" : "no"), done ? "Done \u2713" : "Not yet"));
        const v = el("button","btn-ghost iconbtn","\u{1F441}"); v.title = "View at this task";
        const p = el("button","btn-ghost iconbtn","\u{1F4C4}"); p.title = "Printable copy (save as PDF)";
        if (row){ v.addEventListener("click", () => inspect(rows, idx, i)); p.addEventListener("click", () => printWork(rows, idx)); }
        else { v.disabled = true; p.disabled = true; }
        line.appendChild(v); line.appendChild(p);
        holder.appendChild(line);
      });
    }catch(e){ holder.innerHTML = ""; holder.appendChild(el("p","hint", e.message)); }
    const done2 = el("button","btn-ghost modal-stay","Close"); done2.addEventListener("click", closeModal);
    box.appendChild(done2);
  });
}

/* ---------- boot ---------- */
if (window.initSettings) initSettings($("setBtn"));
const savedKey = localStorage.getItem("hub_tkey");
if (savedKey){ $("keyIn").value = savedKey; tryKey(); }
</script>
