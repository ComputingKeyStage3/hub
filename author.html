<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson builder — Prince Henry's Computing KS3</title>
<link rel="stylesheet" href="style.css">
<script>try{var _p=JSON.parse(localStorage.getItem("hub_prefs")||"{}");if(_p.bg)document.documentElement.dataset.bg=_p.bg;if(_p.font)document.documentElement.dataset.font=_p.font;}catch(e){}</script>
<script src="config.js"></script>
<script src="settings.js"></script>
</head>
<body>

<div class="homebar">
  <div class="title">Lesson builder</div>
  <a class="crumb" href="index.html" style="margin-right:10px">&larr; Home</a>
  <button class="btn-ghost iconbtn" id="setBtn" title="Settings">&#9881;&#65038;</button>
</div>

<div class="modeswitch">
  <button class="on" id="modeLesson">Lesson</button>
  <button id="modeAssess">Assessment</button>
</div>

<div class="build-top">
  <div class="build-titles">
    <input id="lTitle" placeholder="Lesson title, e.g. Python 1 — Output" autocomplete="off">
    <input id="lIntro" placeholder="One line for the home page" autocomplete="off">
    <input id="lUnit" placeholder="Unit (required)" autocomplete="off" list="unitList">
    <datalist id="unitList"></datalist>
  </div>
  <div class="build-actions">
    <button class="btn-ghost" id="importBtn">Paste a Trinket page</button>
    <button class="btn-ghost" id="jsonBtn">JSON</button>
    <button class="btn-ghost" id="dlBtn">Save file</button>
    <button class="btn-ghost" id="prevBtn">Refresh preview</button>
    <button class="btn-primary" id="saveSite">Save to the site</button>
  </div>
</div>

<div class="build">
  <aside class="build-palette">
    <div id="palLesson">
      <p class="pal-head">Pages</p>
      <button class="pal strong" data-add="page"><b>Page of tasks</b><span>Several tasks on one screen</span></button>
      <p class="pal-head">Single tasks</p>
      <button class="pal" data-add="text"><b>Reading</b><span>Explain something</span></button>
      <button class="pal" data-add="ide"><b>Python task</b><span>Editor, console, turtle</span></button>
      <button class="pal" data-add="question"><b>Written answer</b><span>They type a response</span></button>
      <button class="pal" data-add="quiz"><b>Quiz</b><span>Questions with hints</span></button>
      <button class="pal" data-add="image"><b>Screenshot</b><span>Paste a picture</span></button>
      <button class="pal" data-add="embed"><b>Video</b><span>Embed a clip</span></button>
      <button class="pal" data-add="link"><b>Link</b><span>Send them to a site</span></button>
    </div>
    <div id="palAssess" hidden>
      <p class="pal-head">Questions</p>
      <button class="pal" data-add="mc"><b>Multiple choice</b><span>One right answer</span></button>
      <button class="pal" data-add="blanks"><b>Fill the gaps</b><span>Dropdown answers</span></button>
      <button class="pal" data-add="order"><b>Put in order</b><span>Drag to sort</span></button>
      <button class="pal" data-add="short"><b>Short answer</b><span>Checked for keywords</span></button>
      <button class="pal" data-add="text"><b>Instructions</b><span>A page of words</span></button>
      <p class="pal-head">Feedback</p>
      <button class="pal" id="topicsBtn"><b>Strength &amp; Target</b><span>Sentences per topic</span></button>
    </div>
    <p class="pal-note">Drag a card by its handle to reorder. Everything saves in this browser as you type.</p>
  </aside>

  <main class="build-list" id="list"></main>

  <section class="build-preview">
    <div class="prev-head">
      <b>Live preview</b>
      <span class="hint" id="prevMsg"></span>
    </div>
    <iframe id="prev" title="Lesson preview"></iframe>
  </section>
</div>

<div class="modal-back no-print" id="mBack" hidden>
  <div class="modal wide" id="mBox"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------------- the lesson being built ---------------- */
let lesson = { title:"", intro:"", unit:"", assessment:false, topics:{}, blocks:[] };

const BLANK = {
  text:     () => ({ type:"text", heading:"", body:"" }),
  ide:      () => ({ type:"ide", title:"", task:"", starter:'print("Hello World!")', turtle:false, expect:"" }),
  question: () => ({ type:"question", prompt:"", minWords:20 }),
  quiz:     () => ({ type:"quiz", questions:[{ q:"", options:["",""], answer:0, hint:"" }] }),
  page:     () => ({ type:"page", title:"New page", task:"", blocks:[] }),
  image:    () => ({ type:"image", task:"Take a screenshot and paste it here." }),
  embed:    () => ({ type:"embed", url:"", title:"Watch this" }),
  link:     () => ({ type:"link", url:"", title:"", task:"" }),
  mc:       () => ({ type:"mc", prompt:"", options:["",""], answer:0, topic:"" }),
  blanks:   () => ({ type:"blanks", prompt:"Fill in the gaps", text:"The [[cat]] sat on the mat.", distractors:"", topic:"" }),
  order:    () => ({ type:"order", prompt:"Put these in order", items:["","",""], topic:"" }),
  short:    () => ({ type:"short", prompt:"", keywords:"", model:"", topic:"" })
};
const LABEL = { text:"Reading", ide:"Python task", question:"Written answer", quiz:"Quiz", image:"Screenshot",
                embed:"Video", link:"Link", mc:"Multiple choice", blanks:"Fill the gaps", order:"Put in order",
                short:"Short answer", page:"Page of tasks" };

/* A YouTube address in any of its usual shapes -> the embeddable one. */
function toEmbed(raw){
  const t = String(raw || "").trim();
  if (!t) return "";
  const m = t.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/)
         || t.match(/^([A-Za-z0-9_-]{11})$/);
  if (m) return "https://www.youtube.com/embed/" + m[1];
  const src = t.match(/src\s*=\s*["']([^"']+)["']/i);      // a whole <iframe> pasted in
  if (src) return toEmbed(src[1]) || src[1];
  return t;                                                  // something else: leave it alone
}

/* ---------------- the draft lives in this browser ---------------- */
function saveDraft(){ try{ localStorage.setItem("hub_builder", JSON.stringify(lesson)); }catch(e){} }
function loadDraft(){
  try{
    const d = JSON.parse(localStorage.getItem("hub_builder") || "null");
    if (d && Array.isArray(d.blocks)) lesson = d;
    migrate(lesson.blocks);
  }catch(e){}
}
/* Drafts written by the older builder had one question per quiz. */
function migrate(arr){
  (arr || []).forEach(b => {
    if (b.type === "quiz" && !b.questions){
      b.questions = [{ q: b.q || "", options: b.options || ["",""], answer: b.answer || 0, hint: b.hint || "" }];
      delete b.q; delete b.options; delete b.answer; delete b.hint;
    }
    if (b.type === "page") migrate(b.blocks);
  });
}

/* ---------------- cards -> a real lesson file ---------------- */
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
}
/* Empty text fields can go, but arrays the lesson page reads (options, items)
   must stay — otherwise a half-finished card breaks the preview. */
function keepArrays(o){
  Object.keys(o).forEach(k => {
    const v = o[k];
    if (v === "" || v === undefined) delete o[k];
    if (Array.isArray(v) && !v.length && (k === "distractors" || k === "keywords")) delete o[k];
  });
  return o;
}
function compileBlock(b, id){
  const out = [];
  compileOne(b, id, out);
  return out[0];
}
function compile(){
  const out = { title: lesson.title || "Untitled lesson", blocks: [] };
  if (lesson.intro) out.intro = lesson.intro;
  if (lesson.unit) out.unit = lesson.unit;
  if (lesson.assessment){
    out.assessment = true;
    const topics = {};
    Object.keys(lesson.topics || {}).forEach(k => {
      const t = lesson.topics[k];
      if (t && (t.label || t.strength || t.target)) topics[k] = { label:t.label||k, strength:t.strength||"", target:t.target||"" };
    });
    if (Object.keys(topics).length) out.topics = topics;
  }
  lesson.blocks.forEach((b, i) => compileOne(b, b.type + (i + 1), out.blocks));
  return out;
}
function compileOne(b, id, target){
  const push = (x) => target.push(x);
  if (b.type === "page"){
    const kids = [];
    (b.blocks || []).forEach((child, k) => compileOne(child, id + "_" + (k + 1), kids));
    push({ type:"page", id, title: b.title || "Tasks", task: b.task || "", blocks: kids });
    return;
  }
  {
    if (b.type === "text"){
      let html = b.heading ? "<h2>" + esc(b.heading) + "</h2>" : "";
      /* Walk the lines, gathering runs of bullets and runs of prose. Teachers
         write a sentence and then bullets underneath with no blank line, so
         each run has to be emitted on its own. */
      let prose = [], bullets = [];
      const flushProse = () => { if (prose.length){ html += "<p>" + inline(prose.join(" ")) + "</p>"; prose = []; } };
      const flushBullets = () => {
        if (bullets.length){
          html += "<ul>" + bullets.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>";
          bullets = [];
        }
      };
      String(b.body || "").split("\n").forEach(line => {
        if (!line.trim()){ flushBullets(); flushProse(); return; }
        if (/^\s*[-*]\s+/.test(line)){ flushProse(); bullets.push(line.replace(/^\s*[-*]\s+/, "")); return; }
        flushBullets(); prose.push(line.trim());
      });
      flushBullets(); flushProse();
      push({ type:"text", id, html });
    }
    else if (b.type === "ide"){
      const blk = { type:"ide", id, title: b.title || "Python",
                    task: b.task || "Write your code, then press Run.", starter: b.starter || "" };
      if (b.turtle) blk.turtle = true;
      if (b.expect) blk.expect = b.expect;
      push(blk);
    }
    else if (b.type === "question")
      push({ type:"question", id, prompt: b.prompt || "Write your answer.",
             minWords: Number(b.minWords) || 20 });
    else if (b.type === "quiz")
      push({ type:"quiz", id, title:"Check your understanding",
        questions: (b.questions || (b.q !== undefined
          ? [{ q:b.q, options:b.options, answer:b.answer, hint:b.hint }] : [])).map(q => ({ q: q.q || "", options: (q.options || []).filter(x => x !== ""),
                                                   answer: Number(q.answer) || 0, hint: q.hint || "" })) });
    else if (b.type === "image")
      push({ type:"image", id, task: b.task || "Take a screenshot and paste it here." });
    else if (b.type === "embed")
      push({ type:"embed", id, url: toEmbed(b.url), title: b.title || "Watch this" });
    else if (b.type === "link")
      push({ type:"link", id, url: b.url || "", title: b.title || "Open this", task: b.task || "" });
    else if (b.type === "mc")
      push(keepArrays({ type:"mc", id, prompt: b.prompt || "", options: (b.options || []).filter(x => x !== ""),
        answer: Number(b.answer) || 0, topic: b.topic }));
    else if (b.type === "blanks")
      push(keepArrays({ type:"blanks", id, prompt: b.prompt || "Fill in the gaps", text: b.text || "",
        distractors: (b.distractors || "").split(/\s*,\s*/).filter(Boolean), topic: b.topic }));
    else if (b.type === "order")
      push(keepArrays({ type:"order", id, prompt: b.prompt || "Put these in order",
        items: (b.items || []).filter(x => x !== ""), topic: b.topic }));
    else if (b.type === "short")
      push(keepArrays({ type:"short", id, prompt: b.prompt || "",
        keywords: (b.keywords || "").split(";").map(g => g.split(/\s*,\s*/).map(x => x.trim()).filter(Boolean)).filter(g => g.length),
        model: b.model || "", topic: b.topic }));
  }
}

/* ---------------- drawing the cards ---------------- */
let dragFrom = null;
function render(){
  const list = $("list"); list.innerHTML = "";
  if (!lesson.blocks.length)
    list.appendChild(el("p","hint", lesson.assessment
      ? "No questions yet — add one from the left."
      : "Nothing here yet — add a task or a page from the left."));
  lesson.blocks.forEach((b, i) => list.appendChild(card(b, i, lesson.blocks)));
  saveDraft();
}
function move(arr, i, d){
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  const moved = arr.splice(i, 1)[0];
  arr.splice(j, 0, moved);
  render(); schedulePreview();
}
function card(b, i, arr){
  const c = el("div","bcard");
  c.draggable = false;

  const head = el("div","bhead");
  const grip = el("span","bgrip","\u2630"); grip.title = "Drag to move";
  grip.addEventListener("mousedown", () => { c.draggable = true; });
  grip.addEventListener("mouseup", () => { c.draggable = false; });
  head.appendChild(grip);
  head.appendChild(el("b","btype", (i + 1) + ". " + LABEL[b.type]));
  const tools = el("span","btools");
  const acts = [["\u2191","Move up", () => move(arr, i, -1)],
                ["\u2193","Move down", () => move(arr, i, 1)],
                ["\u29C9","Duplicate", () => { arr.splice(i + 1, 0, JSON.parse(JSON.stringify(b))); render(); schedulePreview(); }],
                ["\u2715","Delete", () => askDelete(LABEL[b.type], () => { arr.splice(i, 1); render(); schedulePreview(); })]];
  acts.forEach(a => {
    const btn = el("button","btn-ghost bmini", a[0]); btn.title = a[1];
    btn.addEventListener("click", a[2]);
    tools.appendChild(btn);
  });
  head.appendChild(tools);
  c.appendChild(head);

  c.addEventListener("dragstart", (e) => {
    dragFrom = { arr: arr, i: i }; c.classList.add("dragging");
    if (e.dataTransfer){ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(i)); }
  });
  c.addEventListener("dragend", () => { c.classList.remove("dragging"); c.draggable = false; });
  c.addEventListener("dragover", (e) => { e.preventDefault(); c.classList.add("over"); });
  c.addEventListener("dragleave", () => c.classList.remove("over"));
  c.addEventListener("drop", (e) => {
    e.preventDefault(); c.classList.remove("over");
    if (dragFrom === null || dragFrom.arr !== arr || dragFrom.i === i) return;
    const moved = arr.splice(dragFrom.i, 1)[0];
    arr.splice(i, 0, moved);
    dragFrom = null; render(); schedulePreview();
  });

  const body = el("div","bbody");
  function F(label, key, opts){
    const o = opts || {};
    const w = el("div","bfield");
    w.appendChild(el("label","", label));
    const input = o.area ? el("textarea") : el("input");
    if (o.area) input.rows = o.rows || 4;
    if (o.mono) input.className = "mono";
    if (o.placeholder) input.placeholder = o.placeholder;
    input.value = b[key] === undefined ? "" : b[key];
    input.addEventListener("input", () => {
      b[key] = o.num ? Number(input.value) : input.value;
      saveDraft(); schedulePreview();
    });
    w.appendChild(input);
    if (o.help) w.appendChild(el("p","bhelp", o.help));
    body.appendChild(w);
  }
  function listField(label, key, help){
    const w = el("div","bfield");
    w.appendChild(el("label","", label));
    b[key].forEach((val, k) => {
      const row = el("div","brow");
      const input = el("input"); input.value = val;
      input.addEventListener("input", () => { b[key][k] = input.value; saveDraft(); schedulePreview(); });
      row.appendChild(input);
      if (b.answer !== undefined){
        const pick = el("button","btn-ghost bmini" + (Number(b.answer) === k ? " right" : ""), "\u2713");
        pick.title = "This is the correct answer";
        pick.addEventListener("click", () => { b.answer = k; render(); schedulePreview(); });
        row.appendChild(pick);
      }
      const del = el("button","btn-ghost bmini","\u2715"); del.title = "Remove";
      del.addEventListener("click", () => { b[key].splice(k, 1); render(); schedulePreview(); });
      row.appendChild(del);
      w.appendChild(row);
    });
    const add = el("button","btn-ghost bmini2","+ Add another");
    add.addEventListener("click", () => { b[key].push(""); render(); });
    w.appendChild(add);
    if (help) w.appendChild(el("p","bhelp", help));
    body.appendChild(w);
  }

  if (b.type === "text"){
    F("Heading", "heading", { placeholder:"Output a message to the screen" });
    F("Explanation", "body", { area:true, rows:6,
      help:"A blank line starts a new paragraph. Lines beginning with - become bullets. **bold** and `code` work." });
  }
  if (b.type === "ide"){
    F("Task title", "title", { placeholder:"Investigate" });
    F("Instruction", "task", { area:true, rows:2, placeholder:"Run this, then add your own message on line 3." });
    F("Starter code", "starter", { area:true, rows:7, mono:true });
    const w = el("div","bfield");
    w.appendChild(el("label","","Options"));
    const row = el("div","brow");
    const tg = el("button","btn-ghost bmini2" + (b.turtle ? " right" : ""),
                  b.turtle ? "Turtle canvas: on" : "Turtle canvas: off");
    tg.addEventListener("click", () => { b.turtle = !b.turtle; render(); schedulePreview(); });
    row.appendChild(tg);
    w.appendChild(row);
    body.appendChild(w);
    F("Output must contain (optional)", "expect", { placeholder:"Learning to program",
      help:"Leave empty unless you want Continue to wait for the right output." });
  }
  if (b.type === "question"){
    F("Question", "prompt", { area:true, rows:2, placeholder:"What is the purpose of the print function?" });
    F("Roughly how many words", "minWords", { num:true });
  }
  if (b.type === "quiz"){
    if (!b.questions) b.questions = [{ q:"", options:["",""], answer:0, hint:"" }];
    b.questions.forEach((q, qi) => {
      const box = el("div","qsub");
      const qh = el("div","qsub-head");
      qh.appendChild(el("b","", "Question " + (qi + 1)));
      if (b.questions.length > 1){
        const rm = el("button","btn-ghost bmini","\u2715"); rm.title = "Remove this question";
        rm.addEventListener("click", () => askDelete("Question " + (qi + 1), () => { b.questions.splice(qi, 1); render(); schedulePreview(); }));
        qh.appendChild(rm);
      }
      box.appendChild(qh);
      const qw = el("div","bfield");
      qw.appendChild(el("label","","Question"));
      const qt = el("textarea"); qt.rows = 2; qt.value = q.q || "";
      qt.addEventListener("input", () => { q.q = qt.value; saveDraft(); schedulePreview(); });
      qw.appendChild(qt); box.appendChild(qw);
      const ow = el("div","bfield");
      ow.appendChild(el("label","","Options (tick the right one)"));
      (q.options || []).forEach((val, k) => {
        const row = el("div","brow");
        const inp = el("input"); inp.value = val;
        inp.addEventListener("input", () => { q.options[k] = inp.value; saveDraft(); schedulePreview(); });
        row.appendChild(inp);
        const pick = el("button","btn-ghost bmini" + (Number(q.answer) === k ? " right" : ""), "\u2713");
        pick.title = "This is the correct answer";
        pick.addEventListener("click", () => { q.answer = k; render(); schedulePreview(); });
        row.appendChild(pick);
        const del = el("button","btn-ghost bmini","\u2715");
        del.addEventListener("click", () => { q.options.splice(k, 1); render(); schedulePreview(); });
        row.appendChild(del);
        ow.appendChild(row);
      });
      const addOpt = el("button","btn-ghost bmini2","+ Add another option");
      addOpt.addEventListener("click", () => { q.options.push(""); render(); });
      ow.appendChild(addOpt); box.appendChild(ow);
      const hw = el("div","bfield");
      hw.appendChild(el("label","","Hint if they get it wrong"));
      const hi = el("input"); hi.value = q.hint || "";
      hi.addEventListener("input", () => { q.hint = hi.value; saveDraft(); schedulePreview(); });
      hw.appendChild(hi); box.appendChild(hw);
      body.appendChild(box);
    });
    const addQ = el("button","btn-ghost bmini2","+ Add another question");
    addQ.addEventListener("click", () => { b.questions.push({ q:"", options:["",""], answer:0, hint:"" }); render(); schedulePreview(); });
    body.appendChild(addQ);
  }
  if (b.type === "page"){
    F("Page title", "title", { placeholder:"Output a message to the screen" });
    F("Instruction under the title", "task", { area:true, rows:2 });
    const inner = el("div","pagekids");
    if (!b.blocks) b.blocks = [];
    if (!b.blocks.length) inner.appendChild(el("p","bhelp","This page is empty — add tasks to it below."));
    b.blocks.forEach((child, k) => inner.appendChild(card(child, k, b.blocks)));
    body.appendChild(inner);
    const addRow = el("div","pageadd");
    [["text","Reading"],["ide","Python task"],["question","Written answer"],["quiz","Quiz"],["image","Screenshot"],["embed","Video"]]
      .forEach(pair => {
        const btn = el("button","btn-ghost bmini2","+ " + pair[1]);
        btn.addEventListener("click", () => { b.blocks.push(BLANK[pair[0]]()); render(); schedulePreview(); });
        addRow.appendChild(btn);
      });
    body.appendChild(addRow);
  }
  if (b.type === "image") F("What should they show?", "task", { area:true, rows:2 });
  if (b.type === "embed"){
    F("YouTube link, video id, or the whole embed code", "url", { area:true, rows:2,
      placeholder:"https://www.youtube.com/watch?v=xi_tJdq_YNY" });
    const shown = toEmbed(b.url);
    const note = el("p","bhelp", shown ? "Will be embedded as: " + shown : "Paste any YouTube address \u2014 it gets tidied up automatically.");
    if (shown && !/youtube\.com\/embed\//.test(shown)) note.className = "bhelp warn";
    body.appendChild(note);
    F("Title", "title");
  }
  if (b.type === "link"){
    F("Address", "url", { placeholder:"https://..." });
    F("Button label", "title");
    F("What to do there", "task");
  }
  if (b.type === "mc"){
    F("Question", "prompt", { area:true, rows:2 });
    listField("Options (tick the right one)", "options");
    F("Topic tag", "topic", { help:"Used for Strength and Target feedback." });
  }
  if (b.type === "blanks"){
    F("Instruction", "prompt");
    F("Sentence with gaps", "text", { area:true, rows:3,
      help:"Put the answers in double brackets: The [[cat]] sat on the [[mat]]." });
    F("Extra wrong words for the dropdowns", "distractors", { placeholder:"dog, hat" });
    F("Topic tag", "topic");
  }
  if (b.type === "order"){
    F("Instruction", "prompt");
    listField("Items in the CORRECT order", "items", "Students see them shuffled.");
    F("Topic tag", "topic");
  }
  if (b.type === "short"){
    F("Question", "prompt", { area:true, rows:2 });
    F("Keywords", "keywords", { help:"Groups separated by ; and alternatives by , — e.g. loop, repeat; count" });
    F("Model answer", "model", { area:true, rows:2 });
    F("Topic tag", "topic");
  }
  c.appendChild(body);
  return c;
}

/* our own confirmation, rather than the browser's grey box */
function say(title, message, opts){
  const o = opts || {};
  openModal(box => {
    box.appendChild(el("h2","", title));
    if (message) box.appendChild(el("p","modal-text", message));
    const ok = el("button","btn-primary modal-cta", o.okText || "OK");
    ok.addEventListener("click", () => { closeModal(); if (o.then) o.then(); });
    box.appendChild(ok);
    if (o.cancel){
      const no = el("button","btn-ghost modal-stay","Cancel");
      no.addEventListener("click", closeModal);
      box.appendChild(no);
    }
  });
}

function askDelete(what, done){
  openModal(box => {
    box.appendChild(el("h2","","Delete this " + String(what || "task").toLowerCase() + "?"));
    box.appendChild(el("p","modal-text","It will be removed from the lesson. You can undo it only by adding it again."));
    const yes = el("button","btn-primary modal-cta","Delete");
    yes.style.background = "var(--red)";
    yes.addEventListener("click", () => { closeModal(); done(); });
    const no = el("button","btn-ghost modal-stay","Keep it");
    no.addEventListener("click", closeModal);
    box.appendChild(yes); box.appendChild(no);
  });
}

/* ---------- lesson or assessment ---------- */
function setMode(assess){
  lesson.assessment = !!assess;
  $("modeLesson").classList.toggle("on", !assess);
  $("modeAssess").classList.toggle("on", assess);
  $("palLesson").hidden = !!assess;
  $("palAssess").hidden = !assess;
  $("lTitle").placeholder = assess ? "Assessment title, e.g. Unit 1 Assessment" : "Lesson title, e.g. Python 1 — Output";
  saveDraft(); render(); schedulePreview();
}
$("modeLesson").addEventListener("click", () => {
  if (lesson.assessment && lesson.blocks.length){
    openModal(box => {
      box.appendChild(el("h2","","Switch to a lesson?"));
      box.appendChild(el("p","modal-text","Your questions stay, but assessment marking is switched off."));
      const yes = el("button","btn-primary modal-cta","Switch");
      yes.addEventListener("click", () => { closeModal(); setMode(false); });
      const no = el("button","btn-ghost modal-stay","Cancel"); no.addEventListener("click", closeModal);
      box.appendChild(yes); box.appendChild(no);
    });
  } else setMode(false);
});
$("modeAssess").addEventListener("click", () => setMode(true));

/* ---------- the sentences behind Strength and Target ---------- */
$("topicsBtn").addEventListener("click", () => {
  const used = {};
  lesson.blocks.forEach(b => { if (b.topic) used[b.topic] = true; });
  Object.keys(lesson.topics || {}).forEach(k => { used[k] = true; });
  const names = Object.keys(used);
  openModal(box => {
    const x = el("button","btn-ghost iconbtn modal-x","\u2715");
    x.addEventListener("click", closeModal); box.appendChild(x);
    box.appendChild(el("h2","","Strength and Target"));
    box.appendChild(el("p","hint","Each question can carry a topic tag. The topic a student did best in gives their Strength; their weakest gives their Target."));
    if (!names.length) box.appendChild(el("p","modal-text","Add a topic tag to some questions first (for example: loops, variables)."));
    names.forEach(name => {
      const t = lesson.topics[name] || (lesson.topics[name] = { label:name, strength:"", target:"" });
      const g = el("div","qsub");
      g.appendChild(el("b","", name));
      [["label","Friendly name"],["strength","Sentence when this is their BEST topic"],["target","Sentence when this is their WEAKEST topic"]]
        .forEach(pair => {
          const w = el("div","bfield");
          w.appendChild(el("label","", pair[1]));
          const inp = el("textarea"); inp.rows = 2; inp.value = t[pair[0]] || "";
          inp.addEventListener("input", () => { t[pair[0]] = inp.value; saveDraft(); schedulePreview(); });
          w.appendChild(inp); g.appendChild(w);
        });
      box.appendChild(g);
    });
    const done = el("button","btn-primary modal-cta","Done");
    done.addEventListener("click", closeModal);
    box.appendChild(done);
  });
});

document.querySelectorAll(".pal[data-add]").forEach(btn => {
  btn.addEventListener("click", () => {
    const kind = btn.dataset.add;
    lesson.blocks.push(BLANK[kind]());
    render(); schedulePreview();
    const cards = $("list").querySelectorAll(".bcard");
    const last = cards[cards.length - 1];
    if (last && last.scrollIntoView) last.scrollIntoView({ behavior:"smooth", block:"center" });
  });
});
$("lTitle").addEventListener("input", () => { lesson.title = $("lTitle").value; saveDraft(); schedulePreview(); });
$("lIntro").addEventListener("input", () => { lesson.intro = $("lIntro").value; saveDraft(); schedulePreview(); });
$("lUnit").addEventListener("input", () => { lesson.unit = $("lUnit").value; saveDraft(); });

/* ---------------- live preview ---------------- */
let prevTimer = null;
function schedulePreview(){
  clearTimeout(prevTimer);
  $("prevMsg").textContent = "updating\u2026";
  prevTimer = setTimeout(refreshPreview, 900);
}
function refreshPreview(){
  try{
    localStorage.setItem("hub_preview", JSON.stringify(compile()));
    $("prev").src = "lesson.html?id=__preview&builder=1&t=" + Date.now();
    $("prevMsg").textContent = "up to date";
  }catch(e){ $("prevMsg").textContent = e.message; }
}
$("prevBtn").addEventListener("click", refreshPreview);

/* ---------------- getting the file out ---------------- */
function fileName(){
  return (lesson.title || "lesson").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) + ".json";
}
function openModal(build){ $("mBox").innerHTML = ""; build($("mBox")); $("mBack").hidden = false; }
function closeModal(){ $("mBack").hidden = true; }
$("mBack").addEventListener("mousedown", (e) => { if (e.target === $("mBack")) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

$("jsonBtn").addEventListener("click", () => {
  openModal(box => {
    const x = el("button","btn-ghost iconbtn modal-x","\u2715");
    x.addEventListener("click", closeModal); box.appendChild(x);
    box.appendChild(el("h2","","Lesson file"));
    box.appendChild(el("p","hint","Save this as lessons/" + fileName() +
      ", add it to lessons/index.json, then publish it in the teacher console."));
    box.appendChild(el("pre","jsonbox", JSON.stringify(compile(), null, 2)));
    const copy = el("button","btn-primary modal-cta","Copy to clipboard");
    copy.addEventListener("click", async () => {
      try{ await navigator.clipboard.writeText(JSON.stringify(compile(), null, 2)); copy.textContent = "Copied \u2713"; }
      catch(e){ copy.textContent = "Select it and press Ctrl+C"; }
    });
    box.appendChild(copy);
  });
});
/* ---------- publishing straight to the site ----------
   The lesson goes into the school database through the teacher API, so there
   are no files to upload. It arrives as a draft; publishing to classes still
   happens in the teacher console. */
function teacherKey(){ return localStorage.getItem("hub_tkey") || ""; }
function askForKey(then){
  openModal(box => {
    box.appendChild(el("h2","","Teacher key"));
    box.appendChild(el("p","modal-text","Type the teacher key once and this browser will remember it."));
    const w = el("div","bfield");
    const inp = el("input"); inp.type = "password"; inp.autocomplete = "off";
    w.appendChild(inp); box.appendChild(w);
    const go = el("button","btn-primary modal-cta","Save key");
    go.addEventListener("click", () => {
      const v = inp.value.trim();
      if (!v) return;
      localStorage.setItem("hub_tkey", v);
      closeModal(); then();
    });
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    box.appendChild(go); box.appendChild(no);
  });
}
function lessonId(){
  return (lesson.title || "lesson").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50);
}
async function saveToSite(){
  const API = (window.HUB && window.HUB.API) || "";
  if (!API){ say("Not connected", "This copy of the site has no server address in config.js, so it can't save lessons."); return; }
  if (!lesson.title.trim()){ say("Give it a title first", "The title becomes the lesson's name on the site."); return; }
  if (!lesson.unit.trim()){ say("Which unit?", "Every lesson belongs to a unit. Fill in the Unit box at the top."); return; }
  if (!teacherKey()){ askForKey(saveToSite); return; }
  const btn = $("saveSite");
  btn.disabled = true; btn.textContent = "Saving\u2026";
  try{
    const r = await fetch(API + "/api/teacher/save-lesson", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-teacher-key": teacherKey() },
      body: JSON.stringify({ id: lessonId(), title: lesson.title, unit: lesson.unit, data: compile() })
    });
    const d = await r.json();
    if (r.status === 403){ localStorage.removeItem("hub_tkey"); throw new Error("That teacher key was not accepted."); }
    if (!r.ok) throw new Error(d.error || "Could not save it.");
    lesson.savedAs = d.id; saveDraft();
    say(d.published ? "Saved \u2014 it's live" : "Saved to the site",
        d.published
          ? "Students in classes that already have this lesson will see the new version straight away."
          : "It's in your teacher console under " + lesson.unit + ". Press Publish there when a class should see it.");
  }catch(e){ say("Could not save", e.message); }
  finally{ btn.disabled = false; btn.textContent = "Save to the site"; }
}
$("saveSite").addEventListener("click", saveToSite);

/* offer the units that already exist, and load a lesson if asked to edit one */
async function loadUnitsAndMaybeLesson(){
  const API = (window.HUB && window.HUB.API) || "";
  if (!API) return;
  try{
    const r = await fetch(API + "/api/catalog", { cache:"no-store" });
    const d = await r.json();
    const dl = $("unitList"); dl.innerHTML = "";
    (d.units || []).forEach(u => { const o = document.createElement("option"); o.value = u.name; dl.appendChild(o); });
  }catch(e){}
  const editId = new URLSearchParams(location.search).get("edit");
  const wantUnit = new URLSearchParams(location.search).get("unit");
  if (wantUnit && !lesson.unit){ lesson.unit = wantUnit; $("lUnit").value = wantUnit; saveDraft(); }
  if (!editId) return;
  if (!teacherKey()){ askForKey(loadUnitsAndMaybeLesson); return; }
  try{
    const r = await fetch(API + "/api/teacher/get-lesson?id=" + encodeURIComponent(editId),
                          { headers:{ "x-teacher-key": teacherKey() }, cache:"no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Could not open that lesson.");
    const data = JSON.parse(d.lesson.data);
    lesson = fromCompiled(data, d.lesson);
    $("lTitle").value = lesson.title; $("lIntro").value = lesson.intro || "";
    $("lUnit").value = lesson.unit || "";
    setMode(!!lesson.assessment);
    render(); refreshPreview();
  }catch(e){ say("Could not open that lesson", e.message); }
}

/* turn a saved lesson file back into editable cards */
function fromCompiled(data, meta){
  const out = { title: data.title || (meta && meta.title) || "", intro: data.intro || "",
                unit: data.unit || (meta && meta.unit) || "", assessment: !!data.assessment,
                topics: data.topics || {}, blocks: [] };
  const back = (b) => {
    if (b.type === "page") return { type:"page", title:b.title || "", task:b.task || "", blocks:(b.blocks || []).map(back) };
    if (b.type === "text"){
      const h = /<h2[^>]*>([\s\S]*?)<\/h2>/i.exec(b.html || "");
      const body = String(b.html || "").replace(/<h2[\s\S]*?<\/h2>/i, "")
        .replace(/<li>/gi, "- ").replace(/<\/li>/gi, "\n")
        .replace(/<\/p>/gi, "\n\n").replace(/<br\s*\/?>/gi, "\n")
        .replace(/<[^>]+>/g, "").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").trim();
      return { type:"text", heading: h ? h[1].replace(/<[^>]+>/g,"") : "", body };
    }
    if (b.type === "quiz") return { type:"quiz", questions:(b.questions || []).map(q => ({
      q:q.q || "", options:q.options || ["",""], answer:q.answer || 0, hint:q.hint || "" })) };
    if (b.type === "short") return { type:"short", prompt:b.prompt || "",
      keywords:(b.keywords || []).map(g => g.join(", ")).join("; "), model:b.model || "", topic:b.topic || "" };
    if (b.type === "blanks") return { type:"blanks", prompt:b.prompt || "", text:b.text || "",
      distractors:(b.distractors || []).join(", "), topic:b.topic || "" };
    const copy = JSON.parse(JSON.stringify(b));
    delete copy.id;
    return copy;
  };
  out.blocks = (data.blocks || []).map(back);
  return out;
}

$("dlBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(compile(), null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fileName(); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

/* ---------------- paste a Trinket page ----------------
   Trinket pages follow the same shape every time: explanation, starter code,
   then questions. Fill in the parts and you get reading + Python + answers. */
$("importBtn").addEventListener("click", () => {
  openModal(box => {
    const x = el("button","btn-ghost iconbtn modal-x","\u2715");
    x.addEventListener("click", closeModal); box.appendChild(x);
    box.appendChild(el("h2","","Paste a Trinket page"));
    box.appendChild(el("p","hint","Copy each part across. Leave anything blank if that page doesn't have it."));
    function area(label, rows, ph, mono){
      const w = el("div","bfield");
      w.appendChild(el("label","", label));
      const t = el("textarea"); t.rows = rows;
      if (ph) t.placeholder = ph;
      if (mono) t.className = "mono";
      w.appendChild(t); box.appendChild(w);
      return t;
    }
    const head = area("Heading", 1, "Output a message to the screen");
    const expl = area("Explanation text", 5,
      "To output something to the screen in Python, we use the `print()` function");
    const inv  = area("Investigate / instruction", 2,
      "Run the following code and add your own output message on line 3");
    const code = area("Starter code", 6, 'print("Hello World!")', true);
    const qs   = area("Questions to answer (one per line)", 4,
      "What is the purpose of the print function?");
    const go = el("button","btn-primary modal-cta","Add to the lesson");
    go.addEventListener("click", () => {
      // everything from one Trinket page belongs on one page here too
      const kids = [];
      if (head.value.trim() || expl.value.trim())
        kids.push({ type:"text", heading:"", body: expl.value.trim() });
      if (code.value.trim() || inv.value.trim())
        kids.push({ type:"ide", title:"Investigate", task: inv.value.trim(),
                    starter: code.value.replace(/\s+$/, ""), turtle:false, expect:"" });
      qs.value.split("\n").map(x => x.replace(/^\s*[-*\u2022]\s*/, "").trim()).filter(Boolean)
        .forEach(q => kids.push({ type:"question", prompt: q, minWords: 20 }));
      lesson.blocks.push({ type:"page", title: head.value.trim() || "Python page",
                           task:"", blocks: kids });
      closeModal(); render(); refreshPreview();
    });
    box.appendChild(go);
  });
});

/* ---------------- go ---------------- */
loadDraft();
if (!lesson.topics) lesson.topics = {};
$("lTitle").value = lesson.title || "";
$("lIntro").value = lesson.intro || "";
$("lUnit").value = lesson.unit || "";
setMode(!!lesson.assessment);
loadUnitsAndMaybeLesson();
render();
refreshPreview();
if (window.initSettings) initSettings($("setBtn"));
</script>
