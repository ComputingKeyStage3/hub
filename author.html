<script>
const $ = (id) => document.getElementById(id);
/* Declared up here because the whole file leans on it: without a server the
   builder saves by downloading, reads its years and units out of the lessons
   folder, and drops the parts that need a class behind them. */
const OFFLINE = !!(window.HUB && window.HUB.OFFLINE);
/* wiring a button that isn't there should not stop the rest of the page */
function on(id, ev, fn){
  const e = document.getElementById(id);
  if (!e){ console.warn("Nothing on the page with id:", id); return; }
  e.addEventListener(ev, fn);
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------------- the lesson being built ---------------- */
let lesson = { title:"", intro:"", unit:"", year:"", assessment:false, practical:false, homework:false, topics:{}, responses:{}, extensions:[], blocks:[] };

const BLANK = {
  text:     () => ({ type:"text", heading:"", html:"" }),
  picture:  () => ({ type:"picture", title:"Have a look at this", url:"", caption:"", note:"" }),
  pastelink:() => ({ type:"pastelink", heading:"Paste your link", task:"", note:"" }),
  code:     () => ({ type:"code", lang:"" }),        // they pick Python or web next
  ide:      () => ({ type:"ide", title:"Python", task:"Write your code, then press Run.",
                     starter:'print("Hello World!")', turtle:false, expect:"", run:true, edit:true }),
  web:      () => ({ type:"web", title:"Build a web page", task:"Edit the files, then press Run.",
                     html:'<h1>My page</h1>\n<p>Hello!</p>',
                     css:'h1 {\n  color: navy;\n}',
                     js:'console.log("Ready");',
                     run:true, edit:true, help:true, tooltips:true, expect:"" }),
  question: () => ({ type:"question", heading:"Write your answer", context:"", prompt:"", minWords:20 }),
  quiz:     () => ({ type:"quiz", title:"Check your understanding", pass:{ mode:"percent", value:70 },
                     questions:[{ q:"", options:["",""], answers:[0], hint:"", why:"" }] }),
  page:     () => ({ type:"page", title:"New page", task:"", startLocked:true, blocks:[] }),
  image:    () => ({ type:"image", title:"Add your screenshot", task:"Take a screenshot and paste it here." }),
  embed:    () => ({ type:"embed", url:"", title:"Watch this", note:"Watch it all the way through.", confirm:false }),
  frame:    () => ({ type:"frame", url:"", heading:"Have a go", task:"", width:"100%", height:520, confirm:false }),
  link:     () => ({ type:"link", url:"", title:"Open this", heading:"Have a look at this site", task:"", confirm:false }),
  mc:       () => ({ type:"mc", prompt:"", options:["",""], answer:0, topic:"" }),
  blanks:   () => ({ type:"blanks", prompt:"Fill in the gaps", text:"The [[cat]] sat on the mat.", distractors:"", topic:"" }),
  order:    () => ({ type:"order", prompt:"Put these in order", items:["","",""], topic:"" }),
  notes:    () => ({ type:"notes", title:"", task:"", starter:"" }),
  mindmap:  () => ({ type:"mindmap", title:"", task:"", centre:"", lockCentre:false, starter:[] }),
  board:    () => ({ type:"board", title:"", task:"", height:420 }),
  label:    () => ({ type:"label", title:"", task:"", image:"", spots:[] }),
  binary:   () => ({ type:"binary", title:"", task:"", mode:"toDenary", bits:8, count:4,
                     showPlace:true, numbers:"" }),
  binadd:   () => ({ type:"binadd", title:"", task:"", bits:8, count:3,
                     showPlace:true, showCarry:true, pairs:"" }),
  short:    () => ({ type:"short", prompt:"", keywords:"", keywordLabels:"", model:"", why:"", topic:"" }),
  password: () => ({ type:"password", title:"Password strength challenge",
                     task:"Invent a made-up password that turns all five checks green." }),
  /* The teacher writes the real message and picks a shift; the coded text and
     the answer's hash are worked out when the lesson is compiled, so the
     answer never sits in the lesson file in readable form. */
  caesar:   () => ({ type:"caesar", title:"Caesar cipher puzzle",
                     task:"Slide the shift until the message becomes English, then type it in.",
                     message:"THE PASSWORD IS FIREWALL", shift:7,
                     prompt:"Type the hidden message here (letters only, spaces are fine):" })
};
const LABEL = { text:"Paragraph", picture:"Image", pastelink:"Paste a link", ide:"Python task", question:"Written answer", quiz:"Quiz", image:"Screenshot",
                embed:"Video", link:"Link to a site", mc:"Multiple choice", blanks:"Fill the gaps", order:"Put in order",
                short:"Short answer", page:"Page", frame:"Embedded page", binary:"Binary conversion", binadd:"Binary addition", notes:"Notes", mindmap:"Mind map", board:"Whiteboard", label:"Label a picture", code:"Coding task", web:"Web page",
                password:"Password checker", caesar:"Caesar cipher" };

/* The lesson page hashes what a student types and compares it with this, so
   the answer is never sitting in the lesson file for anyone to read. Same
   two functions as lesson.html, and they must stay the same. */
function strHash(s){ let x = 5381; for (const c of s) x = ((x << 5) + x + c.charCodeAt(0)) >>> 0; return x; }
function normLetters(s){ return (s || "").toUpperCase().replace(/[^A-Z]/g, ""); }
/* Shifting forwards makes the coded text; the lesson page shifts back. */
function caesarEncode(text, k){
  return String(text || "").replace(/[A-Za-z]/g, (c) => {
    const base = c === c.toUpperCase() ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - base + (k % 26) + 26) % 26) + base);
  });
}

/* A YouTube address in any of its usual shapes -> the embeddable one. */
function toEmbed(raw){
  const t = String(raw || "").trim();
  if (!t) return "";
  const m = t.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/)
         || t.match(/^([A-Za-z0-9_-]{11})$/);
  if (m) return "https://www.youtube.com/embed/" + m[1];
  const src = t.match(/src\s*=\s*["']([^"']+)["']/i);      // a whole <iframe> pasted in
  if (src) return toEmbed(src[1]) || src[1];
  return t;                                                  // something else: leave it alone
}

/* "a, b and c", which reads better than a list with a stray comma on it */
function joinWords(list){
  if (list.length === 1) return list[0];
  return list.slice(0, -1).join(", ") + " and " + list[list.length - 1];
}

/* ---------------- the draft lives in this browser ---------------- */
/* Nothing is kept in the browser: opening the builder always starts clean,
   or with the lesson you asked to edit. Instead, the tab warns before it is
   closed with work that has not been saved to the site. */
let dirty = false;
function saveDraft(){ dirty = true; }
function loadDraft(){ /* deliberately empty, see the note above */ }
try{
  window.addEventListener("beforeunload", (e) => {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = "";        // browsers show their own wording
    return "";
  });
}catch(e){}
/* clear any draft left by an older version */
try{ localStorage.removeItem("hub_builder"); }catch(e){}
/* Older drafts kept tasks loose at the top level, and quizzes had a single
   answer. Bring both up to date so nothing is lost. */
function tidyIntoPages(){
  if (lesson.assessment) return;
  if (!lesson.blocks.some(b => b.type !== "page")) return;
  const out = [];
  let current = null;
  lesson.blocks.forEach(b => {
    if (b.type === "page"){ out.push(b); current = null; return; }
    if (!current){
      current = { type:"page", title:"Page " + (out.length + 1), task:"", startLocked: out.length > 0, blocks:[] };
      out.push(current);
    }
    current.blocks.push(b);
  });
  lesson.blocks = out;
}

/* Drafts written by the older builder had one question per quiz. */
function migrate(arr){
  (arr || []).forEach(b => {
      if (b.type === "quiz" && b.questions){
      b.questions.forEach(q => { if (!q.answers) q.answers = [q.answer === undefined ? 0 : q.answer]; });
    }
    if (b.type === "text" && b.body !== undefined && b.html === undefined){
      b.html = String(b.body || "").split(/\n{2,}/).map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
      delete b.body;
    }
    if (b.type === "quiz" && !b.questions){
      b.questions = [{ q: b.q || "", options: b.options || ["",""], answer: b.answer || 0, hint: b.hint || "" }];
      delete b.q; delete b.options; delete b.answer; delete b.hint;
    }
    if (b.type === "page") migrate(b.blocks);
  });
}

/* ---------------- cards -> a real lesson file ---------------- */
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
}
function keepArrays(o){
  Object.keys(o).forEach(k => {
    const v = o[k];
    if (v === "" || v === undefined) delete o[k];
    if (Array.isArray(v) && !v.length && (k === "distractors" || k === "keywords")) delete o[k];
  });
  return o;
}
function compile(){
  const out = { title: lesson.title || "Untitled lesson", blocks: [] };
  if (lesson.intro) out.intro = lesson.intro;
  if (lesson.unit) out.unit = lesson.unit;
  if (lesson.year) out.year = lesson.year;
  if (lesson.homework) out.homework = true;
  if (lesson.perfectTarget) out.perfectTarget = lesson.perfectTarget;
  if (lesson.zeroStrength) out.zeroStrength = lesson.zeroStrength;
  if (lesson.practical){
    out.marking = lesson.marking || "rubric";
    if (out.marking === "score") out.outOf = lesson.outOf || 20;
    else out.rubric = (lesson.rubric || []).filter(g => g.name);
  }
  if (lesson.practical){
    out.practical = true;
    out.assessment = true;      // students and teachers treat it as an assessment
  }
  if (lesson.assessment || lesson.practical){
    out.assessment = true;
    const topics = {};
    Object.keys(lesson.topics || {}).forEach(k => {
      const t = lesson.topics[k];
      if (t && (t.label || t.strength || t.target)) topics[k] = { label:t.label||k, strength:t.strength||"", target:t.target||"" };
    });
    if (Object.keys(topics).length) out.topics = topics;
    const responses = {};
    Object.keys(lesson.responses || {}).forEach(topic => {
      const built = [];
      (lesson.responses[topic] || []).forEach((task, i) => compileOne(task, "resp_" + topic + "_" + (i + 1), built));
      if (built.length) responses[topic] = built;
    });
    if (Object.keys(responses).length) out.responses = responses;
    const extras = [];
    (lesson.extensions || []).forEach((task, i) => compileOne(task, "ext_" + (i + 1), extras));
    if (extras.length) out.extensions = extras;
  }
  firstPageOpen();
  lesson.blocks.forEach((b, i) => compileOne(b, b.type + (i + 1), out.blocks));
  return out;
}
function compileOne(b, id, target){
  /* "can be skipped" is remembered on whatever the task compiles to */
  const push = (x) => {
    if (x && b && b.required === false) x.required = false;
    target.push(x);
  };
  if (b.type === "page"){
    const kids = [];
    (b.blocks || []).forEach((child, k) => compileOne(child, id + "_" + (k + 1), kids));
    push({ type:"page", id, title: b.title || "Tasks", task: b.task || "",
           startLocked: b.startLocked !== false,
           passHash: b.passHash || undefined, blocks: kids });
    return;
  }
  {
    if (b.type === "text"){
      // written with the formatting buttons, so it is already HTML
      let html = b.heading ? "<h2>" + esc(b.heading) + "</h2>" : "";
      if (b.html !== undefined){
        push({ type:"text", id,
               heading: b.heading || "",
               html: (window.cleanRichText ? window.cleanRichText(b.html) : b.html) });
        return;
      }
      /* Walk the lines, gathering runs of bullets and runs of prose. Teachers
         write a sentence and then bullets underneath with no blank line, so
         each run has to be emitted on its own. */
      let prose = [], bullets = [];
      const flushProse = () => { if (prose.length){ html += "<p>" + inline(prose.join(" ")) + "</p>"; prose = []; } };
      const flushBullets = () => {
        if (bullets.length){
          html += "<ul>" + bullets.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>";
          bullets = [];
        }
      };
      String(b.body || "").split("\n").forEach(line => {
        if (!line.trim()){ flushBullets(); flushProse(); return; }
        if (/^\s*[-*]\s+/.test(line)){ flushProse(); bullets.push(line.replace(/^\s*[-*]\s+/, "")); return; }
        flushBullets(); prose.push(line.trim());
      });
      flushBullets(); flushProse();
      push({ type:"text", id, html });
    }
    else if (b.type === "ide"){
      const blk = { type:"ide", id, starter: b.starter || "" };
      if (Array.isArray(b.checks) && b.checks.length){
        blk.checks = b.checks.filter(c => (c.label || "").trim())
                             .map(c => Object.assign({}, c,
                               c.marks === undefined ? {} : { marks: Math.max(0, parseInt(c.marks, 10) || 0) }));
        if (b.nudge === false) blk.nudge = false;
      }
      if (b.title) blk.title = b.title;              // headings stay optional
      if (b.task) blk.task = b.task;
      if (b.turtle) blk.turtle = true;
      if (b.expect) blk.expect = b.expect;
      if (b.run === false) blk.run = false;        // console hidden
      if (b.edit === false) blk.edit = false;      // read-only code
      if (b.help === false) blk.help = false;      // no Help tab
      if (b.tooltips === false) blk.tooltips = false;
      push(blk);
    }
    else if (b.type === "question")
      push(keepArrays({ type:"question", id,
             heading: b.heading || "",
             context: b.context ? (window.cleanRichText ? window.cleanRichText(b.context) : b.context) : "",
             prompt: b.prompt ? (window.cleanRichText ? window.cleanRichText(b.prompt) : b.prompt) : "",
             minWords: Number(b.minWords) || 20 }));
    else if (b.type === "password")
      push({ type:"password", id, title: b.title || "", task: b.task || "" });
    else if (b.type === "caesar"){
      /* The message the teacher typed is shifted here and the answer is
         stored only as a hash, so neither the plain message nor the answer
         can be read out of the lesson file. */
      const shift = Math.max(1, Math.min(25, Number(b.shift) || 7));
      push({ type:"caesar", id,
             title: b.title || "", task: b.task || "", prompt: b.prompt || "",
             ciphertext: caesarEncode(b.message || "", shift),
             answerHash: strHash(normLetters(b.message || "")) });
    }
    else if (b.type === "web"){
      const blk = { type:"web", id, html: b.html || "", css: b.css || "", js: b.js || "",
                    files: (b.files && b.files.length) ? b.files : ["html","css","js"] };
      if (b.addFiles === true) blk.addFiles = true;
      if (Array.isArray(b.checks) && b.checks.length){
        blk.checks = b.checks.filter(c => (c.label || "").trim())
                             .map(c => Object.assign({}, c,
                               c.marks === undefined ? {} : { marks: Math.max(0, parseInt(c.marks, 10) || 0) }));
        if (b.nudge === false) blk.nudge = false;
      }
      if (b.title) blk.title = b.title;
      if (b.task) blk.task = b.task;
      if (b.expect) blk.expect = b.expect;
      if (b.run === false) blk.run = false;
      if (b.edit === false) blk.edit = false;
      if (b.help === false) blk.help = false;
      if (b.tooltips === false) blk.tooltips = false;
      push(blk);
    }
    else if (b.type === "code"){ /* not chosen yet, nothing to build */ }
    else if (b.type === "notes")
      push(keepArrays({ type:"notes", id, title: b.title || "", task: b.task || "",
        starter: b.starter || "" }));
    else if (b.type === "mindmap")
      push(keepArrays({ type:"mindmap", id, title: b.title || "", task: b.task || "",
        centre: b.centre || "", lockCentre: b.lockCentre === true,
        starter: Array.isArray(b.starter) ? b.starter : [] }));
    else if (b.type === "board")
      push(keepArrays({ type:"board", id, title: b.title || "", task: b.task || "",
        height: Number(b.height) || 420 }));
    else if (b.type === "label")
      push(keepArrays({ type:"label", id, title: b.title || "", task: b.task || "",
        image: b.image || "",
        /* the words to drag are simply the answers, shuffled so their order
           is not a clue */
        words: (b.spots || []).map(sp => sp.answer).filter(Boolean)
                 .sort(() => Math.random() - 0.5),
        spots: (b.spots || []).filter(sp => sp.answer) }));
    else if (b.type === "binary")
      push(keepArrays({ type:"binary", id, title: b.title || "", task: b.task || "",
        mode: b.mode || "toDenary", bits: Number(b.bits) || 8, count: Number(b.count) || 4,
        showPlace: b.showPlace !== false,
        numbers: String(b.numbers || "").split(/[\s,]+/).map(Number).filter(n => !isNaN(n) && n >= 0) }));
    else if (b.type === "binadd")
      push(keepArrays({ type:"binadd", id, title: b.title || "", task: b.task || "",
        bits: Number(b.bits) || 8, count: Number(b.count) || 3,
        showPlace: b.showPlace !== false, showCarry: b.showCarry !== false,
        pairs: String(b.pairs || "").split(/\n/).map(line => {
          const two = line.split(/[+,]/).map(x => parseInt(x.trim(), 10));
          return (two.length === 2 && !isNaN(two[0]) && !isNaN(two[1])) ? two : null;
        }).filter(Boolean) }));
    else if (b.type === "picture")
      push(keepArrays({ type:"picture", id, title: b.title || "", url: b.url || "",
             caption: b.caption || "", note: b.note || "" }));
    else if (b.type === "pastelink")
      push(keepArrays({ type:"pastelink", id, heading: b.heading || "Paste your link",
             task: b.task || "", note: b.note || "" }));
    else if (b.type === "quiz")
      push({ type:"quiz", id, title: b.title || "",
        questions: (b.questions || (b.q !== undefined
          ? [{ q:b.q, options:b.options, answers:[b.answer || 0], hint:b.hint }] : [])).map(q => {
            const opts = (q.options || []);
            const answers = (q.answers !== undefined ? q.answers : [q.answer || 0])
              .map(Number).filter(x => !isNaN(x) && x >= 0 && x < opts.length);
            return { q: q.q || "", options: opts.filter(x => x !== ""),
                     answers: answers.length ? answers : [0],
                     hint: q.hint || "", why: q.why || "" };
          }),
        pass: (b.pass && b.pass.mode && b.pass.mode !== "none")
          ? { mode: b.pass.mode, value: Math.max(1, parseInt(b.pass.value, 10) || 1) }
          : undefined });
    else if (b.type === "image")
      push(keepArrays({ type:"image", id, title: b.title || "", task: b.task || "" }));
    else if (b.type === "embed")
      push(keepArrays({ type:"embed", id, url: toEmbed(b.url), title: b.title || "",
             note: b.note || "", confirm: b.confirm === true }));
    else if (b.type === "frame")
      push(keepArrays({ type:"frame", id, url: b.url || "", heading: b.heading || "", task: b.task || "",
             width: b.width || "100%", height: b.height || 520, confirm: b.confirm === true }));
    else if (b.type === "link")
      push(keepArrays({ type:"link", id, url: b.url || "", title: b.title || "Open this",   // the button needs words
             heading: b.heading || "", task: b.task || "", confirm: b.confirm === true }));
    else if (b.type === "mc")
      push(keepArrays({ type:"mc", id, prompt: b.prompt || "", options: (b.options || []).filter(x => x !== ""),
        answer: Number(b.answer) || 0, topic: lesson.assessment ? b.topic : "" }));
    else if (b.type === "blanks")
      push(keepArrays({ type:"blanks", id, prompt: b.prompt || "", text: b.text || "",
        distractors: (b.distractors || "").split(/\s*,\s*/).filter(Boolean),
        topic: lesson.assessment ? b.topic : "" }));
    else if (b.type === "order")
      push(keepArrays({ type:"order", id, prompt: b.prompt || "",
        items: (b.items || []).filter(x => x !== ""), topic: lesson.assessment ? b.topic : "" }));
    else if (b.type === "short")
      push(keepArrays({ type:"short", id, prompt: b.prompt || "",
        keywords: (b.keywords || "").split(";").map(g => g.split(/\s*,\s*/).map(x => x.trim()).filter(Boolean)).filter(g => g.length),
        keywordLabels: (b.keywordLabels || "").split(";").map(x => x.trim()).filter(Boolean),
        model: b.model || "", topic: lesson.assessment ? b.topic : "" }));
  }
}

/* ---------------- drawing the cards ---------------- */
let dragFrom = null;
let openPage = 0;          // the page new tasks join
let lastAddedAt = -1;      // where the newest task landed, so we can scroll to it
let listWired = false;
function wireList(){
  if (listWired) return;
  listWired = true;
  const list = $("list");
  list.addEventListener("dragover", (e) => {
    if (!canDropOn(lesson.blocks)) return;
    e.preventDefault();
    list.classList.add("over");
  });
  list.addEventListener("dragleave", () => list.classList.remove("over"));
  list.addEventListener("drop", (e) => {
    e.preventDefault();
    list.classList.remove("over");
    dropInto(lesson.blocks, -1);
  });
}
function firstPageOpen(){
  const first = lesson.blocks.find(x => x.type === "page");
  if (first) first.startLocked = false;
}
function render(){
  wireList();
  firstPageOpen();
  /* the palette is hidden only while writing feedback sentences */
  const writingTargets = (lesson.assessment || lesson.practical) && assessTab === "targets" && !respEditing;
  if (!writingTargets){
    /* Practice for a weak topic can be any kind of task, so writing response
       tasks offers the full lesson palette rather than the short list of
       question types an assessment is marked from. */
    const anyTask = !!respEditing;
    $("palLesson").hidden = !!lesson.assessment && !anyTask;
    $("palAssess").hidden = !lesson.assessment || anyTask;
  }
  const list = $("list"); list.innerHTML = "";
  /* an assessment is three pages: its questions, its feedback, its follow-up */
  if ((lesson.assessment || lesson.practical) && assessTab === "targets" && !respEditing){
    $("palLesson").hidden = true; $("palAssess").hidden = true;
    paintTargets(list); saveDraft(); return;
  }
  if ((lesson.assessment || lesson.practical) && assessTab === "responses" && !respEditing){
    paintResponseTopics(list); saveDraft(); return;
  }
  if (respEditing){
    const head = el("div","classhead");
    const niceName = (lesson.topics[respEditing] && lesson.topics[respEditing].label) || respEditing;
    head.appendChild(el("h2","", respEditing === "__ext" ? "Extension tasks"
                                                        : "Response tasks \u2022 " + niceName));
    const back = el("button","btn-ghost bmini2","Back to the list");
    back.addEventListener("click", () => { respEditing = null; render(); schedulePreview(); });
    head.appendChild(back);
    list.appendChild(head);
    const arr = respEditing === "__ext" ? (lesson.extensions || [])
                                        : (lesson.responses[respEditing] || []);
    if (!arr.length){
      const empty = el("p","hint dropzone","No tasks here yet, drag one from the left, or click it.");
      list.appendChild(empty);
    }
    arr.forEach((b, i) => list.appendChild(card(b, i, arr)));
    /* dropping anywhere in the empty space adds to the end */
    list.addEventListener("dragover", (e) => {
      if (!canDropOn(arr)) return;
      e.preventDefault(); list.classList.add("over");
    });
    list.addEventListener("dragleave", () => list.classList.remove("over"));
    list.addEventListener("drop", (e) => {
      e.preventDefault(); list.classList.remove("over");
      dropInto(arr, -1);
    });
    saveDraft();
    return;
  }
  if (!lesson.blocks.length)
    list.appendChild(el("p","hint", lesson.assessment
      ? "No questions yet, add one from the left."
      : "Nothing here yet, add a task or a page from the left."));
  lesson.blocks.forEach((b, i) => list.appendChild(card(b, i, lesson.blocks)));
  saveDraft();
}
let newTask = null;          // a task being dragged in from the palette

/* pages only live at the top; everything else only lives on a page */
/* the list of tasks currently on screen */
function openArray(){
  if (!respEditing) return null;
  return respEditing === "__ext" ? lesson.extensions : (lesson.responses[respEditing] || []);
}
function canDropOn(arr){
  const kind = newTask || (dragFrom && dragFrom.type);
  if (!kind) return false;
  /* a page only makes sense at the top of a lesson */
  if (kind === "page") return arr === lesson.blocks && !respEditing;
  /* While a response set is open it is the only place a task can go —
     otherwise the page behind it takes the drop instead. */
  if (respEditing) return arr === openArray();
  return lesson.assessment ? true : arr !== lesson.blocks;
}
/* put whatever is being dragged at position `at` in `arr` */
function dropInto(arr, at){
  /* Refusing must leave the drag alone: another list may still be about to
     accept it, and clearing here would take the task away from it. */
  if (!canDropOn(arr)) return;
  if (newTask){
    const made = BLANK[newTask]();
    newTask = null;
    arr.splice(at < 0 ? arr.length : at, 0, made);
    render(); schedulePreview();
    return;
  }
  if (!dragFrom) return;
  const from = dragFrom; dragFrom = null;
  const moved = from.arr[from.i];
  if (!moved) { render(); return; }
  if (from.arr === arr){
    let to = at < 0 ? arr.length - 1 : at;
    if (from.i === to){ render(); return; }
    from.arr.splice(from.i, 1);
    arr.splice(to, 0, moved);                 // it takes the place it was dropped on
  } else {
    from.arr.splice(from.i, 1);
    arr.splice(at < 0 ? arr.length : at, 0, moved);
  }
  render(); schedulePreview();
}

function move(arr, i, d){
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  const moved = arr.splice(i, 1)[0];
  arr.splice(j, 0, moved);
  render(); schedulePreview();
}
function card(b, i, arr){
  const c = el("div","bcard");
  c.draggable = false;

  const head = el("div","bhead");
  if (b.type === "page"){
    const at = lesson.blocks.indexOf(b);
    if (at === openPage) c.classList.add("open");
    c.addEventListener("mousedown", () => {
      const i2 = lesson.blocks.indexOf(b);
      if (i2 >= 0 && i2 !== openPage){ openPage = i2; render(); }
    });
  }
  const grip = el("span","bgrip","\u2630"); grip.title = "Drag to move";
  grip.addEventListener("mousedown", () => { c.draggable = true; });
  grip.addEventListener("mouseup", () => { c.draggable = false; });
  head.appendChild(grip);
  head.appendChild(el("b","btype", (i + 1) + ". " + LABEL[b.type]));
  const tools = el("span","btools");
  if (b.type === "page"){
    const isFirst = lesson.blocks.indexOf(b) === 0;
    if (isFirst) b.startLocked = false;     // students must be able to begin

    const lk = el("button","btn-ghost bmini lockbtn" + (locked ? "" : " open"), locked ? "\u{1F512}" : "\u{1F513}");
    lk.title = isFirst ? "The first page always starts unlocked"
             : locked ? (OFFLINE ? "Locked until the passcode is typed, click to leave it open"
                                 : "Starts locked when a class gets this lesson, click to start it unlocked")
                      : "Starts unlocked, click to start it locked";
    lk.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isFirst){
        say("The first page stays unlocked",
            "Students need somewhere to begin, so the first page of a lesson is always open. " +
            "Move another page to the front if you want that one open instead.");
        return;
      }
      b.startLocked = !locked;
      if (b.startLocked === false){ delete b.passCode; delete b.passHash; }
      render(); schedulePreview();
    });
    tools.appendChild(lk);
    /* Without a server nothing releases a page: the passcode is the release,
       so a locked page without one would simply be shut for ever. The pill
       says which it is, and saving is refused until they all have one. */
    if (OFFLINE && locked && !isFirst){
      const set = !!b.passHash;
      const pill = el("button","passpill " + (set ? "set" : "unset"),
                       set ? "Passcode set" : "Set a passcode");
      pill.title = set ? "Change the passcode for this page"
                       : "This page cannot be opened until it has one";
      pill.addEventListener("click", (e) => { e.stopPropagation(); askPasscode(b); });
      tools.appendChild(pill);
    }
  }
  const acts = [["\u2191","Move up", () => move(arr, i, -1)],
                ["\u2193","Move down", () => move(arr, i, 1)],
                ["\u29C9","Duplicate", () => { arr.splice(i + 1, 0, JSON.parse(JSON.stringify(b))); render(); schedulePreview(); }],
                ["\u2715","Delete", () => askDelete(LABEL[b.type], () => { arr.splice(i, 1); render(); schedulePreview(); })]];
  acts.forEach(a => {
    const btn = el("button","btn-ghost bmini", a[0]); btn.title = a[1];
    btn.addEventListener("click", a[2]);
    tools.appendChild(btn);
  });
  head.appendChild(tools);
  c.appendChild(head);

  c.addEventListener("dragstart", (e) => {
    e.stopPropagation();                     // a task inside a page is not the page
    dragFrom = { arr: arr, i: i, type: b.type };
    newTask = null;
    c.classList.add("dragging");
    if (e.dataTransfer){ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", "task"); }
  });
  c.addEventListener("dragend", () => { c.classList.remove("dragging"); c.draggable = false; dragFrom = null; });
  c.addEventListener("dragover", (e) => {
    if (!dragFrom && !newTask) return;
    if (!canDropOn(arr)) return;
    e.preventDefault(); e.stopPropagation();
    c.classList.add("over");
  });
  c.addEventListener("dragleave", () => c.classList.remove("over"));
  c.addEventListener("drop", (e) => {
    e.preventDefault(); e.stopPropagation();
    c.classList.remove("over");
    dropInto(arr, i);
  });

  const body = el("div","bbody");
  function F(label, key, opts){
    const o = opts || {};
    const w = el("div","bfield");
    w.appendChild(el("label","", label));
    const input = o.area ? el("textarea") : el("input");
    if (o.area) input.rows = o.rows || 4;

                               { rows: o.rows || 4, placeholder: o.placeholder });

  /* on/off buttons; each entry is [key, label, defaultOn] */

      const many = q.answers.length > 1;
      ow.appendChild(el("label","", many ? "Options (tick every right answer)" : "Options (tick the right one)"));
      (q.options || []).forEach((val, k) => {
        const row = el("div","brow");
        const inp = el("input"); inp.value = val;
        inp.addEventListener("input", () => { q.options[k] = inp.value; saveDraft(); schedulePreview(); });
        row.appendChild(inp);
        const isRight = q.answers.indexOf(k) >= 0;
        const pick = el("button","btn-ghost bmini" + (isRight ? " right" : ""), "\u2713");
        pick.title = isRight ? "A correct answer, click to unmark" : "Mark as a correct answer";
        pick.addEventListener("click", () => {
          const at = q.answers.indexOf(k);
          if (at >= 0){ if (q.answers.length > 1) q.answers.splice(at, 1); }
          else q.answers.push(k);
          q.answers.sort((x, y) => x - y);
          render(); schedulePreview();
        });
        row.appendChild(pick);
        const del = el("button","btn-ghost bmini","\u2715");
        del.addEventListener("click", () => {
          q.options.splice(k, 1);
          q.answers = q.answers.filter(a => a !== k).map(a => a > k ? a - 1 : a);
          if (!q.answers.length) q.answers = [0];
          render(); schedulePreview();
        });
        row.appendChild(del);
        ow.appendChild(row);
      });
      ow.appendChild(el("p","bhelp", q.answers.length > 1
        ? "Students must tick all " + q.answers.length + " to get it right."
        : "Tick a second option to make it a multiple-answer question."));
      const addOpt = el("button","btn-ghost bmini2","+ Add another option");
      addOpt.addEventListener("click", () => { q.options.push(""); render(); });
      ow.appendChild(addOpt); box.appendChild(ow);
      /* The lesson page has always been able to show this; there was simply
         nowhere to write it. */
      const yw = el("div","bfield");
      yw.appendChild(el("label","","Sentence to display when they get it right"));
      const yi = el("input"); yi.value = q.why || "";
      yi.addEventListener("input", () => { q.why = yi.value; saveDraft(); schedulePreview(); });
      yw.appendChild(yi); box.appendChild(yw);
      const hw = el("div","bfield");
      hw.appendChild(el("label","","Hint if they get it wrong"));
      const hi = el("input"); hi.value = q.hint || "";
      hi.addEventListener("input", () => { q.hint = hi.value; saveDraft(); schedulePreview(); });
      hw.appendChild(hi); box.appendChild(hw);
      body.appendChild(box);
    });
    const addQ = el("button","btn-ghost bmini2","+ Add another question");
    addQ.addEventListener("click", () => { b.questions.push({ q:"", options:["",""], answer:0, hint:"", why:"" }); render(); schedulePreview(); });
    body.appendChild(addQ);

    /* A student now answers every question straight through and is told how
       they did at the end, rather than being held on one until it is right.
       Being held there taught them to change the answer until the box went
       green, which is not the same as thinking about it. This is how well
       they have to do before they can move on. */
    if (!b.pass) b.pass = { mode:"percent", value:70 };

        b.pass.value = Math.max(1, Math.min(most, Math.round(Number(v) || 1)));

        saveDraft(); schedulePreview();
      };
      less.addEventListener("click", () => setPass((parseInt(num.value, 10) || 1) - (b.pass.mode === "percent" ? 10 : 1)));
      more.addEventListener("click", () => setPass((parseInt(num.value, 10) || 1) + (b.pass.mode === "percent" ? 10 : 1)));
      num.addEventListener("input", () => setPass(num.value));
      row.appendChild(less); row.appendChild(num); row.appendChild(more);
      pw.appendChild(row);
      pw.appendChild(el("p","bhelp", b.pass.mode === "percent"
        ? "Below this they are asked to have another go before moving on."

        rm.addEventListener("click", () => { b.spots.splice(i, 1); saveDraft(); paintSpots(); schedulePreview(); });
        row.appendChild(word); row.appendChild(rm);
        list.appendChild(row);
      });
      if (!b.spots.length) list.appendChild(el("p","hint","No boxes yet. Drag on the picture to draw one."));

    let from = null;
    const pct = (e) => {
      const r = holder.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * 100,
               y: ((e.clientY - r.top) / r.height) * 100 };
    };
    holder.addEventListener("pointerdown", (e) => {
      if (e.target.classList.contains("label-spot")) return;
      e.preventDefault();
      holder.setPointerCapture(e.pointerId);
      from = pct(e);
      ghost.hidden = false;
      ghost.style.left = from.x + "%"; ghost.style.top = from.y + "%";
      ghost.style.width = "0%"; ghost.style.height = "0%";
    });
    holder.addEventListener("pointermove", (e) => {
      if (!from) return;
      const now = pct(e);
      ghost.style.left = Math.min(from.x, now.x) + "%";
      ghost.style.top = Math.min(from.y, now.y) + "%";
      ghost.style.width = Math.abs(now.x - from.x) + "%";
      ghost.style.height = Math.abs(now.y - from.y) + "%";
    });
    holder.addEventListener("pointerup", (e) => {
      if (!from) return;
      const now = pct(e);
      const spot = { x: Math.min(from.x, now.x), y: Math.min(from.y, now.y),
                     w: Math.abs(now.x - from.x), h: Math.abs(now.y - from.y), answer:"" };
      from = null;
      ghost.hidden = true;
      if (spot.w < 3 || spot.h < 3) return;      // a stray click, not a box

    F("How many questions", "count", { num:true });
  if (b.type === "password"){

    const sw = el("div","bfield");
    sw.appendChild(el("label","","Shift"));
    const srow = el("div","stepper");
    const down = el("button","btn-ghost iconbtn","−");

    const up = el("button","btn-ghost iconbtn","+");
    /* One step either way is no puzzle at all, and 26 is back where it

    num.addEventListener("input", () => setShift(parseInt(num.value, 10) || 7));

    /* What the class will actually see, so a teacher can check it before

    showCoded();
    sw.appendChild(coded);
    body.appendChild(sw);
    F("Label above the answer box", "prompt");
  }
    if (b.type === "binary"){
      const mw = el("div","bfield");
      mw.appendChild(el("label","","Which way round"));
      const row = el("div","brow");
      [["toDenary","Binary to denary"],["toBinary","Denary to binary"],["either","A mixture"]].forEach(pair => {
        const btn = el("button","btn-ghost bmini2" + (b.mode === pair[0] ? " right" : ""), pair[1]);
        btn.addEventListener("click", () => { b.mode = pair[0]; render(); schedulePreview(); });

      mw.appendChild(row); body.appendChild(mw);
      F("Set numbers (optional)", "numbers", { help:"Separate with commas, e.g. 13, 200. Left empty, numbers are made up each time." });

  c.appendChild(body);

/* our own confirmation, rather than the browser's grey box */
function say(title, message, opts){
  const o = opts || {};
  openModal(box => {
    box.appendChild(el("h2","", title));
    if (message) box.appendChild(el("p","modal-text", message));
    const ok = el("button","btn-primary modal-cta", o.okText || "OK");
    ok.addEventListener("click", () => { closeModal(); if (o.then) o.then(); });
    box.appendChild(ok);
    if (o.cancel){
      const no = el("button","btn-ghost modal-stay","Cancel");
      no.addEventListener("click", closeModal);
      box.appendChild(no);
    }
  });
}

function askDelete(what, done){
  openModal(box => {
    box.appendChild(el("h2","","Delete this " + String(what || "task").toLowerCase() + "?"));
    box.appendChild(el("p","modal-text","It will be removed from the lesson. You can undo it only by adding it again."));
    const yes = el("button","btn-primary modal-cta","Delete");
    yes.style.background = "var(--red)";
    yes.addEventListener("click", () => { closeModal(); done(); });
    const no = el("button","btn-ghost modal-stay","Keep it");
    no.addEventListener("click", closeModal);
    box.appendChild(yes); box.appendChild(no);
  });
}

/* ---------- lesson or assessment ---------- */
/* Three kinds: a lesson, a marked assessment, and a practical one, built
   like a lesson but marked by hand and shown to students as an assessment. */
function setMode(assess, practical){
  lesson.assessment = !!assess;
  lesson.practical = !!practical;
  if (practical) lesson.assessment = false;
  /* The practical button is taken off the page when there is no server, so
     it may not be there to mark. */
  const prBtn = $("modePractical");
  if (prBtn) prBtn.classList.toggle("on", !!practical);
  $("modeHome").classList.toggle("on", !!lesson.homework && !assess && !practical);
  $("assessTabs").hidden = !assess && !practical;
  $("tabQuestions").textContent = practical ? "Tasks" : "Questions";
  if (!assess){ assessTab = "questions"; respEditing = null; }
  $("modeLesson").classList.toggle("on", !assess && !practical && !lesson.homework);
  $("modeAssess").classList.toggle("on", assess);
  $("palLesson").hidden = !!assess;          // a practical uses the lesson palette
  $("palAssess").hidden = !assess;

  saveDraft(); render(); schedulePreview();
}
on("modeLesson", "click", () => {
  lesson.homework = false;
  if (lesson.assessment && lesson.blocks.length){
    openModal(box => {
      box.appendChild(el("h2","","Switch to a lesson?"));
      box.appendChild(el("p","modal-text","Your questions stay, but assessment marking is switched off."));
      const yes = el("button","btn-primary modal-cta","Switch");
      yes.addEventListener("click", () => { closeModal(); setMode(false, false); });
      const no = el("button","btn-ghost modal-stay","Cancel"); no.addEventListener("click", closeModal);
      box.appendChild(yes); box.appendChild(no);
    });
  } else setMode(false, false);
});
on("modeAssess", "click", () => setMode(true, false));
on("modePractical", "click", () => { lesson.homework = false; setMode(false, true); });
on("modeHome", "click", () => {
  /* the same as a lesson in every way, but students see it as home learning */
  lesson.homework = true;
  setMode(false, false);
});
function setAssessTab(which){
  assessTab = which;
  respEditing = null;
  ["tabQuestions","tabTargets","tabResponses"].forEach(id => {
    const on2 = (id === "tabQuestions" && which === "questions") ||
                (id === "tabTargets" && which === "targets") ||
                (id === "tabResponses" && which === "responses");
    const e = $(id); if (e) e.classList.toggle("on", on2);
  });
  render();
}
on("tabQuestions", "click", () => setAssessTab("questions"));
on("tabTargets", "click", () => setAssessTab("targets"));
on("tabResponses", "click", () => setAssessTab("responses"));

/* ---------- the sentences behind Strength and Target ---------- */

/* ---------- response tasks ----------
   After an assessment, students are given the tasks that belong to their
   weakest topic. They are ordinary tasks, kept per topic. */
/* one row per task: click it to edit, arrows to move, cross to remove */
/* Strength and Target, on its own page */
/* How a practical is marked: out of a number, or against a rubric. */
/* The grades a practical can be given, each with what earns it. */
function rubricPopup(){
  if (!lesson.rubric) lesson.rubric = [];
  openModal(box => {
    box.classList.add("wide");
    box.appendChild(el("h2","","Rubric"));
    box.appendChild(el("p","modal-text","Put the best grade first. Teachers pick one of these when marking."));
    const list = el("div");
    box.appendChild(list);
    function paint(){
      list.innerHTML = "";
      if (!lesson.rubric.length) list.appendChild(el("p","hint","No grades yet, press \u201c+ New grade\u201d."));
      lesson.rubric.forEach((g, i) => {
        const card = el("div","qsub");
        const head = el("div","qsub-head");
        const nameIn = el("input"); nameIn.value = g.name || "";
        nameIn.className = "checkname";
        nameIn.addEventListener("input", () => { g.name = nameIn.value; saveDraft(); });
        head.appendChild(nameIn);
        const tools = el("span","btools");
        const move = (d) => () => {
          const j = i + d;
          if (j < 0 || j >= lesson.rubric.length) return;
          lesson.rubric.splice(j, 0, lesson.rubric.splice(i, 1)[0]);
          saveDraft(); paint();
        };
        [["\u2191","Move up", move(-1)],
         ["\u2193","Move down", move(1)],
         ["\u29C9","Duplicate", () => {
            lesson.rubric.splice(i + 1, 0, JSON.parse(JSON.stringify(g)));
            saveDraft(); paint();
          }],
         ["\u2715","Remove", () => { lesson.rubric.splice(i, 1); saveDraft(); paint(); }]
        ].forEach(t => {
          const b = el("button","btn-ghost bmini", t[0]);
          b.title = t[1];
          b.addEventListener("click", t[2]);
          tools.appendChild(b);
        });
        head.appendChild(tools);
        card.appendChild(head);
        const d = el("div","bfield");
        d.appendChild(el("label","","What is needed for this grade"));
        const desc = el("textarea"); desc.rows = 2; desc.value = g.description || "";
        desc.addEventListener("input", () => { g.description = desc.value; saveDraft(); });
        d.appendChild(desc);
        card.appendChild(d);
        list.appendChild(card);
      });
    }
    paint();
    const add = el("button","btn-ghost bmini2","+ New grade");
    add.addEventListener("click", () => { lesson.rubric.push({ name:"", description:"" }); saveDraft(); paint(); });
    box.appendChild(add);
    const done = el("button","btn-primary modal-cta","Done");
    done.addEventListener("click", () => { closeModal(); render(); schedulePreview(); });
    box.appendChild(done);
  });
}

/* The kinds of check a teacher can add, worded as a sentence they finish. */
const PY_CHECKS = [
  ["uses",       "Uses a...",              "which"],
  ["codeHas",    "The code contains...",   "text"],
  ["codeLacks",  "The code avoids...",     "text"],
  ["defines",    "Defines a function...",  "name"],
  ["calls",      "Calls...",               "name"],
  ["outputHas",  "The output contains...", "text"],
  ["outputIs",   "The output is exactly...","text"],
  ["lineCount",  "At least this many lines","number"]
];
const WEB_CHECKS = [
  ["tag",        "Has this tag...",        "tag"],
  ["classOrId",  "Has this class or id...","selector"],
  ["attr",       "An element has this attribute...","selector"],
  ["contentHas", "The page shows...",      "text"],
  ["cssHas",     "A CSS rule sets...",     "selector"],
  ["fileHas",    "A file contains...",     "text"]
];
const USES_OPTIONS = ["for loop","while loop","if","else","elif","input","print",
                      "list","function","variable","comment","random","turtle"];

function checklistPopup(block, isWeb){
  const kinds = isWeb ? WEB_CHECKS : PY_CHECKS;
  openModal(box => {
    box.classList.add("narrow");
    box.appendChild(el("h2","","Checklist"));
    box.appendChild(el("p","modal-text",
      "Each line becomes something the student can tick off. Keep the wording plain, " +
      "it is what they read when they are stuck."));
    const list = el("div");
    box.appendChild(list);

    function paint(){
      list.innerHTML = "";
      if (!block.checks.length)
        list.appendChild(el("p","hint","Nothing yet, press \u201c+ New check\u201d."));
      block.checks.forEach((c, i) => {
        const card = el("div","qsub");
        const head = el("div","qsub-head");
        const label = el("input"); label.className = "checkname";
        label.value = c.label || "";
        label.placeholder = "What the student sees";
        label.addEventListener("input", () => { c.label = label.value; saveDraft(); });
        head.appendChild(label);
        const tools = el("span","btools");
        [["\u2191","Move up", () => { if (i){ block.checks.splice(i-1,0,block.checks.splice(i,1)[0]); saveDraft(); paint(); } }],
         ["\u2193","Move down", () => { if (i<block.checks.length-1){ block.checks.splice(i+1,0,block.checks.splice(i,1)[0]); saveDraft(); paint(); } }],
         ["\u2715","Remove", () => { block.checks.splice(i,1); saveDraft(); paint(); }]
        ].forEach(t => {
          const btn = el("button","btn-ghost bmini", t[0]);
          btn.title = t[1];
          btn.addEventListener("click", t[2]);
          tools.appendChild(btn);
        });
        head.appendChild(tools);
        card.appendChild(head);

        /* An assessment has to add a coding task up somehow, and the checklist
           is the only thing about it that can be judged automatically. Each
           line is worth however many marks the teacher says. */
        if (lesson.assessment){
          const mrow = el("div","bfield");
          mrow.appendChild(el("label","","Marks for this"));
          const mstep = el("div","stepper");
          const mless = el("button","btn-ghost iconbtn","−");
          const mnum = el("input"); mnum.type = "number"; mnum.className = "stepnum";
          mnum.min = "0"; mnum.max = "20";
          if (c.marks === undefined) c.marks = 1;
          mnum.value = String(c.marks);
          const mmore = el("button","btn-ghost iconbtn","+");
          const setMarks = (v) => {
            c.marks = Math.max(0, Math.min(20, Math.round(Number(v) || 0)));
            mnum.value = String(c.marks);
            saveDraft(); schedulePreview();
          };
          mless.addEventListener("click", () => setMarks((parseInt(mnum.value, 10) || 0) - 1));
          mmore.addEventListener("click", () => setMarks((parseInt(mnum.value, 10) || 0) + 1));
          mnum.addEventListener("input", () => setMarks(mnum.value));
          mstep.appendChild(mless); mstep.appendChild(mnum); mstep.appendChild(mmore);
          mrow.appendChild(mstep);
          card.appendChild(mrow);
        }

        const row = el("div","bfield");
        row.appendChild(el("label","","What to look for"));
        const pick = document.createElement("select");
        kinds.forEach(k => {
          const o = document.createElement("option");
          o.value = k[0]; o.textContent = k[1];
          pick.appendChild(o);
        });
        pick.value = c.kind || kinds[0][0];
        pick.addEventListener("change", () => {
          c.kind = pick.value;
          /* so a check is never left with nothing to look for */
          if (c.kind === "uses" && !c.value) c.value = USES_OPTIONS[0];
          saveDraft(); paint();
        });
        row.appendChild(pick);
        card.appendChild(row);

        /* the fields this kind of check needs */
        const needs = (name, key, help) => {
          const f = el("div","bfield");
          f.appendChild(el("label","", name));
          const inp = el("input");
          inp.value = c[key] || "";
          if (help) inp.placeholder = help;
          inp.addEventListener("input", () => { c[key] = inp.value; saveDraft(); });
          f.appendChild(inp);
          card.appendChild(f);
        };
        const kind = c.kind || kinds[0][0];
        if (kind === "uses"){
          const f = el("div","bfield");
          f.appendChild(el("label","","Which one"));
          const sel = document.createElement("select");
          USES_OPTIONS.forEach(o2 => {
            const o = document.createElement("option");
            o.value = o2; o.textContent = o2;
            sel.appendChild(o);
          });
          sel.value = c.value || USES_OPTIONS[0];
          sel.addEventListener("change", () => { c.value = sel.value; saveDraft(); });
          f.appendChild(sel);
          card.appendChild(f);
        }
        else if (kind === "lineCount") needs("How many lines", "count", "5");
        else if (kind === "tag") needs("Tag name", "selector", "h1");
        else if (kind === "classOrId") needs("Class or id", "selector", ".title or #header");
        else if (kind === "attr"){
          needs("Element", "selector", "img");
          needs("Attribute", "attr", "src");
          needs("Value (optional)", "value", "cat.png");
        }
        else if (kind === "cssHas"){
          needs("Selector", "selector", ".title");
          needs("Property", "property", "color");
          needs("Value (optional)", "value", "red");
        }
        else if (kind === "fileHas"){
          const f = el("div","bfield");
          f.appendChild(el("label","","Which file"));
          const sel = document.createElement("select");
          [["html","HTML"],["css","CSS"],["js","JavaScript"]].forEach(o2 => {
            const o = document.createElement("option");
            o.value = o2[0]; o.textContent = o2[1];
            sel.appendChild(o);
          });
          sel.value = c.file || "html";
          sel.addEventListener("change", () => { c.file = sel.value; saveDraft(); });
          f.appendChild(sel);
          card.appendChild(f);
          needs("Text to look for", "value", "console.log");
        }
        else needs("Text to look for", "value", "");

        list.appendChild(card);
      });
    }
    paint();

    const add = el("button","btn-ghost bmini2","+ New check");
    add.addEventListener("click", () => {
      const first = kinds[0][0];
      block.checks.push({ label:"", kind: first, value: first === "uses" ? USES_OPTIONS[0] : "" });
      saveDraft(); paint();
    });
    box.appendChild(add);
    const done = el("button","btn-primary modal-cta","Done");
    done.addEventListener("click", () => {
      block.checks = block.checks.filter(c => (c.label || "").trim());
      block.checks.forEach(c => { if (c.kind === "uses" && !c.value) c.value = USES_OPTIONS[0]; });
      closeModal(); render(); schedulePreview();
    });
    box.appendChild(done);
  });
}

function markingSetup(into){

    const b = el("button","btn-ghost bmini2" + (lesson.marking === pair[0] ? " right" : ""), pair[1]);
    b.addEventListener("click", () => { lesson.marking = pair[0]; saveDraft(); render(); schedulePreview(); });
    row.appendChild(b);
  });
  body.appendChild(row);

  if (lesson.marking === "score"){

    less.addEventListener("click", () => setN((parseInt(num.value, 10) || 1) - 5));
    more.addEventListener("click", () => setN((parseInt(num.value, 10) || 1) + 5));
    num.addEventListener("input", () => { lesson.outOf = Math.max(1, parseInt(num.value, 10) || 1); saveDraft(); });
    st.appendChild(less); st.appendChild(num); st.appendChild(more);

    w.appendChild(el("p","bhelp", n

function paintTargets(into){
  const used = {};
  lesson.blocks.forEach(b => { if (b.topic) used[b.topic] = true; });
  Object.keys(lesson.topics || {}).forEach(k => { used[k] = true; });
  const names = Object.keys(used);
  if (lesson.practical) markingSetup(into);
  into.appendChild(el("p","hint", lesson.practical
    ? "These become a bank you can pick from when marking, so you are not writing the same sentence twice."
    : "The topic a student did best in gives their Strength; their weakest gives their Target."));
  const addBtn = el("button","btn-primary bmini2","+ New topic");
  addBtn.addEventListener("click", () => {
    let n = 1;
    while (lesson.topics["Topic " + n]) n++;
    lesson.topics["Topic " + n] = { label:"Topic " + n, strength:"", target:"" };
    saveDraft(); render();
  });
  into.appendChild(addBtn);
  if (!names.length && !Object.keys(lesson.topics || {}).length){
    into.appendChild(el("p","hint", lesson.practical
      ? "No topics yet, press \u201c+ New topic\u201d."
      : "No topics yet, press \u201c+ New topic\u201d, or tag some questions."));
    extremeSentences(into);       // these two stand on their own
    return;
  }
  names.forEach(name => {
    if (!lesson.topics[name]) lesson.topics[name] = { label:name, strength:"", target:"" };
    const t = lesson.topics[name];
    const card2 = el("div","bcard");
    const head = el("div","bhead");
    head.appendChild(el("b","btype", name));
    const del = el("button","btn-ghost bmini","\u2715");
    del.title = "Remove this topic";
    del.addEventListener("click", () => {
      delete lesson.topics[name];
      if (lesson.responses) delete lesson.responses[name];
      saveDraft(); render(); schedulePreview();
    });
    head.appendChild(del);
    card2.appendChild(head);
    const body = el("div","bbody");
    [["label", lesson.practical ? "Topic name" : "Friendly name"],
     ["strength", lesson.practical ? "Strength" : "When this is their BEST topic"],
     ["target", lesson.practical ? "Target" : "When this is their WEAKEST topic"]]
      .forEach(pair => {
        const w = el("div","bfield");
        w.appendChild(el("label","", pair[1]));
        const inp = el("textarea"); inp.rows = 2; inp.value = t[pair[0]] || "";
        inp.addEventListener("input", () => { t[pair[0]] = inp.value; saveDraft(); schedulePreview(); });
        w.appendChild(inp); body.appendChild(w);
      });
    card2.appendChild(body);
    into.appendChild(card2);
  });
  extremeSentences(into);
}

let respEditing = null;
let assessTab = "questions";   // questions | targets | responses

/* Every section starts folded away, so the palette is the same short list
   each time it is opened. It used to remember which ones were open, which
   meant a section opened once stayed open for ever after and looked like a
   bug rather than a memory. */
function wirePalette(){
  document.querySelectorAll(".palgroup").forEach(group => {
    const heading = group.querySelector(".pal-head");
    const tasks = group.querySelector(".palbody");
    if (!heading || !tasks) return;

    const setOpen = (open) => {
      tasks.hidden = !open;
      heading.classList.toggle("open", open);
    };

    setOpen(false);
    heading.addEventListener("click", () => setOpen(tasks.hidden));
  });
  try{ localStorage.removeItem("hub_pal"); }catch(e){}   // the old memory
}
wirePalette();

document.querySelectorAll(".pal[data-add]").forEach(btn => {
  btn.draggable = true;
  btn.addEventListener("dragstart", (e) => {
    newTask = btn.dataset.add;
    dragFrom = null;
    btn.classList.add("dragging");
    if (e.dataTransfer){ e.dataTransfer.effectAllowed = "copy"; e.dataTransfer.setData("text/plain", newTask); }
  });
  btn.addEventListener("dragend", () => { btn.classList.remove("dragging"); newTask = null; });
  btn.addEventListener("click", () => {
    const kind = btn.dataset.add;
    if (respEditing){                     // a response or extension set is open
      const arr = respEditing === "__ext" ? lesson.extensions : lesson.responses[respEditing];
      arr.push(BLANK[kind]());
      lastAddedAt = arr.length - 1;
      render(); schedulePreview();
      return;
    }
    if (kind === "page" || lesson.assessment){
      lesson.blocks.push(BLANK[kind]());
      lastAddedAt = lesson.blocks.length - 1;
    } else {
      /* Lessons are made of pages, so a task always goes on one. It joins the
         page you last touched, or a new page if there isn't one yet. */
      let page = lesson.blocks[openPage] && lesson.blocks[openPage].type === "page"
        ? lesson.blocks[openPage] : null;
      if (!page){
        for (let i = lesson.blocks.length - 1; i >= 0; i--){
          if (lesson.blocks[i].type === "page"){ page = lesson.blocks[i]; openPage = i; break; }
        }
      }
      if (!page){
        page = BLANK.page();
        page.title = "New page";
        lesson.blocks.push(page);
        openPage = lesson.blocks.length - 1;
      }
      page.blocks.push(BLANK[kind]());
      lastAddedAt = -1;                  // it is inside a page, so the page is the target
    }
    render(); schedulePreview();
    /* go to the task that was just added, wherever it landed */
    const cards = $("list").querySelectorAll(".bcard");
    const target = (lastAddedAt >= 0 && cards[lastAddedAt]) ? cards[lastAddedAt] : cards[cards.length - 1];
    if (target && target.scrollIntoView) target.scrollIntoView({ behavior:"smooth", block:"center" });
    if (target && target.classList){
      target.classList.add("justopened");
      setTimeout(() => target.classList.remove("justopened"), 1600);
    }
  });
});

/* Setting the passcode for a page. Only its hash reaches the lesson file, so
   a student reading lessons/whatever.json cannot find the word; the plain
   version is kept in this browser's draft so the teacher can still see what
   they chose while they are writing the lesson. Reopening a saved lesson on
   another machine shows the pill as set but cannot show the word itself. */
function askPasscode(b){
  openModal(box => {
    box.appendChild(el("h2","","Passcode for this page"));
    box.appendChild(el("p","modal-text",
      "Students type this to move on to it. Read it out when the class is ready."));
    const w = el("div","bfield");
    w.appendChild(el("label","","Passcode"));
    const inp = el("input");
    inp.autocomplete = "off";
    inp.spellcheck = false;
    inp.value = b.passCode || "";
    inp.placeholder = b.passHash && !b.passCode ? "Set on another computer, type a new one" : "";
    w.appendChild(inp);
    box.appendChild(w);
    const msg = el("p","bhelp","");
    box.appendChild(msg);
    const go = el("button","btn-primary modal-cta","Save the passcode");
    go.addEventListener("click", () => {
      const v = inp.value.trim();
      if (v.length < 3){ msg.textContent = "Make it at least three characters."; return; }
      /* Matched the same way the lesson page matches it: upper case, so
         nobody is caught out by a capital letter. */
      b.passCode = v;
      b.passHash = strHash(v.toUpperCase());
      closeModal(); render(); schedulePreview();
    });
    box.appendChild(go);
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    box.appendChild(no);
    setTimeout(() => { inp.focus(); inp.select(); }, 30);
  });
}

/* Every locked page that has not got a passcode yet, by its number. */
function pagesMissingPasscode(){
  const out = [];
  lesson.blocks.forEach((b, i) => {
    if (b.type !== "page" || i === 0) return;
    if (b.startLocked !== false && !b.passHash) out.push(i + 1);
  });
  return out;
}

/* ---------------- adding a task under the ones already on a page ----------------
   The same tasks as the palette down the left, in the same groups and the
   same order, folded away so the row does not become a wall of buttons. Read
   from the palette itself rather than written out again, because two lists of
   the same thing drift apart and nobody notices for a term. */
function taskGroups(){
  const from = (lesson.assessment && !openArray()) ? "palAssess" : "palLesson";
  const box = $(from);
  if (!box) return [];
  return Array.from(box.querySelectorAll(".palgroup")).map(group => ({
    name: (group.querySelector(".pal-head") || {}).textContent || "",
    kinds: Array.from(group.querySelectorAll(".pal[data-add]")).map(btn => ({
      kind: btn.dataset.add,
      label: (btn.querySelector("b") || {}).textContent || btn.dataset.add
    }))
  })).filter(g => g.kinds.length);
}

function addTaskRow(page){
  const wrap = el("div","pageadd");
  const bar = el("div","pageadd-bar");        // the containers, side by side
  const tray = el("div","pageadd-tray");      // whichever one is open, below
  tray.hidden = true;
  wrap.appendChild(bar); wrap.appendChild(tray);
  const groups = taskGroups();

  function openGroup(group, chip){
    const already = chip.classList.contains("open");
    bar.querySelectorAll(".pageadd-chip").forEach(c => c.classList.remove("open"));
    tray.innerHTML = "";
    if (already){ tray.hidden = true; return; }
    chip.classList.add("open");
    group.kinds.forEach(item => {
      const btn = el("button","btn-ghost bmini2", item.label);
      btn.addEventListener("click", () => {
        if (!BLANK[item.kind]) return;
        page.blocks.push(BLANK[item.kind]());
        render(); schedulePreview();
      });
      tray.appendChild(btn);
    });
    tray.hidden = false;
  }

  const chips = groups.map(group => {
    const chip = el("button","pageadd-chip","+ " + group.name);
    chip.type = "button";
    chip.addEventListener("click", () => openGroup(group, chip));
    bar.appendChild(chip);
    return { group, chip };
  });

  /* Whatever will not fit on one line goes behind a More container at the
     end, which opens sideways rather than pushing the row onto two lines.
     Measured after it is on the page, because until then nothing has a
     width to measure. */
  const more = el("button","pageadd-chip pageadd-more","More");
  more.type = "button";
  const overflow = el("div","pageadd-overflow");
  overflow.hidden = true;
  const moreWrap = el("span","pageadd-morewrap");
  moreWrap.appendChild(more); moreWrap.appendChild(overflow);
  more.addEventListener("click", (e) => {
    e.stopPropagation();
    overflow.hidden = !overflow.hidden;
    more.classList.toggle("open", !overflow.hidden);
  });
  document.addEventListener("pointerdown", (e) => {
    if (overflow.hidden) return;
    if (moreWrap.contains(e.target)) return;
    overflow.hidden = true; more.classList.remove("open");
  });

  function fold(){
    if (!wrap.isConnected) return;
    /* start again from everything on the bar, then move the tail off it */
    chips.forEach(c => bar.appendChild(c.chip));
    overflow.innerHTML = "";
    if (moreWrap.parentNode) moreWrap.parentNode.removeChild(moreWrap);
    bar.appendChild(moreWrap);
    moreWrap.hidden = true;
    const top = bar.getBoundingClientRect().top;
    const spill = chips.filter(c => c.chip.getBoundingClientRect().top > top + 4);
    if (!spill.length) return;
    moreWrap.hidden = false;
    /* The ones that spilled move first. Only then is it worth asking whether
       More still fits, because until they have gone it never will and the
       loop below would strip the bar bare. */
    spill.forEach(c => overflow.appendChild(c.chip));
    let cut = chips.length - spill.length;
    while (cut > 1 && moreWrap.getBoundingClientRect().top > top + 4){
      cut--;
      overflow.insertBefore(chips[cut].chip, overflow.firstChild);
    }
  }
  /* after the browser has laid the row out, and again if the window changes */
  setTimeout(fold, 0);
  window.addEventListener("resize", fold);
  return wrap;
}

function scrollBody(box){
  if (box.querySelector(".modal-scroll")) return;
  const kids = Array.from(box.children);
  const middle = kids.filter(n =>
    !n.classList.contains("modal-x") &&
    !n.classList.contains("modal-cta") &&
    !n.classList.contains("modal-stay"));
  if (middle.length < 2) return;

function lessonId(){
  /* A lesson keeps the name it was saved under. Renaming it changes the
     title, not which lesson it is, otherwise editing would quietly leave a
     copy of the old one behind, still sitting in whichever classes had it. */
  if (lesson.savedAs) return lesson.savedAs;
  return (lesson.title || "lesson").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50);
}
/* Save the lesson as a file for the lessons folder, with what to do next.
   Two things go into GitHub: the lesson file itself, and a line in
   lessons/index.json that files it under a year and unit and gives it the
   four digit code students type when a link has not reached them. */
async function downloadForFolder(){
  if (!lesson.title.trim()){ say("Give it a title first", "The title becomes the lesson's name on the site."); return; }
  if (!lesson.year || !lesson.year.trim()){
    say("Which year group?", "The hub files lessons by year, so every lesson needs one.");
    return;
  }
  if (!lesson.unit || !lesson.unit.trim()){
    say("Which unit?", "Choose a unit at the top, or make a new one. Units sit inside a year group.");
    return;
  }
  /* A locked page with no passcode can never be opened by anybody, so the
     lesson would be unteachable past that point. */
  const missing = pagesMissingPasscode();
  if (missing.length){
    say(missing.length === 1 ? "Page " + missing[0] + " has no passcode"
                             : "Some pages have no passcode",
        (missing.length === 1
          ? "Page " + missing[0] + " is locked"
          : "Pages " + missing.join(", ") + " are locked") +
        ", and a locked page can only be opened by typing its passcode. " +
        "Press the red pill beside the padlock to set one.");
    return;
  }
  const id = lessonId();
  /* An existing lesson keeps the code it was given: it is on a worksheet,
     in somebody's planner, and written on the board. Only a new one gets
     a fresh one, chosen so nothing else in the folder is using it. */
  let code = lesson.code || "";
  let known = { lessons: [] };
  try{ known = await window.lessonFile.load(true); }catch(e){}
  if (!code) code = window.lessonFile.codeFor(known, id) || window.lessonFile.newCode(known);
  lesson.code = code;

  const built = compile();
  const blob = new Blob([JSON.stringify(built, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = id + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  dirty = false;

  const listed = (known.lessons || []).some(l => l.id === id);
  const unitExists = (known.units || []).some(u => u.name === lesson.unit && (u.year || "") === lesson.year);
  /* The lesson's line on its own is no use if there is no unit for it to sit
     in, so a brand new unit comes out whole, ready to drop in beside the
     others. */
  const entry = Object.assign(
    { id: id, title: lesson.title, description: lesson.intro || "" },
    (lesson.assessment || lesson.practical) ? { assessment: true } : {},
    lesson.homework ? { homework: true } : {},
    { code: code });
  const paste = unitExists ? entry
    : { name: lesson.unit, year: lesson.year, lessons: [entry] };

  openModal(box => {
    box.appendChild(el("h2","","Saved as " + id + ".json"));
    box.appendChild(el("p","modal-text", listed
      ? "It is already listed in lessons/index.json, so there is one thing left to do:"
      : "To put it on the site:"));
    const list = el("ol","modal-steps");
    const steps = ["Put " + id + ".json into the lessons folder in GitHub, replacing the old one if it is there."];
    if (!listed){
      steps.push(unitExists
        ? "Open lessons/index.json and add this to the lessons of “" + lesson.unit + "”:"
        : "Open lessons/index.json. There is no “" + lesson.unit + "” yet, so add this whole unit to the list:");
    }
    steps.push("Commit. The lesson is on the site within a minute or so.");
    steps.forEach(t => list.appendChild(el("li","", t)));
    box.appendChild(list);

    if (!listed){
      const snippet = el("pre","codeblock");
      snippet.textContent = JSON.stringify(paste, null, 2);
      box.appendChild(snippet);
      const copy = el("button","btn-ghost","Copy that");
      copy.addEventListener("click", async () => {
        try{ await navigator.clipboard.writeText(snippet.textContent); copy.textContent = "Copied ✓"; }
        catch(e){ copy.textContent = "Select it and press Ctrl+C"; }
      });
      box.appendChild(copy);
    }

    box.appendChild(el("p","set-label","How the class gets in"));
    box.appendChild(el("p","modal-text","Give them this link:"));
    box.appendChild(el("pre","codeblock", window.lessonFile.linkFor(id)));
    box.appendChild(el("p","modal-text","Or, from the front page, this code:"));
    box.appendChild(el("p","sharecode", code));

    /* Only the hashes go into the file, so this is the last chance to write
       the passcodes down. */
    const gates = [];
    lesson.blocks.forEach((blk, i) => {
      if (blk.type === "page" && i > 0 && blk.startLocked !== false && blk.passCode)
        gates.push("Page " + (i + 1) + ": " + blk.passCode);
    });
    if (gates.length){
      box.appendChild(el("p","set-label","Passcodes for the locked pages"));
      box.appendChild(el("p","modal-text","Write these down, they are not stored in the lesson file."));
      box.appendChild(el("pre","codeblock", gates.join("\n")));
    }

    const done = el("button","btn-primary modal-cta","Done");
    done.addEventListener("click", closeModal);
    box.appendChild(done);
  });
}

async function saveToSite(){
  const API = (window.HUB && window.HUB.API) || "";
  /* Offline there is nowhere to save to, so the lesson is downloaded instead
     and dropped into the lessons folder on GitHub. */
  if (OFFLINE){ await downloadForFolder(); return; }
  if (!API){ say("Not connected", "This copy of the site has no server address in config.js, so it can't save lessons."); return; }
  if (!lesson.title.trim()){ say("Give it a title first", "The title becomes the lesson's name on the site."); return; }
  if (!lesson.year || !lesson.year.trim()){ say("Which year group?", "Choose a year group at the top, or make a new one."); return; }
  if (!lesson.unit || !lesson.unit.trim()){ say("Which unit?", "Choose a unit at the top, or make a new one."); return; }
  if (!teacherKey()){ askForKey(saveToSite); return; }
  const btn = $("saveSite");
  btn.disabled = true; btn.textContent = "Saving\u2026";
  try{
    const r = await fetch(API + "/api/teacher/save-lesson", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-teacher-key": teacherKey() },
      body: JSON.stringify({ id: lessonId(), title: lesson.title, unit: lesson.unit,
                             year: lesson.year || "", owner: lesson.ownerGroup || "", data: compile() })
    });
    const d = await r.json();
    if (r.status === 403){ localStorage.removeItem("hub_tkey"); throw new Error("That teacher key was not accepted."); }
    if (!r.ok) throw new Error(d.error || "Could not save it.");
    lesson.savedAs = d.id;
    dirty = false;                       // saved, and nothing changed since
    say(d.published ? "Saved, it's live" : "Saved to the site",
        d.published
          ? "Students in classes that already have this lesson will see the new version straight away."
          : "It's in your teacher console under " + lesson.unit + ". Press Publish there when a class should see it.");
  }catch(e){ say("Could not save", e.message); }
  finally{ btn.disabled = false; btn.textContent = "Save to the site"; }
}
