<script>
const $ = (id) => document.getElementById(id);
/* wiring a button that isn't there should not stop the rest of the page */
function on(id, ev, fn){
  const e = document.getElementById(id);
  if (!e){ console.warn("Nothing on the page with id:", id); return; }
  e.addEventListener(ev, fn);
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* words only — used where a task's own text is shown as a summary */
function stripTags(x){ return String(x || "").replace(/<[^>]*>/g, "").trim(); }

/* ---------------- the lesson being built ---------------- */
let lesson = { title:"", intro:"", unit:"", year:"", assessment:false, practical:false, homework:false, topics:{}, responses:{}, extensions:[], blocks:[] };

const BLANK = {
  text:     () => ({ type:"text", heading:"", html:"" }),
  picture:  () => ({ type:"picture", title:"Have a look at this", url:"", caption:"", note:"" }),
  pastelink:() => ({ type:"pastelink", heading:"Paste your link", task:"", note:"" }),
  code:     () => ({ type:"code", lang:"" }),        // they pick Python or web next
  ide:      () => ({ type:"ide", title:"Python", task:"Write your code, then press Run.",
                     starter:'print("Hello World!")', turtle:false, expect:"", run:true, edit:true }),
  web:      () => ({ type:"web", title:"Build a web page", task:"Edit the files, then press Run.",
                     html:'<h1>My page</h1>\n<p>Hello!</p>',
                     css:'h1 {\n  color: navy;\n}',
                     js:'console.log("Ready");',
                     run:true, edit:true, help:true, tooltips:true, expect:"" }),
  question: () => ({ type:"question", heading:"Write your answer", context:"", prompt:"", minWords:20 }),
  quiz:     () => ({ type:"quiz", title:"Check your understanding", questions:[{ q:"", options:["",""], answers:[0], hint:"" }] }),
  page:     () => ({ type:"page", title:"New page", task:"", startLocked:true, blocks:[] }),
  image:    () => ({ type:"image", title:"Add your screenshot", task:"Take a screenshot and paste it here." }),
  embed:    () => ({ type:"embed", url:"", title:"Watch this", note:"Watch it all the way through.", confirm:false }),
  frame:    () => ({ type:"frame", url:"", heading:"Have a go", task:"", width:"100%", height:520, confirm:false }),
  link:     () => ({ type:"link", url:"", title:"Open this", heading:"Have a look at this site", task:"", confirm:false }),
  mc:       () => ({ type:"mc", prompt:"", options:["",""], answer:0, topic:"" }),
  blanks:   () => ({ type:"blanks", prompt:"Fill in the gaps", text:"The [[cat]] sat on the mat.", distractors:"", topic:"" }),
  order:    () => ({ type:"order", prompt:"Put these in order", items:["","",""], topic:"" }),
  binary:   () => ({ type:"binary", title:"", task:"", mode:"toDenary", bits:8, count:4,
                     showPlace:true, numbers:"" }),
  binadd:   () => ({ type:"binadd", title:"", task:"", bits:8, count:3,
                     showPlace:true, showCarry:true, pairs:"" }),
  short:    () => ({ type:"short", prompt:"", keywords:"", keywordLabels:"", model:"", why:"", topic:"" })
};
const LABEL = { text:"Paragraph", picture:"Image", pastelink:"Paste a link", ide:"Python task", question:"Written answer", quiz:"Quiz", image:"Screenshot",
                embed:"Video", link:"Link to a site", mc:"Multiple choice", blanks:"Fill the gaps", order:"Put in order",
                short:"Short answer", page:"Page", frame:"Embedded page", binary:"Binary conversion", binadd:"Binary addition", code:"Coding task", web:"Web page" };

/* A YouTube address in any of its usual shapes -> the embeddable one. */
function toEmbed(raw){
  const t = String(raw || "").trim();
  if (!t) return "";
  const m = t.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/)
         || t.match(/^([A-Za-z0-9_-]{11})$/);
  if (m) return "https://www.youtube.com/embed/" + m[1];
  const src = t.match(/src\s*=\s*["']([^"']+)["']/i);      // a whole <iframe> pasted in
  if (src) return toEmbed(src[1]) || src[1];
  return t;                                                  // something else: leave it alone
}

/* ---------------- the draft lives in this browser ---------------- */
/* Nothing is kept in the browser: opening the builder always starts clean,
   or with the lesson you asked to edit. Instead, the tab warns before it is
   closed with work that has not been saved to the site. */
let dirty = false;
function saveDraft(){ dirty = true; }
function loadDraft(){ /* deliberately empty — see the note above */ }
try{
  window.addEventListener("beforeunload", (e) => {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = "";        // browsers show their own wording
    return "";
  });
}catch(e){}
/* clear any draft left by an older version */
try{ localStorage.removeItem("hub_builder"); }catch(e){}
/* Older drafts kept tasks loose at the top level, and quizzes had a single
   answer. Bring both up to date so nothing is lost. */
function tidyIntoPages(){
  if (lesson.assessment) return;
  if (!lesson.blocks.some(b => b.type !== "page")) return;
  const out = [];
  let current = null;
  lesson.blocks.forEach(b => {
    if (b.type === "page"){ out.push(b); current = null; return; }
    if (!current){
      current = { type:"page", title:"Page " + (out.length + 1), task:"", startLocked: out.length > 0, blocks:[] };
      out.push(current);
    }
    current.blocks.push(b);
  });
  lesson.blocks = out;
}

/* Drafts written by the older builder had one question per quiz. */
function migrate(arr){
  (arr || []).forEach(b => {
      if (b.type === "quiz" && b.questions){
      b.questions.forEach(q => { if (!q.answers) q.answers = [q.answer === undefined ? 0 : q.answer]; });
    }
    if (b.type === "text" && b.body !== undefined && b.html === undefined){
      b.html = String(b.body || "").split(/\n{2,}/).map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
      delete b.body;
    }
    if (b.type === "quiz" && !b.questions){
      b.questions = [{ q: b.q || "", options: b.options || ["",""], answer: b.answer || 0, hint: b.hint || "" }];
      delete b.q; delete b.options; delete b.answer; delete b.hint;
    }
    if (b.type === "page") migrate(b.blocks);
  });
}

/* ---------------- cards -> a real lesson file ---------------- */
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
}
/* Empty text fields can go, but arrays the lesson page reads (options, items)
   must stay — otherwise a half-finished card breaks the preview. */
function withRequired(o, b){
  if (b && b.required === false) o.required = false;
  return o;
}
function keepArrays(o){
  Object.keys(o).forEach(k => {
    const v = o[k];
    if (v === "" || v === undefined) delete o[k];
    if (Array.isArray(v) && !v.length && (k === "distractors" || k === "keywords")) delete o[k];
  });
  return o;
}
function compileBlock(b, id){
  const out = [];
  compileOne(b, id, out);
  return out[0];
}
function compile(){
  const out = { title: lesson.title || "Untitled lesson", blocks: [] };
  if (lesson.intro) out.intro = lesson.intro;
  if (lesson.unit) out.unit = lesson.unit;
  if (lesson.year) out.year = lesson.year;
  if (lesson.homework) out.homework = true;
  if (lesson.perfectTarget) out.perfectTarget = lesson.perfectTarget;
  if (lesson.zeroStrength) out.zeroStrength = lesson.zeroStrength;
  if (lesson.practical){
    out.marking = lesson.marking || "score";
    if (out.marking === "score") out.outOf = lesson.outOf || 20;
    else out.rubric = (lesson.rubric || []).filter(g => g.name);
  }
  if (lesson.year) out.year = lesson.year;
  if (lesson.homework) out.homework = true;
  if (lesson.perfectTarget) out.perfectTarget = lesson.perfectTarget;
  if (lesson.zeroStrength) out.zeroStrength = lesson.zeroStrength;
  if (lesson.practical){
    out.marking = lesson.marking || "score";
    if (out.marking === "score") out.outOf = lesson.outOf || 20;
    else out.rubric = (lesson.rubric || []).filter(g => g.name);
  }
  if (lesson.practical){
    out.practical = true;
    out.assessment = true;      // students and teachers treat it as an assessment
  }
  if (lesson.assessment || lesson.practical){
    out.assessment = true;
    const topics = {};
    Object.keys(lesson.topics || {}).forEach(k => {
      const t = lesson.topics[k];
      if (t && (t.label || t.strength || t.target)) topics[k] = { label:t.label||k, strength:t.strength||"", target:t.target||"" };
    });
    if (Object.keys(topics).length) out.topics = topics;
    const responses = {};
    Object.keys(lesson.responses || {}).forEach(topic => {
      const built = [];
      (lesson.responses[topic] || []).forEach((task, i) => compileOne(task, "resp_" + topic + "_" + (i + 1), built));
      if (built.length) responses[topic] = built;
    });
    if (Object.keys(responses).length) out.responses = responses;
    const extras = [];
    (lesson.extensions || []).forEach((task, i) => compileOne(task, "ext_" + (i + 1), extras));
    if (extras.length) out.extensions = extras;
  }
  firstPageOpen();
  lesson.blocks.forEach((b, i) => compileOne(b, b.type + (i + 1), out.blocks));
  return out;
}
function compileOne(b, id, target){
  /* "can be skipped" is remembered on whatever the task compiles to */
  const push = (x) => {
    if (x && b && b.required === false) x.required = false;
    target.push(x);
  };
  if (b.type === "page"){
    const kids = [];
    (b.blocks || []).forEach((child, k) => compileOne(child, id + "_" + (k + 1), kids));
    push({ type:"page", id, title: b.title || "Tasks", task: b.task || "",
           startLocked: b.startLocked !== false, blocks: kids });
    return;
  }
  {
    if (b.type === "text"){
      // written with the formatting buttons, so it is already HTML
      let html = b.heading ? "<h2>" + esc(b.heading) + "</h2>" : "";
      if (b.html !== undefined){
        push({ type:"text", id,
               heading: b.heading || "",
               html: (window.cleanRichText ? window.cleanRichText(b.html) : b.html) });
        return;
      }
      /* Walk the lines, gathering runs of bullets and runs of prose. Teachers
         write a sentence and then bullets underneath with no blank line, so
         each run has to be emitted on its own. */
      let prose = [], bullets = [];
      const flushProse = () => { if (prose.length){ html += "<p>" + inline(prose.join(" ")) + "</p>"; prose = []; } };
      const flushBullets = () => {
        if (bullets.length){
          html += "<ul>" + bullets.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>";
          bullets = [];
        }
      };
      String(b.body || "").split("\n").forEach(line => {
        if (!line.trim()){ flushBullets(); flushProse(); return; }
        if (/^\s*[-*]\s+/.test(line)){ flushProse(); bullets.push(line.replace(/^\s*[-*]\s+/, "")); return; }
        flushBullets(); prose.push(line.trim());
      });
      flushBullets(); flushProse();
      push({ type:"text", id, html });
    }
    else if (b.type === "ide"){
      const blk = { type:"ide", id, starter: b.starter || "" };
      if (b.title) blk.title = b.title;              // headings stay optional
      if (b.task) blk.task = b.task;
      if (b.turtle) blk.turtle = true;
      if (b.expect) blk.expect = b.expect;
      if (b.run === false) blk.run = false;        // console hidden
      if (b.edit === false) blk.edit = false;      // read-only code
      if (b.help === false) blk.help = false;      // no Help tab
      if (b.tooltips === false) blk.tooltips = false;
      push(blk);
    }
    else if (b.type === "question")
      push(keepArrays({ type:"question", id,
             heading: b.heading || "",
             context: b.context ? (window.cleanRichText ? window.cleanRichText(b.context) : b.context) : "",
             prompt: b.prompt || "",
             minWords: Number(b.minWords) || 20 }));
    else if (b.type === "web"){
      const blk = { type:"web", id, html: b.html || "", css: b.css || "", js: b.js || "",
                    files: (b.files && b.files.length) ? b.files : ["html","css","js"] };
      if (b.addFiles === true) blk.addFiles = true;
      if (b.title) blk.title = b.title;
      if (b.task) blk.task = b.task;
      if (b.expect) blk.expect = b.expect;
      if (b.run === false) blk.run = false;
      if (b.edit === false) blk.edit = false;
      if (b.help === false) blk.help = false;
      if (b.tooltips === false) blk.tooltips = false;
      push(blk);
    }
    else if (b.type === "code"){ /* not chosen yet — nothing to build */ }
    else if (b.type === "binary")
      push(keepArrays({ type:"binary", id, title: b.title || "", task: b.task || "",
        mode: b.mode || "toDenary", bits: Number(b.bits) || 8, count: Number(b.count) || 4,
        showPlace: b.showPlace !== false,
        numbers: String(b.numbers || "").split(/[\s,]+/).map(Number).filter(n => !isNaN(n) && n >= 0) }));
    else if (b.type === "binadd")
      push(keepArrays({ type:"binadd", id, title: b.title || "", task: b.task || "",
        bits: Number(b.bits) || 8, count: Number(b.count) || 3,
        showPlace: b.showPlace !== false, showCarry: b.showCarry !== false,
        pairs: String(b.pairs || "").split(/\n/).map(line => {
          const two = line.split(/[+,]/).map(x => parseInt(x.trim(), 10));
          return (two.length === 2 && !isNaN(two[0]) && !isNaN(two[1])) ? two : null;
        }).filter(Boolean) }));
    else if (b.type === "picture")
      push(keepArrays({ type:"picture", id, title: b.title || "", url: b.url || "",
             caption: b.caption || "", note: b.note || "" }));
    else if (b.type === "pastelink")
      push(keepArrays({ type:"pastelink", id, heading: b.heading || "Paste your link",
             task: b.task || "", note: b.note || "" }));
    else if (b.type === "quiz")
      push({ type:"quiz", id, title: b.title || "",
        questions: (b.questions || (b.q !== undefined
          ? [{ q:b.q, options:b.options, answers:[b.answer || 0], hint:b.hint }] : [])).map(q => {
            const opts = (q.options || []);
            const answers = (q.answers !== undefined ? q.answers : [q.answer || 0])
              .map(Number).filter(x => !isNaN(x) && x >= 0 && x < opts.length);
            return { q: q.q || "", options: opts.filter(x => x !== ""),
                     answers: answers.length ? answers : [0], hint: q.hint || "" };
          }) });
    else if (b.type === "image")
      push(keepArrays({ type:"image", id, title: b.title || "", task: b.task || "" }));
    else if (b.type === "embed")
      push(keepArrays({ type:"embed", id, url: toEmbed(b.url), title: b.title || "",
             note: b.note || "", confirm: b.confirm === true }));
    else if (b.type === "frame")
      push(keepArrays({ type:"frame", id, url: b.url || "", heading: b.heading || "", task: b.task || "",
             width: b.width || "100%", height: b.height || 520, confirm: b.confirm === true }));
    else if (b.type === "link")
      push(keepArrays({ type:"link", id, url: b.url || "", title: b.title || "Open this",   // the button needs words
             heading: b.heading || "", task: b.task || "", confirm: b.confirm === true }));
    else if (b.type === "mc")
      push(keepArrays({ type:"mc", id, prompt: b.prompt || "", options: (b.options || []).filter(x => x !== ""),
        answer: Number(b.answer) || 0, topic: lesson.assessment ? b.topic : "" }));
    else if (b.type === "blanks")
      push(keepArrays({ type:"blanks", id, prompt: b.prompt || "", text: b.text || "",
        distractors: (b.distractors || "").split(/\s*,\s*/).filter(Boolean),
        topic: lesson.assessment ? b.topic : "" }));
    else if (b.type === "order")
      push(keepArrays({ type:"order", id, prompt: b.prompt || "",
        items: (b.items || []).filter(x => x !== ""), topic: lesson.assessment ? b.topic : "" }));
    else if (b.type === "short")
      push(keepArrays({ type:"short", id, prompt: b.prompt || "",
        keywords: (b.keywords || "").split(";").map(g => g.split(/\s*,\s*/).map(x => x.trim()).filter(Boolean)).filter(g => g.length),
        keywordLabels: (b.keywordLabels || "").split(";").map(x => x.trim()).filter(Boolean),
        model: b.model || "", topic: lesson.assessment ? b.topic : "" }));
  }
}

/* ---------------- drawing the cards ---------------- */
let dragFrom = null;
let openPage = 0;          // the page new tasks join
let lastAddedAt = -1;      // where the newest task landed, so we can scroll to it
let listWired = false;
function wireList(){
  if (listWired) return;
  listWired = true;
  const list = $("list");
  list.addEventListener("dragover", (e) => {
    if (!canDropOn(lesson.blocks)) return;

function openArray(){
  if (!respEditing) return null;
  return respEditing === "__ext" ? lesson.extensions : (lesson.responses[respEditing] || []);
}
function canDropOn(arr){
  const kind = newTask || (dragFrom && dragFrom.type);
  if (!kind) return false;
  /* a page only makes sense at the top of a lesson */
  if (kind === "page") return arr === lesson.blocks && !respEditing;
  /* While a response set is open it is the only place a task can go —
     otherwise the page behind it takes the drop instead. */
  if (respEditing) return arr === openArray();

/* put whatever is being dragged at position `at` in `arr` */
function dropInto(arr, at){
  /* Refusing must leave the drag alone: another list may still be about to
     accept it, and clearing here would take the task away from it. */
  if (!canDropOn(arr)) return;
  if (newTask){
    const made = BLANK[newTask]();
    newTask = null;
    arr.splice(at < 0 ? arr.length : at, 0, made);
    render(); schedulePreview();
    return;
  }
  if (!dragFrom) return;
  const from = dragFrom; dragFrom = null;
  const moved = from.arr[from.i];
  if (!moved) { render(); return; }
  if (from.arr === arr){
    let to = at < 0 ? arr.length - 1 : at;
    if (from.i === to){ render(); return; }
    from.arr.splice(from.i, 1);
    arr.splice(to, 0, moved);                 // it takes the place it was dropped on
  } else {
    from.arr.splice(from.i, 1);
    arr.splice(at < 0 ? arr.length : at, 0, moved);
  }
  render(); schedulePreview();
}

function move(arr, i, d){
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  const moved = arr.splice(i, 1)[0];

    F("Button label", "title");
    F("What to do there (optional)", "task", { area:true, rows:2 });

    listField("Options (tick the right one)", "options");

  }
  if (b.type === "blanks"){
    F("Instruction (optional)", "prompt");
    F("Sentence with gaps", "text", { area:true, rows:3,
      help:"Put the answers in double brackets: The [[cat]] sat on the [[mat]]." });
    F("Extra wrong words for the dropdowns", "distractors");
    if (lesson.assessment) F("Topic tag", "topic");
  }
  if (b.type === "order"){
    F("Instruction (optional)", "prompt");
    listField("Items in the CORRECT order", "items", "Students see them shuffled.");
    if (lesson.assessment) F("Topic tag", "topic");
  }
  if (b.type === "binary" || b.type === "binadd"){
    F("Heading (optional)", "title");
    F("Instruction (optional)", "task", { area:true, rows:2 });
    const w = el("div","bfield");
    w.appendChild(el("label","","How many bits"));
    const st = el("div","stepper");
    const less = el("button","btn-ghost iconbtn","\u2212");
    const num = el("input"); num.type = "number"; num.className = "stepnum"; num.value = String(b.bits || 8);
    const more = el("button","btn-ghost iconbtn","+");
    const setB = (v) => { b.bits = Math.max(4, Math.min(16, v)); num.value = String(b.bits); saveDraft(); schedulePreview(); };
    less.addEventListener("click", () => setB((parseInt(num.value, 10) || 8) - 1));
    more.addEventListener("click", () => setB((parseInt(num.value, 10) || 8) + 1));
    num.addEventListener("input", () => { b.bits = Math.max(4, Math.min(16, parseInt(num.value, 10) || 8)); saveDraft(); });
    st.appendChild(less); st.appendChild(num); st.appendChild(more);
    w.appendChild(st);
    body.appendChild(w);
    F("How many questions", "count", { num:true });
    if (b.type === "binary"){
      const mw = el("div","bfield");
      mw.appendChild(el("label","","Which way round"));
      const row = el("div","brow");
      [["toDenary","Binary to denary"],["toBinary","Denary to binary"],["either","A mixture"]].forEach(pair => {
        const btn = el("button","btn-ghost bmini2" + (b.mode === pair[0] ? " right" : ""), pair[1]);
        btn.addEventListener("click", () => { b.mode = pair[0]; render(); schedulePreview(); });
        row.appendChild(btn);
      });
      mw.appendChild(row); body.appendChild(mw);
      F("Set numbers (optional)", "numbers", { help:"Separate with commas, e.g. 13, 200. Left empty, numbers are made up each time." });
      toggleRow([["showPlace","Place values", true]]);
    } else {
      F("Set sums (optional)", "pairs", { help:"One per line, e.g. 10 + 5. Left empty, sums are made up each time." });
      toggleRow([["showPlace","Place values", true], ["showCarry","Row for carrying", true]]);
    }
  }
  if (b.type === "short"){
    F("Question", "prompt", { area:true, rows:2 });
    F("Keywords", "keywords", { help:"Groups separated by ; and alternatives by , — e.g. loop, repeat; count" });
    F("What each group means", "keywordLabels", { help:"One phrase per group, separated by ; — students see these when they check their answer." });
    F("Model answer", "model", { area:true, rows:2 });
    if (lesson.assessment) F("Topic tag", "topic");
  }
  c.appendChild(body);
  return c;
}

  $("modeAssess").classList.toggle("on", assess);

function rubricPopup(){
  if (!lesson.rubric) lesson.rubric = [];
  openModal(box => {
    box.classList.add("wide");
    box.appendChild(el("h2","","Rubric"));
    box.appendChild(el("p","modal-text","Put the best grade first. Teachers pick one of these when marking."));
    const list = el("div");
    box.appendChild(list);
    function paint(){
      list.innerHTML = "";
      if (!lesson.rubric.length) list.appendChild(el("p","hint","No grades yet \u2014 press \u201c+ New grade\u201d."));
      lesson.rubric.forEach((g, i) => {
        const card = el("div","qsub");
        const head = el("div","qsub-head");
        const nameIn = el("input"); nameIn.value = g.name || "";
        nameIn.className = "gradename";
        nameIn.addEventListener("input", () => { g.name = nameIn.value; saveDraft(); });
        head.appendChild(nameIn);
        const tools = el("span","btools");
        const move = (d) => () => {
          const j = i + d;
          if (j < 0 || j >= lesson.rubric.length) return;
          lesson.rubric.splice(j, 0, lesson.rubric.splice(i, 1)[0]);
          saveDraft(); paint();
        };
        [["\u2191","Move up", move(-1)],
         ["\u2193","Move down", move(1)],
         ["\u29C9","Duplicate", () => {
            lesson.rubric.splice(i + 1, 0, JSON.parse(JSON.stringify(g)));
            saveDraft(); paint();
          }],
         ["\u2715","Remove", () => { lesson.rubric.splice(i, 1); saveDraft(); paint(); }]
        ].forEach(t => {
          const b = el("button","btn-ghost bmini", t[0]);
          b.title = t[1];
          b.addEventListener("click", t[2]);
          tools.appendChild(b);
        });
        head.appendChild(tools);
        card.appendChild(head);
        const d = el("div","bfield");
        d.appendChild(el("label","","What is needed for this grade"));
        const desc = el("textarea"); desc.rows = 2; desc.value = g.description || "";
        desc.addEventListener("input", () => { g.description = desc.value; saveDraft(); });
        d.appendChild(desc);
        card.appendChild(d);
        list.appendChild(card);
      });
    }
    paint();
    const add = el("button","btn-ghost bmini2","+ New grade");
    add.addEventListener("click", () => { lesson.rubric.push({ name:"", description:"" }); saveDraft(); paint(); });
    box.appendChild(add);
    const done = el("button","btn-primary modal-cta","Done");
    done.addEventListener("click", () => { closeModal(); render(); schedulePreview(); });
    box.appendChild(done);
  });
}

  addBtn.addEventListener("click", () => {

        w.appendChild(inp); body.appendChild(w);

function taskRows(into, arr, topic){
  arr.forEach((task, i) => {
    const row = el("button","ov-row");
    row.appendChild(el("span","t", LABEL[task.type] || task.type));
    row.appendChild(el("span","p", stripTags(task.prompt || task.title || task.heading || task.q || "")));
    row.addEventListener("click", () => { closeModal(); editResponses(topic, i); });
    const move = (d) => (e) => {
      e.stopPropagation();
      const j = i + d;
      if (j < 0 || j >= arr.length) return;
      arr.splice(j, 0, arr.splice(i, 1)[0]);
      saveDraft(); schedulePreview(); render();
    };
    const up = el("button","btn-ghost bmini","\u2191");
    up.addEventListener("click", move(-1));
    const down = el("button","btn-ghost bmini","\u2193");
    down.addEventListener("click", move(1));
    const rm = el("button","btn-ghost bmini","\u2715");
    rm.addEventListener("click", (e) => {
      e.stopPropagation();
      arr.splice(i, 1);
      saveDraft(); schedulePreview(); render();
    });
    row.appendChild(up); row.appendChild(down); row.appendChild(rm);
    into.appendChild(row);
  });
}

/* Sections start folded away, so the list stays short. Which ones are open
   is remembered between visits. */
function wirePalette(){
  let open2 = {};
  try{ open2 = JSON.parse(localStorage.getItem("hub_pal") || "{}"); }catch(e){}
  document.querySelectorAll(".palgroup").forEach(g => {
    const head = g.querySelector(".pal-head");
    const body = g.querySelector(".palbody");
    if (!head || !body) return;
    const key = g.dataset.group;
    const show = (on) => {
      body.hidden = !on;
      head.classList.toggle("open", on);
      open2[key] = on;
      try{ localStorage.setItem("hub_pal", JSON.stringify(open2)); }catch(e){}
    };
    body.hidden = !open2[key];
    head.classList.toggle("open", !!open2[key]);
    head.addEventListener("click", () => show(body.hidden));
  });
}

document.querySelectorAll(".pal[data-add]").forEach(btn => {
  btn.draggable = true;
  btn.addEventListener("dragstart", (e) => {
    newTask = btn.dataset.add;
    dragFrom = null;
    btn.classList.add("dragging");
    if (e.dataTransfer){ e.dataTransfer.effectAllowed = "copy"; e.dataTransfer.setData("text/plain", newTask); }
  });
  btn.addEventListener("dragend", () => { btn.classList.remove("dragging"); newTask = null; });
  btn.addEventListener("click", () => {
    const kind = btn.dataset.add;
    if (respEditing){                     // a response or extension set is open
      const arr = respEditing === "__ext" ? lesson.extensions : lesson.responses[respEditing];
      arr.push(BLANK[kind]());
      lastAddedAt = arr.length - 1;
      render(); schedulePreview();
      return;
    }
    if (kind === "page" || lesson.assessment){
      lesson.blocks.push(BLANK[kind]());
      lastAddedAt = lesson.blocks.length - 1;
    } else {
      /* Lessons are made of pages, so a task always goes on one. It joins the
         page you last touched, or a new page if there isn't one yet. */
      let page = lesson.blocks[openPage] && lesson.blocks[openPage].type === "page"
        ? lesson.blocks[openPage] : null;
      if (!page){
        for (let i = lesson.blocks.length - 1; i >= 0; i--){
          if (lesson.blocks[i].type === "page"){ page = lesson.blocks[i]; openPage = i; break; }
        }
      }
      if (!page){
        page = BLANK.page();
        page.title = "New page";
        lesson.blocks.push(page);
        openPage = lesson.blocks.length - 1;
      }
      page.blocks.push(BLANK[kind]());
      lastAddedAt = -1;                  // it is inside a page, so the page is the target
    }
    render(); schedulePreview();
    /* go to the task that was just added, wherever it landed */
    const cards = $("list").querySelectorAll(".bcard");
    const target = (lastAddedAt >= 0 && cards[lastAddedAt]) ? cards[lastAddedAt] : cards[cards.length - 1];
    if (target && target.scrollIntoView) target.scrollIntoView({ behavior:"smooth", block:"center" });
    if (target && target.classList){
      target.classList.add("justopened");
      setTimeout(() => target.classList.remove("justopened"), 1600);
    }
  });
});

    catch(e){ say("Could not create it", e.message); }
    await loadUnitsAndYears();
    lesson.unit = name;
  } else {
    lesson.unit = v;
  }
  paintPickers(); saveDraft();
});

/* a small prompt that returns what was typed */
function askNew(title, label){
  return new Promise(resolve => {
    openModal(box => {
      box.appendChild(el("h2","", title));
      const w = el("div","bfield");
      w.appendChild(el("label","", label));
      const inp = el("input"); w.appendChild(inp); box.appendChild(w);
      const go = el("button","btn-primary modal-cta","Create");
      go.addEventListener("click", () => { const v = inp.value.trim(); closeModal(); resolve(v || null); });
      const no = el("button","btn-ghost modal-stay","Cancel");
      no.addEventListener("click", () => { closeModal(); resolve(null); });
      box.appendChild(go); box.appendChild(no);
    });
  });
}
async function catPost(payload){
  const API = (window.HUB && window.HUB.API) || "";
  const r = await fetch(API + "/api/catalog", { method:"POST",
    headers:{ "Content-Type":"application/json", "x-teacher-key": teacherKey() },
    body: JSON.stringify(payload) });
  if (!r.ok) throw new Error((await r.json()).error || "Could not save.");
}

let cat = { units: [], years: [] };
function paintPickers(){
  const ys = $("lYear"), us = $("lUnit");
  const years = (cat.years || []).map(y => y.name);
  (cat.units || []).forEach(u => { if (u.year && years.indexOf(u.year) < 0) years.push(u.year); });
  ys.innerHTML = "";
  const y0 = document.createElement("option");
  y0.value = ""; y0.textContent = "Year group…"; ys.appendChild(y0);
  years.forEach(y => {
    const o = document.createElement("option"); o.value = y; o.textContent = y;
    if (y === lesson.year) o.selected = true;
    ys.appendChild(o);
  });
  const yNew = document.createElement("option");
  yNew.value = "__new"; yNew.textContent = "+ New year group"; ys.appendChild(yNew);

  us.innerHTML = "";
  const u0 = document.createElement("option");
  u0.value = ""; u0.textContent = "Unit…"; us.appendChild(u0);
  (cat.units || []).filter(u => !lesson.year || (u.year || "") === lesson.year).forEach(u => {
    const o = document.createElement("option"); o.value = u.name; o.textContent = u.name;
    if (u.name === lesson.unit) o.selected = true;
    us.appendChild(o);
  });
  const uNew = document.createElement("option");
  uNew.value = "__new"; uNew.textContent = "+ New unit"; us.appendChild(uNew);
}

/* ---------------- live preview ---------------- */
let prevTimer = null;
let previewReset = true;      // a freshly opened lesson starts at its first page
function schedulePreview(){
  clearTimeout(prevTimer);
  $("prevMsg").textContent = "updating\u2026";
  prevTimer = setTimeout(refreshPreview, 900);
}
function refreshPreview(){
  try{
    if (previewReset){ try{ sessionStorage.removeItem("hub_preview_step"); }catch(e){} previewReset = false; }
    localStorage.setItem("hub_preview", JSON.stringify(compile()));
    $("prev").src = "lesson.html?id=__preview&builder=1&t=" + Date.now();
    $("prevMsg").textContent = "up to date";
  }catch(e){ $("prevMsg").textContent = e.message; }
}
on("prevBtn", "click", refreshPreview);
/* the same preview, with the room to see it properly */
on("prevFull", "click", () => {
  const back = el("div","modal-back");
  const box = el("div","modal wide fullprev");
  const x = el("button","btn-ghost iconbtn modal-x","\u2715");
  x.addEventListener("click", () => back.remove());
  box.appendChild(x);
  const frame = document.createElement("iframe");
  frame.className = "fullprev-frame";
  const live = document.getElementById("prevFrame") || document.querySelector(".build-preview iframe");
  frame.src = live ? live.src : "";
  box.appendChild(frame);
  back.appendChild(box);
  back.addEventListener("mousedown", (e) => { if (e.target === back) back.remove(); });
  document.body.appendChild(back);
});
on("moreBtn", "click", (e) => {
  e.stopPropagation();
  const m = $("moreMenu"), b = $("moreBtn");
  if (!m.hidden){ m.hidden = true; return; }
  const items = [["Save a copy", () => $("copyBtn").click()],
                 ["JSON", () => $("jsonBtn").click()],
                 ["Delete lesson", () => $("delLesson").click()]];
  if (window.openMenu) window.openMenu(b, m, "More", items);
  else m.hidden = false;
});
/* a tap on a menu item must not be swallowed by the closing of the menu */
document.addEventListener("pointerdown", (e) => {
  const m = $("moreMenu"), b = $("moreBtn");
  if (!m || m.hidden) return;
  if (e.target === b || (b.contains && b.contains(e.target))) return;
  if (m.contains && m.contains(e.target)) return;
  m.hidden = true;
});
on("copyBtn", "click", () => {
  $("moreMenu").hidden = true;
  openModal(box => {
    box.appendChild(el("h2","","Save a copy"));
    box.appendChild(el("p","modal-text","This saves everything here as a new lesson, leaving the original alone."));
    const w = el("div","bfield");
    w.appendChild(el("label","","Name for the copy"));
    const inp = el("input"); inp.value = (lesson.title || "Lesson") + " (copy)";
    w.appendChild(inp); box.appendChild(w);
    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta","Save the copy");
    go.addEventListener("click", async () => {
      const name = inp.value.trim();
      if (!name){ msg.textContent = "Give the copy a name."; return; }
      const was = lesson.title, wasId = lesson.savedAs;
      lesson.title = name; lesson.savedAs = null;
      msg.textContent = "Saving\u2026";
      try{
        await saveToSite();
        closeModal(); showTitle();
      }catch(e){
        lesson.title = was; lesson.savedAs = wasId;
        msg.textContent = e.message;
      }

});

/* ---------------- getting the file out ---------------- */
function fileName(){
  return (lesson.title || "lesson").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) + ".json";
}
function openModal(build){
  const box = $("mBox");
  box.innerHTML = "";
  build(box);
  /* a phone pop-up fills the screen, so there must always be a way out */
  if (!box.querySelector(".modal-x")){
    const x = el("button","btn-ghost iconbtn modal-x","\u2715");
    x.title = "Close";
    x.addEventListener("click", closeModal);
    box.insertBefore(x, box.firstChild);
  }
  $("mBack").hidden = false;
}
function closeModal(){ $("mBack").hidden = true; }
on("mBack", "mousedown", (e) => { if (e.target === $("mBack")) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

on("jsonBtn", "click", () => {
  $("moreMenu").hidden = true;
  openModal(box => {
    const x = el("button","btn-ghost iconbtn modal-x","\u2715");
    x.addEventListener("click", closeModal); box.appendChild(x);
    box.appendChild(el("h2","","Lesson file"));
    box.appendChild(el("p","hint","Save this as lessons/" + fileName() +
      ", add it to lessons/index.json, then publish it in the teacher console."));
    box.appendChild(el("pre","jsonbox", JSON.stringify(compile(), null, 2)));
    const save = el("button","btn-ghost modal-cta","Save as a file");
    save.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(compile(), null, 2)], { type:"application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = fileName(); a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
    box.appendChild(save);
    const copy = el("button","btn-primary modal-cta","Copy to clipboard");
    copy.addEventListener("click", async () => {
      try{ await navigator.clipboard.writeText(JSON.stringify(compile(), null, 2)); copy.textContent = "Copied \u2713"; }
      catch(e){ copy.textContent = "Select it and press Ctrl+C"; }
    });
    box.appendChild(copy);
  });
});
/* ---------- publishing straight to the site ----------
   The lesson goes into the school database through the teacher API, so there
   are no files to upload. It arrives as a draft; publishing to classes still
   happens in the teacher console. */
function teacherKey(){ return localStorage.getItem("hub_tkey") || ""; }
function askForKey(then){
  openModal(box => {
    box.appendChild(el("h2","","Teacher key"));
    box.appendChild(el("p","modal-text","Type the teacher key once and this browser will remember it."));
    const w = el("div","bfield");
    const inp = el("input"); inp.type = "password"; inp.autocomplete = "off";
    w.appendChild(inp); box.appendChild(w);
    const go = el("button","btn-primary modal-cta","Save key");
    go.addEventListener("click", () => {
      const v = inp.value.trim();
      if (!v) return;
      localStorage.setItem("hub_tkey", v);
      closeModal(); then();
    });
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    box.appendChild(go); box.appendChild(no);
  });
}
function lessonId(){
  /* A lesson keeps the name it was saved under. Renaming it changes the
     title, not which lesson it is — otherwise editing would quietly leave a
     copy of the old one behind, still sitting in whichever classes had it. */
  if (lesson.savedAs) return lesson.savedAs;
  return (lesson.title || "lesson").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50);
}
/* Save the lesson as a file for the lessons folder, with what to do next. */
function downloadForFolder(){
  if (!lesson.title.trim()){ say("Give it a title first", "The title becomes the lesson's name on the site."); return; }
  if (!lesson.year || !lesson.year.trim()){
    say("Which year group?", "Students pick their year when they open the site, and only see lessons for it.");
    return;
  }
  const id = (lessonId || lesson.title).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const built = compile();
  const blob = new Blob([JSON.stringify(built, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = id + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  dirty = false;
  openModal(box => {
    box.appendChild(el("h2","","Saved as " + id + ".json"));
    box.appendChild(el("p","modal-text","To put it on the site:"));
    const list = el("ol","modal-steps");
    [ "Put " + id + ".json into the lessons folder in GitHub.",
      "Open lessons/index.json and add this line inside the right unit:",
      "Commit. The lesson appears for students within a minute or so."
    ].forEach(t => list.appendChild(el("li","", t)));
    box.appendChild(list);
    const snippet = el("pre","codeblock");
    snippet.textContent = JSON.stringify({ id: id, title: lesson.title,
      description: lesson.intro || "",
      year: lesson.year || "",
      assessment: !!(lesson.assessment || lesson.practical) || undefined,
      homework: !!lesson.homework || undefined }, null, 2);
    box.appendChild(snippet);
    const copy = el("button","btn-ghost","Copy that line");
    copy.addEventListener("click", () => {
      try{ navigator.clipboard.writeText(snippet.textContent); copy.textContent = "Copied"; }catch(e){}
    });
    box.appendChild(copy);
    const done = el("button","btn-primary modal-cta","Done");
    done.addEventListener("click", closeModal);
    box.appendChild(done);
  });
}

async function saveToSite(){
  const API = (window.HUB && window.HUB.API) || "";
  /* Offline there is nowhere to save to, so the lesson is downloaded instead
     and dropped into the lessons folder on GitHub. */
  if (window.HUB && window.HUB.OFFLINE){ downloadForFolder(); return; }
  if (!API){ say("Not connected", "This copy of the site has no server address in config.js, so it can't save lessons."); return; }
  if (!lesson.title.trim()){ say("Give it a title first", "The title becomes the lesson's name on the site."); return; }
  if (!lesson.year || !lesson.year.trim()){ say("Which year group?", "Choose a year group at the top, or make a new one."); return; }
  if (!lesson.unit || !lesson.unit.trim()){ say("Which unit?", "Choose a unit at the top, or make a new one."); return; }
  if (!teacherKey()){ askForKey(saveToSite); return; }
  const btn = $("saveSite");
  btn.disabled = true; btn.textContent = "Saving\u2026";
  try{
    const r = await fetch(API + "/api/teacher/save-lesson", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-teacher-key": teacherKey() },
      body: JSON.stringify({ id: lessonId(), title: lesson.title, unit: lesson.unit,
                             year: lesson.year || "", owner: lesson.ownerGroup || "", data: compile() })
    });
    const d = await r.json();
    if (r.status === 403){ localStorage.removeItem("hub_tkey"); throw new Error("That teacher key was not accepted."); }
    if (!r.ok) throw new Error(d.error || "Could not save it.");
    lesson.savedAs = d.id;
    dirty = false;                       // saved, and nothing changed since
    say(d.published ? "Saved \u2014 it's live" : "Saved to the site",
        d.published
          ? "Students in classes that already have this lesson will see the new version straight away."
          : "It's in your teacher console under " + lesson.unit + ". Press Publish there when a class should see it.");
  }catch(e){ say("Could not save", e.message); }
  finally{ btn.disabled = false; btn.textContent = "Save to the site"; }
}
on("saveSite", "click", saveToSite);

/* deleting from here asks twice too — it is the same job as in the console */

on("delLesson", "click", () => {
  $("moreMenu").hidden = true;
  const API = (window.HUB && window.HUB.API) || "";
  const id = lesson.savedAs;
  if (!id) return;
  openModal(box => {
    box.appendChild(el("h2","","Delete \u201c" + (lesson.title || id) + "\u201d?"));
    box.appendChild(el("p","modal-text","It goes from the hub and from every class, together with all the work students have done on it."));
    const yes = el("button","btn-primary modal-cta","Continue");
    yes.style.background = "var(--red)";
    yes.addEventListener("click", () => {
      closeModal();
      openModal(box2 => {
        box2.appendChild(el("h2","","Really delete it?"));
        box2.appendChild(el("p","modal-text","This cannot be undone. Type DELETE to confirm."));
        const w = el("div","bfield");
        const inp = el("input"); w.appendChild(inp); box2.appendChild(w);
        const msg = el("p","hint","");
        const go = el("button","btn-primary modal-cta","Delete for ever");
        go.style.background = "var(--red)";
        go.addEventListener("click", async () => {
          if (inp.value.trim().toUpperCase() !== "DELETE"){ msg.textContent = "Type DELETE to confirm."; return; }
          msg.textContent = "Deleting\u2026";
          try{
            const r = await fetch(API + "/api/teacher/delete-lesson", { method:"POST",
              headers:{ "Content-Type":"application/json", "x-teacher-key": teacherKey() },
              body: JSON.stringify({ id }) });
            if (!r.ok) throw new Error((await r.json()).error || "Could not delete it.");
            closeModal();
            lesson = { title:"", intro:"", unit:"", assessment:false, topics:{}, blocks:[] };
            dirty = false;
            showTitle(); paintPickers();
            $("delLesson").hidden = true;
            render(); refreshPreview();
            say("Deleted", "The lesson has been removed from the site.");
          }catch(e){ msg.textContent = e.message; }
        });
        const no = el("button","btn-ghost modal-stay","Keep it");
        no.addEventListener("click", closeModal);
        box2.appendChild(go); box2.appendChild(no); box2.appendChild(msg);
      });
    });
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    box.appendChild(yes); box.appendChild(no);
  });
});

/* offer the units that already exist, and load a lesson if asked to edit one */
async function loadUnitsAndYears(){
  const API = (window.HUB && window.HUB.API) || "";
  if (!API) return;
  try{
    const r = await fetch(API + "/api/catalog", { headers: teacherKey() ? { "x-teacher-key": teacherKey() } : {}, cache:"no-store" });
    cat = await r.json();
  }catch(e){}
  paintPickers();
}
async function loadUnitsAndMaybeLesson(){
  const API = (window.HUB && window.HUB.API) || "";
  if (!API) return;
  await loadUnitsAndYears();
  const editId = new URLSearchParams(location.search).get("edit");
  const qs2 = new URLSearchParams(location.search);
  const wantYear = qs2.get("year"), wantUnit = qs2.get("unit"), wantClass = qs2.get("class");
  if (wantYear && !lesson.year) lesson.year = wantYear;
  if (wantUnit && !lesson.unit) lesson.unit = wantUnit;
  if (wantYear || wantUnit) paintPickers();
  if (wantClass){
    lesson.ownerGroup = wantClass; saveDraft();
    $("ownerNote").hidden = false;
    $("ownerNote").textContent = "This lesson is being made for " + wantClass + " only.";
  }
  if (!editId) return;
  if (!teacherKey()){ askForKey(loadUnitsAndMaybeLesson); return; }
  try{
    const r = await fetch(API + "/api/teacher/get-lesson?id=" + encodeURIComponent(editId),
                          { headers:{ "x-teacher-key": teacherKey() }, cache:"no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Could not open that lesson.");
    const data = JSON.parse(d.lesson.data);
    lesson = fromCompiled(data, d.lesson);
    lesson.savedAs = editId;
    migrate(lesson.blocks); tidyIntoPages();
    dirty = false;
    $("delLesson").hidden = false;
    
    showTitle(); 
    paintPickers();
    setMode(!!lesson.assessment && !lesson.practical, !!lesson.practical);
    render(); refreshPreview();
  }catch(e){ say("Could not open that lesson", e.message); }
}

/* turn a saved lesson file back into editable cards */
function fromCompiled(data, meta){
  const out = { title: data.title || (meta && meta.title) || "", intro: data.intro || "",
                unit: data.unit || (meta && meta.unit) || "", year: data.year || "",
                assessment: !!data.assessment && !data.practical, practical: !!data.practical,
                homework: !!data.homework,
                marking: data.marking || "score", outOf: data.outOf || 20, rubric: data.rubric || [],
                topics: data.topics || {}, responses: {}, extensions: [], blocks: [] };
  const back = (b) => {
    if (b.type === "page") return { type:"page", title:b.title || "", task:b.task || "", blocks:(b.blocks || []).map(back) };
    if (b.type === "text"){
      const h = /<h2[^>]*>([\s\S]*?)<\/h2>/i.exec(b.html || "");
      const body = String(b.html || "").replace(/<h2[\s\S]*?<\/h2>/i, "")
        .replace(/<li>/gi, "- ").replace(/<\/li>/gi, "\n")
        .replace(/<\/p>/gi, "\n\n").replace(/<br\s*\/?>/gi, "\n")
        .replace(/<[^>]+>/g, "").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").trim();
      return { type:"text", heading: h ? h[1].replace(/<[^>]+>/g,"") : "", body };
    }
    if (b.type === "quiz") return { type:"quiz", questions:(b.questions || []).map(q => ({
      q:q.q || "", options:q.options || ["",""], answer:q.answer || 0, hint:q.hint || "" })) };
    if (b.type === "short") return { type:"short", prompt:b.prompt || "",
      keywords:(b.keywords || []).map(g => g.join(", ")).join("; "), model:b.model || "", topic:b.topic || "" };
    if (b.type === "blanks") return { type:"blanks", prompt:b.prompt || "", text:b.text || "",
      distractors:(b.distractors || []).join(", "), topic:b.topic || "" };
    const copy = JSON.parse(JSON.stringify(b));
    delete copy.id;
    return copy;
  };
  out.blocks = (data.blocks || []).map(back);
  Object.keys(data.responses || {}).forEach(topic => {
    out.responses[topic] = (data.responses[topic] || []).map(back);
  });
  out.extensions = (data.extensions || []).map(back);
  return out;
}


/* ---------------- go ---------------- */
loadDraft();
if (!lesson.topics) lesson.topics = {};


paintPickers();
setMode(!!lesson.assessment && !lesson.practical, !!lesson.practical);
loadUnitsAndMaybeLesson();
render();
refreshPreview();
if (window.initSettings) initSettings($("setBtn"));
