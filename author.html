/* ---------------- live preview ---------------- */
let prevTimer = null;
let previewReset = true;      // a freshly opened lesson starts at its first page
function schedulePreview(){
  clearTimeout(prevTimer);
  $("prevMsg").textContent = "updating\u2026";
  prevTimer = setTimeout(refreshPreview, 900);
}
/* The preview in its own tab, at the size a student would really see it. It
   reads the compiled lesson out of localStorage exactly as the panel does, so
   the only thing to be careful about is writing that first: opening the tab
   before compiling would show whatever was there from last time. */
on("prevPop", "click", () => {
  try{
    localStorage.setItem("hub_preview", JSON.stringify(compile()));
    window.open("lesson.html?id=__preview&builder=1&t=" + Date.now(), "_blank", "noopener");
  }catch(e){ $("prevMsg").textContent = e.message; }
});

function refreshPreview(){
  try{
    if (previewReset){ try{ sessionStorage.removeItem("hub_preview_step"); }catch(e){} previewReset = false; }
    localStorage.setItem("hub_preview", JSON.stringify(compile()));
    const frame = $("prev");
    /* Where the preview had been scrolled to. It is reloaded from scratch on
       every change, so without this a teacher editing the foot of a long page
       was thrown back to the top of it after each keystroke. */
    const keep = previewScroll(frame);
    frame.src = "lesson.html?id=__preview&builder=1&t=" + Date.now();
    frame.addEventListener("load", function once(){
      frame.removeEventListener("load", once);
      /* The lesson draws itself after load, so the place to scroll to does not
         exist yet on the first go. Trying again shortly after catches it. */
      putPreviewScroll(frame, keep);
      setTimeout(() => putPreviewScroll(frame, keep), 120);
      setTimeout(() => putPreviewScroll(frame, keep), 400);
    });
    $("prevMsg").textContent = "up to date";
  }catch(e){ $("prevMsg").textContent = e.message; }
}

/* The lesson scrolls inside .stage on a wide screen and scrolls the page
   itself on a narrow one, so both are worth remembering. */
function previewScroll(frame){
  try{
    const d = frame.contentDocument;
    if (!d) return null;
    const stage = d.querySelector(".stage");
    return { stage: stage ? stage.scrollTop : 0,
             page: frame.contentWindow ? frame.contentWindow.scrollY : 0 };
  }catch(e){ return null; }         // a preview from another origin cannot be read
}
function putPreviewScroll(frame, keep){
  if (!keep || (!keep.stage && !keep.page)) return;
  try{
    const d = frame.contentDocument;
    if (!d) return;
    const stage = d.querySelector(".stage");
    if (stage && keep.stage) stage.scrollTop = keep.stage;
    if (keep.page && frame.contentWindow) frame.contentWindow.scrollTo(0, keep.page);
  }catch(e){}
}

function fileName(){

}
/* Puts everything except the cross and the final buttons into a part that
   scrolls on its own. */
function scrollBody(box){
  if (box.querySelector(".modal-scroll")) return;
  const kids = Array.from(box.children);
  const middle = kids.filter(n =>
    !n.classList.contains("modal-x") &&
    !n.classList.contains("modal-cta") &&
    !n.classList.contains("modal-stay"));
  if (middle.length < 2) return;
  const scroller = el("div","modal-scroll");
  const first = middle[0];
  box.insertBefore(scroller, first);
  middle.forEach(n => scroller.appendChild(n));
}

function openModal(build){
  const box = $("mBox");
  box.innerHTML = "";
  build(box);
  /* a phone pop-up fills the screen, so there must always be a way out */
  if (!box.querySelector(".modal-x")){
    const x = el("button","btn-ghost iconbtn modal-x","\u2715");
    x.title = "Close";
    x.addEventListener("click", closeModal);
    box.insertBefore(x, box.firstChild);
  }
  /* Everything between the cross and the closing button scrolls, so a long
     pop-up never pushes its own buttons off the screen. */
  scrollBody(box);
  $("mBack").hidden = false;
}

function lessonId(){
  /* A lesson keeps the name it was saved under. Renaming it changes the
     title, not which lesson it is, otherwise editing would quietly leave a
     copy of the old one behind, still sitting in whichever classes had it. */
  if (lesson.savedAs) return lesson.savedAs;
  return (lesson.title || "lesson").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50);
}
/* Save the lesson as a file for the lessons folder, with what to do next.
   Two things go into GitHub: the lesson file itself, and a line in
   lessons/index.json that files it under a year and unit and gives it the
   four digit code students type when a link has not reached them. */
async function downloadForFolder(){
  if (!lesson.title.trim()){ say("Give it a title first", "The title becomes the lesson's name on the site."); return; }
  if (!lesson.year || !lesson.year.trim()){
    say("Which year group?", "The hub files lessons by year, so every lesson needs one.");
    return;
  }
  if (!lesson.unit || !lesson.unit.trim()){
    say("Which unit?", "Choose a unit at the top, or make a new one. Units sit inside a year group.");
    return;
  }
  /* A locked page with no passcode can never be opened by anybody, so the
     lesson would be unteachable past that point. */
  const missing = pagesMissingPasscode();
  if (missing.length){
    say(missing.length === 1 ? "Page " + missing[0] + " has no passcode"
                             : "Some pages have no passcode",
        (missing.length === 1
          ? "Page " + missing[0] + " is locked"
          : "Pages " + missing.join(", ") + " are locked") +
        ", and a locked page can only be opened by typing its passcode. " +
        "Press the red pill beside the padlock to set one.");
    return;
  }
  const id = lessonId();
  /* An existing lesson keeps the code it was given: it is on a worksheet,
     in somebody's planner, and written on the board. Only a new one gets
     a fresh one, chosen so nothing else in the folder is using it. */
  let code = lesson.code || "";
  let known = { lessons: [] };
  try{ known = await window.lessonFile.load(true); }catch(e){}
  if (!code) code = window.lessonFile.codeFor(known, id) || window.lessonFile.newCode(known);
  lesson.code = code;

  const built = compile();
  const blob = new Blob([JSON.stringify(built, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = id + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  dirty = false;

  const listed = (known.lessons || []).some(l => l.id === id);
  const unitExists = (known.units || []).some(u => u.name === lesson.unit && (u.year || "") === lesson.year);
  /* The lesson's line on its own is no use if there is no unit for it to sit
     in, so a brand new unit comes out whole, ready to drop in beside the
     others. */
  const entry = Object.assign(
    { id: id, title: lesson.title, description: lesson.intro || "" },
    (lesson.assessment || lesson.practical) ? { assessment: true } : {},
    lesson.homework ? { homework: true } : {},
    { code: code });
  const paste = unitExists ? entry
    : { name: lesson.unit, year: lesson.year, lessons: [entry] };

  openModal(box => {
    box.appendChild(el("h2","","Saved as " + id + ".json"));
    box.appendChild(el("p","modal-text", listed
      ? "It is already listed in lessons/index.json, so there is one thing left to do:"
      : "To put it on the site:"));
    const list = el("ol","modal-steps");
    const steps = ["Put " + id + ".json into the lessons folder in GitHub, replacing the old one if it is there."];
    if (!listed){
      steps.push(unitExists
        ? "Open lessons/index.json and add this to the lessons of “" + lesson.unit + "”:"
        : "Open lessons/index.json. There is no “" + lesson.unit + "” yet, so add this whole unit to the list:");
    }
    steps.push("Commit. The lesson is on the site within a minute or so.");
    steps.forEach(t => list.appendChild(el("li","", t)));
    box.appendChild(list);

    if (!listed){
      const snippet = el("pre","codeblock");
      snippet.textContent = JSON.stringify(paste, null, 2);
      box.appendChild(snippet);
      const copy = el("button","btn-ghost","Copy that");
      copy.addEventListener("click", async () => {
        try{ await navigator.clipboard.writeText(snippet.textContent); copy.textContent = "Copied ✓"; }
        catch(e){ copy.textContent = "Select it and press Ctrl+C"; }
      });
      box.appendChild(copy);
    }

    box.appendChild(el("p","set-label","How the class gets in"));
    box.appendChild(el("p","modal-text","Give them this link:"));
    box.appendChild(el("pre","codeblock", window.lessonFile.linkFor(id)));
    box.appendChild(el("p","modal-text","Or, from the front page, this code:"));
    box.appendChild(el("p","sharecode", code));

    /* Only the hashes go into the file, so this is the last chance to write
       the passcodes down. */
    const gates = [];
    lesson.blocks.forEach((blk, i) => {
      if (blk.type === "page" && i > 0 && blk.startLocked !== false && blk.passCode)
        gates.push("Page " + (i + 1) + ": " + blk.passCode);
    });
    if (gates.length){
      box.appendChild(el("p","set-label","Passcodes for the locked pages"));
      box.appendChild(el("p","modal-text","Write these down, they are not stored in the lesson file."));
      box.appendChild(el("pre","codeblock", gates.join("\n")));
    }

    const done = el("button","btn-primary modal-cta","Done");
    done.addEventListener("click", closeModal);
    box.appendChild(done);
  });
}

async function saveToSite(){
  const API = (window.HUB && window.HUB.API) || "";
  /* Offline there is nowhere to save to, so the lesson is downloaded instead
     and dropped into the lessons folder on GitHub. */
  if (OFFLINE){ await downloadForFolder(); return; }
  if (!API){ say("Not connected", "This copy of the site has no server address in config.js, so it can't save lessons."); return; }
  if (!lesson.title.trim()){ say("Give it a title first", "The title becomes the lesson's name on the site."); return; }
  if (!lesson.year || !lesson.year.trim()){ say("Which year group?", "Choose a year group at the top, or make a new one."); return; }
  if (!lesson.unit || !lesson.unit.trim()){ say("Which unit?", "Choose a unit at the top, or make a new one."); return; }
  if (!teacherKey()){ askForKey(saveToSite); return; }
  const btn = $("saveSite");
  btn.disabled = true; btn.textContent = "Saving\u2026";
  try{
    const r = await fetch(API + "/api/teacher/save-lesson", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-teacher-key": teacherKey() },
      body: JSON.stringify({ id: lessonId(), title: lesson.title, unit: lesson.unit,
                             year: lesson.year || "", owner: lesson.ownerGroup || "", data: compile() })
    });
    const d = await r.json();
    if (r.status === 403){ localStorage.removeItem("hub_tkey"); throw new Error("That teacher key was not accepted."); }
    if (!r.ok) throw new Error(d.error || "Could not save it.");
    lesson.savedAs = d.id;
    dirty = false;                       // saved, and nothing changed since
    say(d.published ? "Saved, it's live" : "Saved to the site",
        d.published
          ? "Students in classes that already have this lesson will see the new version straight away."
          : "It's in your teacher console under " + lesson.unit + ". Press Publish there when a class should see it.");
  }catch(e){ say("Could not save", e.message); }
  finally{ btn.disabled = false; btn.textContent = "Save to the site"; }
}
on("saveSite", "click", () => {
  /* On a narrow screen the title, year and unit are not on the page, so
     Save is where they get asked for. */
  if (isCompact()) savePopup(); else saveToSite();
});

/* deleting from here asks twice too, it is the same job as in the console */

on("delLesson", "click", () => {
  $("moreMenu").hidden = true;
  const API = (window.HUB && window.HUB.API) || "";
  const id = lesson.savedAs;
  if (!id) return;
  openModal(box => {
    box.appendChild(el("h2","","Delete \u201c" + (lesson.title || id) + "\u201d?"));
    box.appendChild(el("p","modal-text","It goes from the hub and from every class, together with all the work students have done on it."));
    const yes = el("button","btn-primary modal-cta","Continue");
    yes.style.background = "var(--red)";
    yes.addEventListener("click", () => {
      closeModal();
      openModal(popup => {
        popup.appendChild(el("h2","","Really delete it?"));
        popup.appendChild(el("p","modal-text","This cannot be undone. Type DELETE to confirm."));
        const w = el("div","bfield");
        const inp = el("input"); w.appendChild(inp); popup.appendChild(w);
        const msg = el("p","hint","");
        const go = el("button","btn-primary modal-cta","Delete for ever");
        go.style.background = "var(--red)";
        go.addEventListener("click", async () => {
          if (inp.value.trim().toUpperCase() !== "DELETE"){ msg.textContent = "Type DELETE to confirm."; return; }
          msg.textContent = "Deleting\u2026";
          try{
            const r = await fetch(API + "/api/teacher/delete-lesson", { method:"POST",
              headers:{ "Content-Type":"application/json", "x-teacher-key": teacherKey() },
              body: JSON.stringify({ id }) });
            if (!r.ok) throw new Error((await r.json()).error || "Could not delete it.");
            closeModal();
            lesson = { title:"", intro:"", unit:"", assessment:false, topics:{}, blocks:[] };
            dirty = false;
            showTitle(); paintPickers();
            $("delLesson").hidden = true;
            render(); refreshPreview();
            say("Deleted", "The lesson has been removed from the site.");
          }catch(e){ msg.textContent = e.message; }
        });
        const no = el("button","btn-ghost modal-stay","Keep it");
        no.addEventListener("click", closeModal);
        popup.appendChild(go); popup.appendChild(no); popup.appendChild(msg);
      });
    });
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    box.appendChild(yes); box.appendChild(no);
  });
});

/* offer the units that already exist, and load a lesson if asked to edit one */
async function loadUnitsAndYears(){
  const API = (window.HUB && window.HUB.API) || "";
  /* Without a server the years and units on offer are simply the ones
     already written into lessons/index.json. */
  if (OFFLINE){
    try{
      const file = await window.lessonFile.load(true);
      const years = [];
      file.units.forEach(u => { if (u.year && years.indexOf(u.year) < 0) years.push(u.year); });
      file.lessons.forEach(l => { if (l.year && years.indexOf(l.year) < 0) years.push(l.year); });
      cat = { years: years.map(name => ({ name })), units: file.units.filter(u => u.name) };
    }catch(e){ cat = { years: [], units: [] }; }
    paintPickers();
    return;
  }
  if (!API) return;
  try{
    const r = await fetch(API + "/api/catalog", { headers: teacherKey() ? { "x-teacher-key": teacherKey() } : {}, cache:"no-store" });
    cat = await r.json();
  }catch(e){}
  paintPickers();
}

/* Editing without a server means reading the lesson's own file back out of
   the lessons folder. It carries its title, year and unit, so the only
   thing that has to come from the index is the code, which lives there. */
async function loadLessonFromFolder(editId){
  try{
    const r = await fetch("lessons/" + encodeURIComponent(editId) + ".json", { cache:"no-store" });
    if (!r.ok) throw new Error("There is no lessons/" + editId + ".json.");
    const data = await r.json();
    let known = {};
    try{
      const file = await window.lessonFile.load();
      known = file.lessons.find(l => l.id === editId) || {};
    }catch(e){}
    lesson = fromCompiled(data, { title: known.title, unit: known.unit });
    if (!lesson.year && known.year) lesson.year = known.year;
    lesson.savedAs = editId;
    lesson.code = known.code || "";
    migrate(lesson.blocks); tidyIntoPages();
    dirty = false;
    showTitle();
    paintPickers();
    setMode(!!lesson.assessment && !lesson.practical, !!lesson.practical);
    render(); refreshPreview();
  }catch(e){ say("Could not open that lesson", e.message); }
}

async function loadUnitsAndMaybeLesson(){
  const API = (window.HUB && window.HUB.API) || "";
  if (!API && !OFFLINE) return;
  await loadUnitsAndYears();
  const editId = new URLSearchParams(location.search).get("edit");
  const qs2 = new URLSearchParams(location.search);
  const wantYear = qs2.get("year"), wantUnit = qs2.get("unit"), wantClass = qs2.get("class");
  if (wantYear && !lesson.year) lesson.year = wantYear;
  if (wantUnit && !lesson.unit) lesson.unit = wantUnit;
  if (wantYear || wantUnit) paintPickers();
  if (wantClass){
    lesson.ownerGroup = wantClass; saveDraft();
    $("ownerNote").hidden = false;
    $("ownerNote").textContent = "This lesson is being made for " + wantClass + " only.";
  }
  if (!editId) return;
  if (OFFLINE){ await loadLessonFromFolder(editId); return; }
  if (!teacherKey()){ askForKey(loadUnitsAndMaybeLesson); return; }
  try{
    const r = await fetch(API + "/api/teacher/get-lesson?id=" + encodeURIComponent(editId),
                          { headers:{ "x-teacher-key": teacherKey() }, cache:"no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Could not open that lesson.");
    const data = JSON.parse(d.lesson.data);
    lesson = fromCompiled(data, d.lesson);
    lesson.savedAs = editId;
    migrate(lesson.blocks); tidyIntoPages();
    dirty = false;
    $("delLesson").hidden = false;
    
    showTitle(); 
    paintPickers();
    setMode(!!lesson.assessment && !lesson.practical, !!lesson.practical);
    render(); refreshPreview();
  }catch(e){ say("Could not open that lesson", e.message); }
}

/* turn a saved lesson file back into editable cards */
function fromCompiled(data, meta){
  const out = { title: data.title || (meta && meta.title) || "", intro: data.intro || "",
                unit: data.unit || (meta && meta.unit) || "", year: data.year || "",
                assessment: !!data.assessment && !data.practical, practical: !!data.practical,
                homework: !!data.homework,
                marking: data.marking || "score", outOf: data.outOf || 20, rubric: data.rubric || [],
                topics: data.topics || {}, responses: {}, extensions: [], blocks: [] };
  const back = (b) => {
    /* startLocked and passHash used to be dropped here, so reopening a lesson
       quietly unlocked every page in it. */
    if (b.type === "page") return { type:"page", title:b.title || "", task:b.task || "",
                                    startLocked: b.startLocked !== false,
                                    passHash: b.passHash || undefined,
                                    blocks:(b.blocks || []).map(back) };
    if (b.type === "extension") return { type:"extension", title:b.title || "",
                                         task:b.task || "",
                                         blocks:(b.blocks || []).map(back) };
    if (b.type === "choice") return { type:"choice", title:b.title || "", task:b.task || "",
                                      prompt:b.prompt || "",
                                      options:(b.options || []).map(o => ({
                                        label:o.label || "",
                                        blocks:(o.blocks || []).map(back) })) };
    if (b.type === "text"){
      const h = /<h2[^>]*>([\s\S]*?)<\/h2>/i.exec(b.html || "");
      /* The HTML is kept exactly as it was saved.

         This used to flatten it to plain text for the textarea the paragraph
         editor once used: list items became a literal "- ", every closing
         paragraph became a blank line, and every other tag was thrown away.
         The editor has been a formatting box for a while now, so reopening a
         lesson was quietly destroying its bold, colours, sizes, keys and code,
         turning bullets into dashes and leaving a gap between every line where
         those blank lines had been. */
      return { type:"text",
               heading: b.heading !== undefined ? b.heading
                      : (h ? h[1].replace(/<[^>]+>/g,"") : ""),
               html: String(b.html || "").replace(/<h2[\s\S]*?<\/h2>/i, "") };
    }
    if (b.type === "quiz") return { type:"quiz",
      title: b.title || "",
      pass: b.pass ? { mode: b.pass.mode || "percent", value: b.pass.value || 70 }
                   : { mode:"none", value:70 },
      questions:(b.questions || []).map(q => ({
        q:q.q || "", options:q.options || ["",""],
        answers: q.answers !== undefined ? q.answers.slice() : [q.answer || 0],
        answer:q.answer || 0, hint:q.hint || "", why:q.why || "" })) };
    if (b.type === "short") return { type:"short", prompt:b.prompt || "",
      keywords:(b.keywords || []).map(g => g.join(", ")).join("; "), model:b.model || "", topic:b.topic || "" };
    if (b.type === "blanks") return { type:"blanks", prompt:b.prompt || "", text:b.text || "",
      distractors:(b.distractors || []).join(", "), topic:b.topic || "" };
    /* A saved cipher holds only the coded text and a hash, never the message.
       Trying all 25 shifts and hashing each one finds the shift the teacher
       used, and with it the message, so it can be edited like anything else.
       If nothing matches (a hand-written lesson file), the fields are left
       empty rather than filled with a wrong guess. */
    if (b.type === "caesar"){
      let message = "", shift = 7;
      for (let k = 1; k <= 25; k++){
        const tryText = caesarEncode(b.ciphertext || "", -k);
        if (strHash(normLetters(tryText)) === b.answerHash){ message = tryText; shift = k; break; }
      }
      return { type:"caesar", title:b.title || "", task:b.task || "",
               prompt:b.prompt || "", message: message, shift: shift };
    }
    const copy = JSON.parse(JSON.stringify(b));
    delete copy.id;
    return copy;
  };
  out.blocks = (data.blocks || []).map(back);
  Object.keys(data.responses || {}).forEach(topic => {
    out.responses[topic] = (data.responses[topic] || []).map(back);
  });
  out.extensions = (data.extensions || []).map(back);
  return out;
}


/* =====================================================================
   THE BUILDER ON A TABLET OR A PHONE

   The three columns of the desktop builder do not survive being squeezed:
   a palette, a list of cards and a live preview side by side leave nothing
   wide enough to write in. Below a laptop width the same pieces are put
   back together as one column instead.

     - the kind of work moves into the top bar as a chip with a pencil
     - the title, description, year and unit move into the Save pop-up
     - Save and the three dot menu move up beside the settings cog
     - the palette goes entirely: tasks are added from the containers
       under each page, which is where a teacher is already looking
     - one row underneath holds New page, the assessment tabs, and the
       preview switch

   Nothing here is duplicated. The same elements are moved about, so there
   is only ever one Save button and one year picker to keep in step.
   ===================================================================== */
/* A browser without matchMedia gets the wide builder and nothing breaks;
   the checking scripts run the page without one too. */
function mq(query){
  if (typeof window.matchMedia === "function") return window.matchMedia(query);
  return { matches:false, addEventListener(){}, addListener(){} };
}
/* Made when first asked for, not when this line is reached: render() runs
   from setMode() during start-up and asks whether the page is narrow before
   the bottom of the file has been read. */
let COMPACT_Q = null, ROOMY_Q = null;
function compactQ(){ return COMPACT_Q || (COMPACT_Q = mq("(max-width: 1100px)")); }
/* Room enough to keep a preview on screen while still writing: an iPad Pro
   in either direction, but not a phone. */
function roomyQ(){ return ROOMY_Q || (ROOMY_Q = mq("(min-width: 700px) and (min-height: 820px)")); }

let compactOn = null;          // null until the first pass, then true or false
let previewFull = false;       // the preview has taken over the screen
let modeChosen = false;        // they have said what kind of work this is

function isCompact(){ return compactQ().matches; }
function isRoomy(){ return roomyQ().matches; }

/* The pieces that move, remembered where they started so they can go back. */
const homeSlot = document.querySelector(".homebar");
const topSlot = document.querySelector(".build-top");

function applyBuildLayout(){
  const compact = isCompact();
  if (compact === compactOn) { paintBuildBar(); return; }
  compactOn = compact;
  document.documentElement.dataset.build = compact ? "compact" : "wide";

  const actions = document.querySelector(".build-actions");
  const titles = document.querySelector(".build-titles");
  /* Nothing to move about if the page never got built, which is how the
     checking scripts run it. */
  if (!actions || !titles || !homeSlot || !topSlot){ paintBuildBar(); return; }
  if (compact){
    /* Save and the menu sit beside the cog; everything else on that row is
       folded into the Save pop-up. */
    homeSlot.appendChild(actions);
    $("buildBar").hidden = false;
    $("modeChip").hidden = false;
    $("saveSite").textContent = "Save";
  } else {
    topSlot.appendChild(titles);
    topSlot.appendChild(actions);
    $("buildBar").hidden = true;
    $("modeChip").hidden = true;
    $("saveSite").textContent = "Save to the site";
    stopPreviewing();
  }
  paintBuildBar();
  fitPreview();
}

/* What belongs on the one row of controls, which depends on the kind of
   work: an assessment has no pages to add, a practical has both. */
function paintBuildBar(){
  if (!isCompact()) return;
  const scroll = $("buildBarScroll");
  if (!scroll || !$("addPageBtn") || !$("assessTabs") || !$("modeChipName")) return;
  const assess = !!lesson.assessment;
  const practical = !!lesson.practical;
  $("addPageBtn").hidden = assess && !practical;
  /* The tab strip is moved in beside New page rather than copied, so the
     three buttons keep working exactly as they do on a desktop. */
  const tabs = $("assessTabs");
  if (assess || practical){
    tabs.hidden = false;
    if (tabs.parentNode !== scroll) scroll.appendChild(tabs);
  } else {
    tabs.hidden = true;
  }
  $("modeChipName").textContent = practical ? "Practical assessment"
    : assess ? "Assessment"
    : lesson.homework ? "Home learning" : "Lesson";
}

/* ---------- which kind of work ---------- */
function modePicker(force){
  openModal(box => {
    box.appendChild(el("h2","","What are you making?"));
    const list = el("div","modepick");
    [["Lesson", () => { lesson.homework = false; setMode(false, false); }],
     ["Assessment", () => setMode(true, false)],
     ["Practical assessment", () => { lesson.homework = false; setMode(false, true); }],
     ["Home learning", () => { lesson.homework = true; setMode(false, false); }]
    ].forEach(pair => {
      const b = el("button","modepick-item", pair[0]);
      b.addEventListener("click", () => {
        pair[1]();
        modeChosen = true;
        closeModal();
        paintBuildBar();
      });
      list.appendChild(b);
    });
    box.appendChild(list);
    if (!force){
      const no = el("button","btn-ghost modal-stay","Cancel");
      no.addEventListener("click", closeModal);
      box.appendChild(no);
    }
  });
}
on("modeChip", "click", () => modePicker(false));

/* ---------- the Save pop-up ----------
   Everything that used to sit along the top of the page, asked for at the
   moment it matters rather than taking up room while a lesson is written. */
function savePopup(){
  const titles = document.querySelector(".build-titles");
  const home = titles.parentNode;                  // to put the pickers back
  openModal(box => {
    box.appendChild(el("h2","","Save this lesson"));

    const w1 = el("div","bfield");
    w1.appendChild(el("label","","Lesson title"));
    const t1 = el("input"); t1.value = lesson.title || "";
    t1.addEventListener("input", () => { lesson.title = t1.value; saveDraft(); showTitle(); });
    w1.appendChild(t1); box.appendChild(w1);

    const w2 = el("div","bfield");
    w2.appendChild(el("label","","One line for the home page"));
    const t2 = el("input"); t2.value = lesson.intro || "";
    t2.addEventListener("input", () => { lesson.intro = t2.value; saveDraft(); });
    w2.appendChild(t2); box.appendChild(w2);

    /* The real pickers are moved in, not copied, so "+ New year group" and
       everything else attached to them still works. */
    const w3 = el("div","bfield savepickers");
    w3.appendChild(el("label","","Year group and unit"));
    w3.appendChild($("lYear"));
    w3.appendChild($("lUnit"));
    box.appendChild(w3);

    const go = el("button","btn-primary modal-cta","Save to the site");
    go.addEventListener("click", () => { closeModal(); saveToSite(); });
    box.appendChild(go);
    const later = el("button","btn-ghost modal-stay","Not yet");
    later.addEventListener("click", closeModal);
    box.appendChild(later);
  });
  /* however the pop-up closes, the pickers go home */
  const back = () => {
    if (!$("mBack").hidden) return;
    titles.appendChild($("lYear"));
    titles.appendChild($("lUnit"));
    document.removeEventListener("hubModalClosed", back);
  };
  document.addEventListener("hubModalClosed", back);
}

/* ---------- the live preview ---------- */
function stopPreviewing(){
  previewFull = false;
  document.documentElement.dataset.preview = "";
  const t = $("prevToggle");
  if (t) t.textContent = "Preview";
}
on("prevToggle", "click", () => {
  previewFull = !previewFull;
  document.documentElement.dataset.preview = previewFull ? "full" : "";
  $("prevToggle").textContent = previewFull ? "Back to editing" : "Preview";
  /* The bar's real height, so the preview starts underneath it however many
     buttons the bar happens to be carrying. */
  const bar = $("buildBar");
  if (bar) document.documentElement.style.setProperty("--buildbar-h",
             Math.round(bar.getBoundingClientRect().height) + "px");
  if (previewFull) refreshPreview();
  fitPreview();
});

/* On a roomy screen the preview sits along the bottom at the shape of a real
   lesson rather than a squashed one: the frame is laid out at a proper size
   and then scaled down, so text inside it stays in proportion. */
function fitPreview(){
  const frame = $("prev");
  const box = document.querySelector(".build-preview");
  if (!frame || !box) return;
  const roomy = isCompact() && isRoomy() && !previewFull;
  if (!roomy){
    frame.style.removeProperty("width");
    frame.style.removeProperty("height");
    frame.style.removeProperty("transform");
    const h = box.querySelector(".prev-hold");
    if (h){ h.style.removeProperty("height"); h.style.removeProperty("width"); h.style.removeProperty("margin"); }
    box.classList.remove("scaled");
    const list = document.querySelector(".build-list");
    if (list) list.style.removeProperty("padding-bottom");
    return;
  }
  box.classList.add("scaled");
  const holder = box.querySelector(".prev-hold") || box;
  const w = box.clientWidth;              // the holder's own width is set below
  if (!w) return;
  const NATURAL = 1280;                       // laid out as a small laptop
  const NAT_H = NATURAL * 9 / 16;
  /* Never more than this much of the screen: the point of it is to watch a
     lesson take shape while writing it, not to write in the strip left over
     above a preview. */
  const cap = Math.max(180, window.innerHeight * 0.36);
  const scale = Math.min(w / NATURAL, cap / NAT_H);
  frame.style.width = NATURAL + "px";
  frame.style.height = Math.round(NAT_H) + "px";
  frame.style.transform = "scale(" + scale + ")";
  holder.style.height = Math.round(NAT_H * scale) + "px";
  /* centred when the cap has made it narrower than the screen */
  holder.style.width = Math.round(NATURAL * scale) + "px";
  holder.style.margin = "0 auto";
  /* Leave exactly as much room under the cards as the preview takes, so the
     last task is reachable and there is no band of empty page either. */
  const list = document.querySelector(".build-list");
  if (list) list.style.paddingBottom = (box.getBoundingClientRect().height + 20) + "px";
}

try{
  compactQ().addEventListener("change", applyBuildLayout);
  roomyQ().addEventListener("change", () => { applyBuildLayout(); fitPreview(); });
}catch(e){
  compactQ().addListener(applyBuildLayout);      // older browsers
  roomyQ().addListener(fitPreview);
}
window.addEventListener("resize", fitPreview);
on("addPageBtn", "click", () => {
  const made = BLANK.page();
  lesson.blocks.push(made);
  scrollToBlock = made;
  render(); schedulePreview();
});

/* ---------------- go ---------------- */
loadDraft();
if (!lesson.topics) lesson.topics = {};


paintPickers();
setMode(!!lesson.assessment && !lesson.practical, !!lesson.practical);
applyBuildLayout();
loadUnitsAndMaybeLesson();
render();
refreshPreview();
fitPreview();
if (window.initSettings) initSettings($("setBtn"));
/* A fresh lesson on a narrow screen starts by asking what it is, because
   the row of kinds that asks on a desktop is not on the page there. One
   opened for editing already knows. */
if (isCompact() && !new URLSearchParams(location.search).get("edit")){
  setTimeout(() => { if (!modeChosen) modePicker(true); }, 300);
}
</script>
